<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>キッズ・アートパーク</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --main: #ff8bb0; --bg: #f8f9fa; }
        body { background: var(--bg); margin: 0; padding: 0; font-family: sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; user-select: none; }
        
        .header { background: white; padding: 10px 15px; border-bottom: 2px solid #eee; display: flex; align-items: center; justify-content: space-between; z-index: 100; }
        .back-btn { background: #f0f0f0; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .title { color: var(--main); font-weight: 900; font-size: 18px; }

        .screen { flex: 1; display: none; overflow-y: auto; padding: 20px; }
        .screen.active { display: flex; flex-direction: column; }

        /* カテゴリー・お題選択 */
        .category-title { font-size: 14px; color: #888; margin: 15px 0 10px; font-weight: bold; border-left: 4px solid var(--main); padding-left: 10px; }
        .theme-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .theme-card { background: white; border-radius: 15px; padding: 10px; text-align: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.2s; border: 2px solid transparent; }
        .theme-card:active { transform: scale(0.9); }
        .theme-card span { display: block; margin-top: 5px; font-size: 12px; font-weight: bold; color: #666; }

        /* モード選択（なぞるか、ぬるか） */
        .mode-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(4px); }
        .mode-box { background: white; padding: 30px; border-radius: 30px; text-align: center; width: 80%; max-width: 300px; }
        .mode-btn { width: 100%; padding: 20px; margin: 10px 0; border-radius: 20px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; color: white; }

        /* キャンバス */
        #canvas-container { flex: 1; position: relative; margin: 10px; background: white; border-radius: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.1); overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }
        #top-canvas { pointer-events: none; }

        /* パレット */
        .footer-panel { background: white; border-top: 2px solid #eee; padding: 12px; }
        .color-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        #hue-slider { -webkit-appearance: none; flex: 1; height: 35px; border-radius: 20px; background: linear-gradient(to right, #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%); cursor: pointer; }
        #hue-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 35px; height: 35px; border: 4px solid white; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.2); }
        .color-preview { width: 45px; height: 45px; border-radius: 12px; border: 3px solid #eee; }

        .tool-row { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-eraser { background: #e9ecef; color: #444; }
        .btn-eraser.active { background: #444; color: white; }
        .btn-clear { background: #eee; color: #888; }
        .btn-done { background: var(--main); color: white; font-size: 16px; box-shadow: 0 4px 0 #ff6f9e; }
    </style>
</head>
<body>

    <div class="header">
        <button class="back-btn" onclick="goBack()">◀ もどる</button>
        <div class="title" id="page-title">あそびば</div>
        <div style="width:60px;"></div>
    </div>

    <div id="screen-theme" class="screen active">
        <div class="category-title">🐶 どうぶつ</div>
        <div class="theme-grid" id="grid-animals"></div>
        
        <div class="category-title">🍔 たべもの</div>
        <div class="theme-grid" id="grid-food"></div>
        
        <div class="category-title">🚀 のりもの</div>
        <div class="theme-grid" id="grid-vehicles"></div>
    </div>

    <div id="mode-popup" class="mode-overlay" onclick="closeModePopup()">
        <div class="mode-box" onclick="event.stopPropagation()">
            <h3 id="popup-name">おなまえ</h3>
            <button class="mode-btn" style="background:#b49cff;" onclick="confirmStart('trace')">✏️ せんなぞり</button>
            <button class="mode-btn" style="background:#ffcc80;" onclick="confirmStart('color')">🖌️ ぬりえ</button>
        </div>
    </div>

    <div id="screen-canvas" class="screen" style="padding:0;">
        <div id="canvas-container">
            <canvas id="bottom-canvas"></canvas>
            <canvas id="top-canvas"></canvas>
        </div>

        <div class="footer-panel">
            <div class="color-row">
                <div id="current-color-box" class="color-preview"></div>
                <input type="range" id="hue-slider" min="0" max="360" value="0" oninput="updateColor()">
                <button id="eraser-btn" class="btn btn-eraser" style="flex:0.3;" onclick="toggleEraser()">🧼</button>
            </div>
            <div class="tool-row">
                <button class="btn btn-clear" onclick="clearCanvas()">🗑️ けす</button>
                <button class="btn btn-done" onclick="finishArt()">できた！✨</button>
            </div>
        </div>
    </div>

    <script>
        const bCanvas = document.getElementById('bottom-canvas');
        const bCtx = bCanvas.getContext('2d');
        const tCanvas = document.getElementById('top-canvas');
        const tCtx = tCanvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        let mode = ''; 
        let currentId = '';
        let isDrawing = false;
        let isEraser = false;
        let lastX = 0, lastY = 0;
        let currentColor = '#ff0000';

        // ネット素材風・精密線画データ
        const artwork = {
            panda: "M50,85 C30,85 20,70 20,50 C20,30 30,15 50,15 C70,15 80,30 80,50 C80,70 70,85 50,85 M25,25 A12,12 0 1,1 40,15 M60,15 A12,12 0 1,1 75,25 M35,45 A8,8 0 1,0 45,55 M55,55 A8,8 0 1,0 65,45 M45,65 Q50,75 55,65",
            elephant: "M30,80 C10,80 5,60 5,40 C5,20 25,10 50,10 C75,10 95,20 95,45 C95,65 85,75 75,75 L75,90 L60,90 L60,75 C50,75 40,80 30,80 M20,40 A25,35 0 0,1 5,30 M80,45 A25,35 0 0,0 95,35 M40,40 A5,5 0 1,1 40.1,40 M60,40 A5,5 0 1,1 60.1,40",
            cat: "M50,80 C30,80 20,70 20,45 C20,25 35,15 50,15 C65,15 80,25 80,45 C80,70 70,80 50,80 M25,25 L10,5 L35,15 M75,25 L90,5 L65,15 M35,45 A5,5 0 1,0 40,50 M60,50 A5,5 0 1,0 65,45 M40,65 Q50,75 60,65",
            rabbit: "M50,85 C35,85 25,75 25,60 C25,45 35,35 50,35 C65,35 75,45 75,60 C75,75 65,85 50,85 M35,40 C25,30 20,10 30,5 C40,0 45,20 45,35 M65,40 C75,30 80,10 70,5 C60,0 55,20 55,35",
            parfait: "M30,20 Q50,5 70,20 L70,60 Q50,85 30,60 Z M30,60 L20,95 L80,95 L70,60 M50,20 m-5,0 a5,5 0 1,1 10,0",
            donut: "M50,50 m-40,0 a40,40 0 1,0 80,0 a40,40 0 1,0 -80,0 M50,50 m-15,0 a15,15 0 1,0 30,0 a15,15 0 1,0 -30,0",
            burger: "M20,60 Q50,30 80,60 L80,80 Q50,95 20,80 Z M20,60 L80,60 M20,70 L80,70",
            apple: "M50,85 C30,85 15,70 15,50 C15,30 30,15 50,25 C70,15 85,30 85,50 C85,70 70,85 50,85 M50,25 L55,5 Q65,5 60,15 Z",
            police: "M10,70 L20,45 L80,45 L90,70 L95,70 L95,85 L5,85 L5,70 Z M25,85 A10,10 0 0,1 45,85 M65,85 A10,10 0 0,1 85,85 M45,45 L55,45 L55,35 L45,35 Z",
            airplane: "M10,50 L40,45 L50,10 L60,45 L90,50 L60,55 L55,85 L45,85 L40,55 Z",
            rocket: "M50,5 L30,40 L30,80 L70,80 L70,40 Z M30,80 L15,95 L30,95 Z M70,80 L85,95 L70,95 Z M50,30 A10,10 0 1,1 50.1,30",
            ufo: "M20,60 Q50,30 80,60 Q95,70 80,80 Q50,90 20,80 Q5,70 20,60 M35,45 Q50,20 65,45"
        };

        const themes = [
            { id: 'panda', name: 'パンダ', icon: '🐼', cat: 'animals' },
            { id: 'elephant', name: 'ゾウ', icon: '🐘', cat: 'animals' },
            { id: 'cat', name: 'ねこ', icon: '🐱', cat: 'animals' },
            { id: 'rabbit', name: 'うさぎ', icon: '🐰', cat: 'animals' },
            { id: 'parfait', name: 'パフェ', icon: '🍦', cat: 'food' },
            { id: 'donut', name: 'ドーナツ', icon: '🍩', cat: 'food' },
            { id: 'burger', name: 'バーガー', icon: '🍔', cat: 'food' },
            { id: 'apple', name: 'りんご', icon: '🍎', cat: 'food' },
            { id: 'police', name: 'パトカー', icon: '🚓', cat: 'vehicles' },
            { id: 'airplane', name: 'ひこうき', icon: '✈️', cat: 'vehicles' },
            { id: 'rocket', name: 'ロケット', icon: '🚀', cat: 'vehicles' },
            { id: 'ufo', name: 'UFO', icon: '🛸', cat: 'vehicles' }
        ];

        // お題リスト作成
        function initThemes() {
            themes.forEach(t => {
                const grid = document.getElementById(`grid-${t.cat}`);
                grid.innerHTML += `<div class="theme-card" onclick="openModePopup('${t.id}', '${t.name}')">
                    <div style="font-size:35px;">${t.icon}</div><span>${t.name}</span>
                </div>`;
            });
        }

        function openModePopup(id, name) {
            currentId = id;
            document.getElementById('popup-name').innerText = name;
            document.getElementById('mode-popup').style.display = 'flex';
        }

        function closeModePopup() { document.getElementById('mode-popup').style.display = 'none'; }

        function confirmStart(m) {
            mode = m;
            closeModePopup();
            switchScreen('screen-canvas');
            document.getElementById('page-title').innerText = (mode==='trace'?'なぞってみよう':'ぬってみよう');
            resizeCanvas();
        }

        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function goBack() {
            const current = document.querySelector('.screen.active').id;
            if (current === 'screen-canvas') switchScreen('screen-theme');
            else location.href = 'index.html';
        }

        function resizeCanvas() {
            const w = container.offsetWidth, h = container.offsetHeight;
            bCanvas.width = tCanvas.width = w; bCanvas.height = tCanvas.height = h;
            drawOutline();
        }

        function updateColor() {
            const h = document.getElementById('hue-slider').value;
            currentColor = `hsl(${h}, 100%, 50%)`;
            document.getElementById('current-color-box').style.background = currentColor;
            isEraser = false; document.getElementById('eraser-btn').classList.remove('active');
        }

        function toggleEraser() {
            isEraser = !isEraser;
            document.getElementById('eraser-btn').classList.toggle('active', isEraser);
        }

        function drawOutline() {
            tCtx.clearRect(0, 0, tCanvas.width, tCanvas.height);
            const pathData = artwork[currentId];
            if (!pathData) return;
            const p = new Path2D(pathData);
            const scale = Math.min(tCanvas.width, tCanvas.height) / 100 * 0.8;
            tCtx.save();
            tCtx.translate(tCanvas.width/2 - 50*scale, tCanvas.height/2 - 50*scale);
            tCtx.scale(scale, scale);
            tCtx.lineCap = 'round'; tCtx.lineJoin = 'round';
            if (mode === 'trace') { tCtx.strokeStyle = '#ddd'; tCtx.lineWidth = 2; tCtx.setLineDash([5, 5]); } 
            else { tCtx.strokeStyle = '#333'; tCtx.lineWidth = 4; tCtx.setLineDash([]); }
            tCtx.stroke(p);
            tCtx.restore();
        }

        function getXY(e) {
            const rect = bCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function start(e) { isDrawing = true; const pos = getXY(e); lastX = pos.x; lastY = pos.y; draw(e); }
        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getXY(e);
            bCtx.beginPath(); bCtx.moveTo(lastX, lastY); bCtx.lineTo(pos.x, pos.y);
            bCtx.lineCap = 'round'; bCtx.lineJoin = 'round';
            if (isEraser) { bCtx.globalCompositeOperation = 'destination-out'; bCtx.lineWidth = 40; } 
            else { bCtx.globalCompositeOperation = 'source-over'; bCtx.strokeStyle = currentColor; bCtx.lineWidth = (mode === 'trace' ? 8 : 25); }
            bCtx.stroke(); lastX = pos.x; lastY = pos.y;
        }

        bCanvas.addEventListener('touchstart', start);
        bCanvas.addEventListener('touchmove', draw);
        bCanvas.addEventListener('touchend', () => isDrawing = false);
        bCanvas.addEventListener('mousedown', start);
        bCanvas.addEventListener('mousemove', draw);
        bCanvas.addEventListener('mouseup', () => isDrawing = false);

        function clearCanvas() { if(confirm('ぜんぶ けす？')) bCtx.clearRect(0, 0, bCanvas.width, bCanvas.height); }
        function finishArt() { 
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#ff8bb0', '#ffcc80', '#b49cff'] });
            setTimeout(() => alert('とっても 上手に できたね！💮'), 500);
        }

        window.onload = initThemes;
    </script>
</body>
</html>
