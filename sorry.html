<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ごめんね えほん - 全10話</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --wood-dark: #79553D;
            --wood-light: #DEB887;
            --paper: #FFFdf5;
            --primary: #ff8bb0;
            --blue: #7da6ff;
            --text: #444;
            --curtain: #c0392b;
        }

        * { box-sizing: border-box; touch-action: manipulation; user-select: none; }

        body {
            font-family: "M PLUS Rounded 1c", sans-serif;
            background: #eef7e8;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; color: var(--text);
        }

        .container {
            width: 100%; max-width: 600px;
            padding: 10px;
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- ナビゲーションバー --- */
        .top-bar {
            width: 100%; display: flex; justify-content: flex-start; align-items: center;
            padding: 5px 0 15px 0;
        }
        .nav-btn {
            text-decoration: none; background: white; color: var(--wood-dark);
            padding: 10px 15px; font-size: 14px; font-weight: 900;
            border-radius: 20px; border: 3px solid var(--wood-dark);
            box-shadow: 0 4px 0 var(--wood-dark); cursor: pointer; transition: 0.1s;
            display: flex; align-items: center; gap: 5px;
        }
        .nav-btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--wood-dark); }

        /* --- 紙芝居の舞台 --- */
        .kamishibai-stage {
            background: var(--wood-light);
            border: 12px solid var(--wood-dark);
            border-radius: 10px;
            width: 100%; aspect-ratio: 4/3;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2), inset 0 0 15px rgba(0,0,0,0.3);
            position: relative; overflow: hidden;
            display: flex; flex-direction: column;
            margin-bottom: 20px;
        }

        /* 🎭 幕（カーテン） */
        .curtain {
            position: absolute; top: 0; width: 50%; height: 100%;
            background: var(--curtain); z-index: 50;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-right: 4px solid rgba(0,0,0,0.2);
        }
        .curtain.left { left: 0; transform-origin: left; }
        .curtain.right { right: 0; transform-origin: right; border-right: none; border-left: 4px solid rgba(0,0,0,0.2); }
        .curtain-open .curtain.left { transform: translateX(-100%); }
        .curtain-open .curtain.right { transform: translateX(100%); }

        /* 💖 なかよしゲージ */
        .nakayoshi-meter {
            position: absolute; top: 10px; right: 10px;
            background: rgba(255,255,255,0.9); padding: 5px 10px;
            border-radius: 15px; border: 3px solid var(--wood-dark);
            font-size: 18px; font-weight: bold; color: var(--wood-dark);
            z-index: 40; display: flex; align-items: center; gap: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* --- 絵のエリア --- */
        .picture-area {
            flex: 1; background: var(--paper);
            display: flex; align-items: center; justify-content: center;
            font-size: 80px; position: relative;
            border-bottom: 4px solid var(--wood-dark);
            transition: transform 0.5s ease-in-out, opacity 0.5s ease-in-out;
            cursor: pointer;
        }
        .tap-hint { animation: pulseHint 1.5s infinite; }
        @keyframes pulseHint { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* 💭 こころの声（フキダシ） */
        .thought-bubble {
            position: absolute; top: 10%; left: 50%; transform: translateX(-50%) scale(0);
            background: white; border: 4px solid var(--blue); border-radius: 20px;
            padding: 10px 15px; font-size: 16px; font-weight: bold; color: #333;
            opacity: 0; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); z-index: 30; white-space: nowrap;
        }
        .thought-bubble::after {
            content: ''; position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%);
            border-width: 12px 12px 0; border-style: solid;
            border-color: var(--blue) transparent transparent transparent;
        }
        .show-thought { transform: translateX(-50%) scale(1); opacity: 1; }

        /* --- テキストエリア --- */
        .text-area {
            height: 35%; background: white;
            padding: 15px; font-size: 17px; font-weight: 700;
            line-height: 1.5; display: flex; align-items: center; justify-content: center;
            text-align: center; color: #333;
        }

        /* --- コントロール（ボタン） --- */
        .controls { width: 100%; display: flex; flex-direction: column; gap: 10px; padding: 0 10px; }

        .btn {
            background: white; color: var(--text); border: 4px solid #ddd;
            padding: 12px 20px; font-size: 16px; font-weight: 900;
            border-radius: 20px; cursor: pointer;
            box-shadow: 0 6px 0 #ddd; transition: 0.1s; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn:active { transform: translateY(6px); box-shadow: 0 0 0 #ddd; }
        
        .btn-next { background: var(--primary); color: white; border-color: #d8688d; box-shadow: 0 6px 0 #d8688d; }
        .btn-choice { background: #fff; border-color: var(--blue); color: var(--blue); }
        .btn-bad { border-color: #ff5252; color: #ff5252; }

        /* --- 画面管理 --- */
        .screen { display: none; width: 100%; flex-direction: column; align-items: center; }
        .active { display: flex; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- タイトル画面 --- */
        .title-box { text-align: center; margin-top: 10px; }
        .title-box h1 { color: var(--wood-dark); font-size: 30px; margin-bottom: 5px; }
        .title-box p { font-weight: bold; color: #666; margin-bottom: 15px; font-size: 14px;}

        /* おはなしリスト（スクロール対応） */
        .book-list {
            width: 100%; max-width: 450px;
            display: flex; flex-direction: column; gap: 10px;
            max-height: 50vh; overflow-y: auto; padding: 10px;
            border: 2px dashed #ccc; border-radius: 15px; background: rgba(255,255,255,0.5);
        }

        .book-btn {
            background: white; border: 3px solid var(--wood-dark); border-radius: 12px;
            padding: 12px; width: 100%; cursor: pointer;
            display: flex; align-items: center; gap: 15px; box-shadow: 0 4px 0 var(--wood-dark);
            text-align: left; transition: 0.1s; flex-shrink: 0;
        }
        .book-btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--wood-dark); }
        .book-icon { font-size: 24px; width: 35px; text-align: center; }
        .book-title { font-size: 15px; font-weight: bold; color: var(--wood-dark); }

        /* --- やりなおし・クリア --- */
        .feedback-overlay {
            position: absolute; top:0; left:0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95); z-index: 100;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px;
        }
        .feedback-overlay h2 { font-size: 24px; margin-bottom: 10px; }
        .feedback-overlay p { font-weight: bold; line-height: 1.5; color: #555; margin-bottom: 20px; }

        #confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; display: none; }
        .confetti-piece { position: absolute; font-size: 30px; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }
    </style>
</head>
<body>

<div id="confetti"></div>

        <div class="book-list">

    <div id="screen-game" class="screen">

            </div>

                <button class="btn btn-next" onclick="restartStory()">やりなおす</button>
            </div>

            <div id="happy-end-overlay" class="feedback-overlay">
                <h2 style="color: #6ecb63;">なかよし！✨</h2>

                <button class="btn btn-next" onclick="goHome()">えほん を とじる</button>
            </div>
        </div>

        <div class="controls" id="controls"></div>
    </div>

</div>

            4: { pic: "👦🤝", text: "「わらって ごめんね。て を つなごう。」\nやさしく こえ を かけました。", thought: "いたかった よね、ごめんね", next: 5 },

    let currentStoryData = null;
    let currentStoryId = "";
    let currentPageId = 1;
    let heartCount = 2; // なかよし度

    function updateMeter() {
        let hearts = "絆：";
        for(let i=0; i<3; i++) hearts += (i < heartCount) ? "💛" : "🖤";
        document.getElementById('meter').innerText = hearts;
    }

    function startStory(storyId) {
        currentStoryId = storyId;
        currentStoryData = STORIES[storyId];
        currentPageId = 1;
        heartCount = 2; 
        
        document.getElementById('screen-title').classList.remove('active');
        document.getElementById('screen-game').classList.add('active');
        document.getElementById('bad-end-overlay').style.display = "none";
        document.getElementById('happy-end-overlay').style.display = "none";
        
        const stage = document.getElementById('stage');
        stage.classList.remove('curtain-open');
        updateMeter();

        setTimeout(() => {
            stage.classList.add('curtain-open');
            renderPage();
        }, 500);
    }

    function renderPage() {
        const page = currentStoryData[currentPageId];
        
        document.getElementById('thought').classList.remove('show-thought');
        if(page.thought) document.getElementById('thought').innerText = page.thought;

        const picArea = document.getElementById('picture-area');
        picArea.style.opacity = 0;
        picArea.style.transform = "translateX(20px)";
        
        setTimeout(() => {
            document.getElementById('pic-emoji').innerText = page.pic;
            document.getElementById('text-area').innerText = page.text;
            picArea.style.opacity = 1;
            picArea.style.transform = "translateX(0)";
        }, 200);

        const controls = document.getElementById('controls');
        controls.innerHTML = "";

        if (page.choices) {
            picArea.classList.add('tap-hint');
            page.choices.forEach(c => {
                const btn = document.createElement('button');
                btn.className = c.type === "good" ? "btn btn-choice" : "btn btn-choice btn-bad";
                btn.innerText = c.text;
                btn.onclick = () => {
                    if(c.type === "good") { heartCount = 3; updateMeter(); }
                    else { heartCount = 1; updateMeter(); }
                    goToNext(c.next);
                };
                controls.appendChild(btn);
            });
        } else {
            picArea.classList.remove('tap-hint');
            const btn = document.createElement('button');
            btn.className = "btn btn-next";
            btn.innerText = "つぎへ ➡";
            btn.onclick = () => goToNext(page.next);
            controls.appendChild(btn);
        }
    }

    function showThought() {
        const thought = document.getElementById('thought');
        thought.classList.add('show-thought');
        setTimeout(() => { thought.classList.remove('show-thought'); }, 2500);
    }

    function goToNext(nextId) {
        if (nextId === "clear") {
            showClear();
        } else if (String(nextId).startsWith("bad")) {
            showBadEnd(currentStoryData[nextId].reason);
        } else {
            currentPageId = nextId;
            renderPage();
        }
    }

    function showBadEnd(reasonText) {
        document.getElementById('bad-reason').innerText = reasonText;
        document.getElementById('bad-end-overlay').style.display = "flex";
        document.getElementById('controls').innerHTML = "";
    }

    function restartStory() {
        document.getElementById('bad-end-overlay').style.display = "none";
        heartCount = 2; updateMeter();
        currentPageId = 1;
        renderPage();
    }

    function showClear() {
        document.getElementById('happy-end-overlay').style.display = "flex";
        document.getElementById('controls').innerHTML = "";
        fireConfetti();
    }

    function goHome() {
        document.getElementById('confetti').style.display = "none";
        document.getElementById('confetti').innerHTML = "";
        document.getElementById('screen-game').classList.remove('active');
        document.getElementById('screen-title').classList.add('active');
    }

    function fireConfetti() {
        const container = document.getElementById('confetti');
        container.style.display = "block";
        const emojis = ["🎉", "✨", "🌸", "🌟", "💖"];
        for (let i = 0; i < 40; i++) {
            const conf = document.createElement('div');
            conf.className = 'confetti-piece';
            conf.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            conf.style.left = Math.random() * 100 + 'vw';
            conf.style.top = -50 + 'px';
            conf.style.fontSize = (Math.random() * 20 + 20) + 'px';
            conf.style.animationDuration = (Math.random() * 3 + 2) + 's';
            conf.style.animationDelay = (Math.random() * 0.5) + 's';
            container.appendChild(conf);
        }
    }
</script>
