<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おたすけガチャ</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .gacha-container {
            text-align: center;
            padding: 20px;
            background: #e0f7fa;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h1 { font-size: 28px; color: #006064; margin-bottom: 10px; }
        
        .gacha-machine {
            width: 220px; height: 220px;
            background: #ffccbc;
            border-radius: 50%;
            margin: 30px auto;
            display: flex;
            align-items: center; justify-content: center;
            font-size: 80px;
            border: 8px solid #ffab91;
            box-shadow: 0 10px 0 #e64a19;
            cursor: pointer;
            transition: 0.1s;
            user-select: none;
        }
        .gacha-machine:active { transform: translateY(5px); box-shadow: 0 5px 0 #e64a19; }
        
        .card {
            background: white;
            border: 4px solid #4dd0e1;
            border-radius: 20px;
            padding: 20px;
            margin: 20px auto;
            max-width: 320px;
            display: none;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .card-icon { font-size: 80px; margin-bottom: 10px; display: block; }
        .card-title { font-size: 24px; font-weight: bold; color: #0097a7; margin-bottom: 10px; }
        .card-desc { font-size: 18px; color: #555; line-height: 1.6; font-weight: bold; }

        .btn-try {
            background-color: #4dd0e1; color: white; border:none;
            padding: 12px 30px; border-radius: 30px; font-weight:bold; font-size: 16px;
            cursor: pointer; margin-top: 20px; box-shadow: 0 4px 0 #00acc1;
        }
        .btn-try:active { transform: translateY(4px); box-shadow: none; }
        
        #instruction-text {
            font-size: 14px; color: #888;
            transition: opacity 0.3s;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

        <p style="font-weight:bold; color:#555;">

            ボタンを おしてね！
        </p>
        
        <div class="gacha-machine" onclick="playGacha()">💊</div>
        
        <p id="instruction-text">👆 ボタンをおしてね</p>

            <span id="card-icon" class="card-icon"></span>
            <div id="card-title" class="card-title"></div>
            <div id="card-desc" class="card-desc"></div>
            <button class="btn-try" onclick="resetGacha()">もういっかい</button>
        </div>

        <br><br>
        <a href="index.html" class="btn-home" style="background:#00bcd4;">🏠 ホームにもどる</a>
    </div>

        function playGacha() {
            const machine = document.querySelector('.gacha-machine');
            const instruction = document.getElementById('instruction-text');

            machine.style.pointerEvents = 'none'; 
            instruction.style.display = 'none'; 

            machine.style.transform = "rotate(10deg)";
            setTimeout(() => machine.style.transform = "rotate(-10deg)", 100);
            setTimeout(() => machine.style.transform = "rotate(10deg)", 200);
            setTimeout(() => machine.style.transform = "rotate(0deg)", 300);

            setTimeout(() => {
                const card = CARDS[Math.floor(Math.random() * CARDS.length)];
                
                document.getElementById('card-icon').innerText = card.icon;
                document.getElementById('card-title').innerText = card.title;
                document.getElementById('card-desc').innerText = card.desc;
                
                const cardEl = document.getElementById('result-card');
                cardEl.style.display = "block";
                machine.style.display = 'none';

                sendGachaLog(card);

            }, 400);
        }

        function sendGachaLog(card) {
            if (!GAS_URL) return;
            fetch(GAS_URL, {
                method: 'POST',
                redirect: "follow",
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    type: "gacha_log",
                    title: card.icon + " " + card.title,
                    desc: card.desc
                })
            }).catch(e => console.log(e));
        }

        function resetGacha() {
            document.getElementById('result-card').style.display = "none";
            const machine = document.querySelector('.gacha-machine');
            const instruction = document.getElementById('instruction-text');

            machine.style.display = "flex";
            machine.style.pointerEvents = 'auto';
            instruction.style.display = 'block';
        }

</body>
</html>
