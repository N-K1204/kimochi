<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ときめき共有カレンダー</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --sweet-pink: #ff9dbd;
            --soft-purple: #b49cff;
            --main-text: #5d5d5d;
        }

        body { 
            background: #fffcfd; 
            font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif; 
            margin: 0; padding: 0; 
            color: var(--main-text); 
            height: 100vh; 
            display: flex; flex-direction: column; 
            overflow: hidden; 
        }

        /* --- ヘッダー --- */
        .app-header {
            padding: 15px;
            display: flex; align-items: center; justify-content: space-between;
            background: white; border-bottom: 1px solid #fdf0f5;
            z-index: 100;
        }

        .btn-back {
            text-decoration: none; background: #f7f7f7;
            padding: 10px 18px; border-radius: 50px;
            color: #888; font-size: 14px; font-weight: bold;
            transition: 0.3s;
        }

        .header-title { font-size: 18px; font-weight: bold; color: var(--sweet-pink); }

        /* --- 上半分：ヒーローエリア --- */
        .hero-section {
            flex: 0.9;
            display: flex; align-items: center; justify-content: center;
            padding: 15px; background: linear-gradient(to bottom, #fff, #fff8fb);
        }

        .event-hero-card {
            width: 100%; max-width: 420px;
            background: white; border-radius: 40px;
            padding: 35px 20px; text-align: center;
            box-shadow: 0 15px 35px rgba(255, 139, 176, 0.12);
            border: 2px solid white; position: relative;
            overflow: hidden;
            animation: breathe 4s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .hero-label { font-size: 12px; color: var(--sweet-pink); font-weight: bold; letter-spacing: 2px; }
        .hero-title { font-size: 26px; margin: 15px 0; color: #444; font-weight: 900; }
        .hero-days { font-size: 60px; font-weight: 900; color: var(--sweet-pink); }
        .hero-unit { font-size: 24px; margin-left: 5px; }

        /* --- 下半分：カレンダーエリア --- */
        .calendar-section {
            flex: 1.1;
            padding: 10px 20px 40px;
            background: white; border-top-left-radius: 50px; border-top-right-radius: 50px;
            box-shadow: 0 -15px 40px rgba(255, 139, 176, 0.05);
            display: flex; flex-direction: column;
        }

        .calendar-nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 10px;
        }
        .nav-month { font-size: 22px; font-weight: 900; color: #555; }
        .btn-nav { 
            background: #fff0f5; border: none; width: 45px; height: 45px; 
            border-radius: 20px; font-size: 24px; cursor: pointer; color: var(--sweet-pink);
            transition: 0.2s;
        }
        .btn-nav:active { transform: scale(0.8); }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; flex: 1; }
        .weekday { text-align: center; font-size: 12px; font-weight: bold; color: #ddd; padding-bottom: 8px; }
        
        .day-cell {
            background: #fafafa; border-radius: 20px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative; cursor: pointer;
            transition: 0.3s; min-height: 50px;
        }
        .day-cell:active { transform: scale(0.9) rotate(2deg); background: #fff5f8; }
        .day-cell.empty { background: transparent; cursor: default; }
        
        /* 予定がある日のスタイル */
        .has-event {
            background: #fff0f5;
            border: 1px solid #ffdeeb;
        }
        .has-event .day-num {
            background: var(--sweet-pink);
            color: white !important;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(255, 157, 189, 0.4);
            animation: pop-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop-in { from { transform: scale(0); } to { transform: scale(1); } }

        .day-num { font-size: 16px; font-weight: bold; color: #777; transition: 0.3s; }
        .today { border: 3.5px solid var(--soft-purple) !important; }
        
        .event-dot {
            width: 6px; height: 6px; background: white; border-radius: 50%;
            position: absolute; bottom: 8px;
        }

        /* --- 魔法の追加ボタン --- */
        .btn-add-float {
            position: fixed; bottom: 35px; right: 35px;
            width: 70px; height: 70px; background: var(--soft-purple);
            color: white; border: none; border-radius: 25px; font-size: 40px;
            box-shadow: 0 12px 25px rgba(180, 156, 255, 0.4);
            cursor: pointer; z-index: 200; display: flex; align-items: center; justify-content: center;
        }

        /* --- モーダル --- */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); display: none; z-index: 1000; backdrop-filter: blur(10px); }
        .modal-content { 
            background: white; width: 85%; max-width: 380px; margin: 10vh auto; 
            padding: 35px 25px; border-radius: 45px; text-align: center; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.1); animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        input, textarea { 
            width: 100%; padding: 18px; margin: 12px 0; border-radius: 20px; 
            border: 2px solid #fdf0f5; font-size: 16px; background: #fffcfd; 
            outline: none; box-sizing: border-box; color: #555; font-family: inherit;
        }
        textarea { height: 80px; resize: none; }
        
        .discord-switch {
            display: flex; align-items: center; justify-content: center;
            gap: 10px; margin: 10px 0; padding: 10px;
            background: #f0f4ff; border-radius: 15px; cursor: pointer;
        }

        .btn-save { 
            width: 100%; padding: 18px; background: var(--soft-purple); color: white; 
            border: none; border-radius: 20px; font-size: 18px; font-weight: bold; 
            margin-top: 20px; box-shadow: 0 8px 20px rgba(180, 156, 255, 0.3);
        }

        .detail-desc-box {
            background: #f9f9f9; padding: 15px; border-radius: 15px;
            text-align: left; font-size: 13px; white-space: pre-wrap;
            margin: 10px 0; color: #666; border: 1px dashed var(--sweet-pink);
        }

    </style>
</head>
<body>

    <header class="app-header">
        <a href="index.html" class="btn-back">🏠 ホーム</a>
        <div class="header-title">みんなのカレンダー</div>
        <div style="width: 60px;"></div>
    </header>

    <div class="hero-section">
        <div id="hero-card" class="event-hero-card">
            <div class="hero-label">NEXT HAPPY EVENT</div>
            <div id="hero-title" class="hero-title">よみこみちゅう...</div>
            <div id="hero-days-wrap">
                <span id="hero-day-num" class="hero-days">-</span>
                <span id="hero-day-unit" style="font-size:24px; color:var(--sweet-pink); font-weight:900;">日</span>
            </div>
        </div>
    </div>

    <div class="calendar-section">
        <div class="calendar-nav">
            <button class="btn-nav" onclick="changeMonth(-1)">‹</button>
            <div id="month-display" class="nav-month"></div>
            <button class="btn-nav" onclick="changeMonth(1)">›</button>
        </div>
        <div class="calendar-grid">
            <div class="weekday" style="color:#ff9dbd">日</div><div class="weekday">月</div><div class="weekday">火</div><div class="weekday">水</div><div class="weekday">木</div><div class="weekday">金</div><div class="weekday" style="color:#7da6ff">土</div>
        </div>
        <div id="calendar-body" class="calendar-grid"></div>
    </div>

    <button class="btn-add-float" onclick="openAddModal()">＋</button>

    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <h3 id="detail-date" style="margin-top:0; color: var(--sweet-pink); font-size:22px;"></h3>
            <h2 id="detail-title" style="margin: 10px 0; color: #333;"></h2>
            <div id="detail-body" class="detail-desc-box"></div>
            <div style="display: flex; gap: 10px;">
                <button onclick="openAddFromDetail()" style="flex:1; padding:12px; border:none; background:#f7f7f7; border-radius:15px; font-weight:bold; color:#888;">しゅうせい</button>
                <button onclick="deleteEventCheck()" style="flex:1; padding:12px; border:none; background:#ffeded; border-radius:15px; font-weight:bold; color:#ff8b8b;">けす</button>
            </div>
            <button onclick="closeModal('detail-modal')" style="background:none; border:none; color:#bbb; margin-top:20px; cursor:pointer; font-weight:bold;">とじる</button>
        </div>
    </div>

    <div id="add-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0; color: var(--soft-purple); font-size:22px;">よていをかこう</h3>
            <input type="date" id="ev-date">
            <input type="text" id="ev-title" placeholder="イベントのなまえ">
            <textarea id="ev-desc" placeholder="しおり"></textarea>
            <label class="discord-switch">
                <input type="checkbox" id="ev-discord" checked>
                <span style="font-size: 12px; font-weight: bold; color: #5865F2;">つうちする</span>
            </label>
            <button onclick="saveEvent()" id="save-btn" class="btn-save">みんなにおしえる</button>
            <button onclick="closeModal('add-modal')" style="background:none; border:none; color:#bbb; margin-top:15px; cursor:pointer; font-weight:bold;">やめる</button>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyoM20f2RskSPGOr8qQmsUkL5M6Ykusyp6wBaRit71hsvdQ4gbXIO6HrAAlkq4RCbJT/exec"; 

        let allEvents = [];
        let currentDate = new Date(); 
        let selectedDateStr = "";

        // 日付オブジェクトを YYYY-MM-DD 文字列に変換（時差問題を回避）
        function formatDate(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        async function loadData() {
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({type: 'get_calendar'}) });
                const rawData = await res.json();
                
                // GASから届く日付データを文字列に正規化
                allEvents = rawData.map(e => {
                    const d = new Date(e.date);
                    return { ...e, dateStr: formatDate(d) };
                });

                updateHero();
                renderCalendar();
            } catch (e) { console.error("Error"); }
        }

        function updateHero() {
            const nowStr = formatDate(new Date());
            const now = new Date(nowStr);

            const futureEvents = allEvents.map(e => {
                const d = new Date(e.dateStr);
                const diff = Math.ceil((d - now) / 86400000);
                return { ...e, diff: diff };
            }).filter(e => e.diff >= 0).sort((a, b) => a.diff - b.diff);

            const titleEl = document.getElementById('hero-title');
            const dayNumEl = document.getElementById('hero-day-num');
            const unitEl = document.getElementById('hero-day-unit');

            if (futureEvents.length === 0) {
                titleEl.innerText = "予定はないよ";
                dayNumEl.innerText = "0"; return;
            }

            const next = futureEvents[0];
            titleEl.innerText = next.title;
            dayNumEl.innerText = next.diff === 0 ? "今日" : next.diff;
            unitEl.style.display = next.diff === 0 ? "none" : "inline";
        }

        function renderCalendar() {
            const body = document.getElementById('calendar-body');
            const disp = document.getElementById('month-display');
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            disp.innerText = `${year}年 ${month + 1}月`;
            body.innerHTML = "";

            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();
            const todayStr = formatDate(new Date());

            for (let i = 0; i < firstDay; i++) body.innerHTML += `<div class="day-cell empty"></div>`;

            for (let i = 1; i <= lastDate; i++) {
                const dStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                const isToday = (dStr === todayStr) ? "today" : "";
                const hasEvent = allEvents.some(e => e.dateStr === dStr);
                
                body.innerHTML += `
                    <div class="day-cell ${isToday} ${hasEvent ? 'has-event' : ''}" onclick="showDetail('${dStr}', ${i})">
                        <span class="day-num">${i}</span>
                        ${hasEvent ? '<div class="event-dot"></div>' : ''}
                    </div>`;
            }
        }

        function changeMonth(diff) {
            currentDate.setMonth(currentDate.getMonth() + diff);
            renderCalendar();
        }

        function showDetail(dStr, dayNum) {
            selectedDateStr = dStr;
            const ev = allEvents.find(e => e.dateStr === dStr);
            document.getElementById('detail-date').innerText = `${currentDate.getMonth()+1}月${dayNum}にちのよてい`;
            
            if (ev) {
                document.getElementById('detail-title').innerText = ev.title;
                document.getElementById('detail-body').innerText = ev.desc || "しおりはないよ";
                document.getElementById('detail-modal').style.display = 'block';
            } else {
                openAddModal(dStr);
            }
        }

        function openAddModal(dStr) {
            const targetDate = dStr || formatDate(new Date());
            document.getElementById('ev-date').value = targetDate;
            const ev = allEvents.find(e => e.dateStr === targetDate);
            document.getElementById('ev-title').value = ev ? ev.title : "";
            document.getElementById('ev-desc').value = ev ? ev.desc : "";
            document.getElementById('add-modal').style.display = 'block'; 
        }

        function openAddFromDetail() {
            closeModal('detail-modal');
            openAddModal(selectedDateStr);
        }

        async function deleteEventCheck() {
            if(confirm("この予定を消してもいい？")) {
                if(confirm("ほんとうに消しちゃうよ？")) {
                    await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({type: 'delete_event', date: selectedDateStr}) });
                    closeModal('detail-modal');
                    loadData();
                }
            }
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        async function saveEvent() {
            const date = document.getElementById('ev-date').value;
            const title = document.getElementById('ev-title').value;
            const desc = document.getElementById('ev-desc').value;
            const sendDiscord = document.getElementById('ev-discord').checked;

            if(!date || !title) return alert("ぜんぶかいてね！");
            document.getElementById('save-btn').innerText = "かきこみちゅう...";

            await fetch(GAS_URL, { 
                method: 'POST', 
                body: JSON.stringify({type: 'save_event', date, title, desc, sendDiscord}) 
            });
            
            closeModal('add-modal'); 
            document.getElementById('save-btn').innerText = "みんなにおしえる";
            loadData();
        }

        loadData();
    </script>
</body>
</html>
