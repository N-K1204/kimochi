<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ときめき共有カレンダー PRO</title>
    <style>
        :root { --sweet-pink: #ff9dbd; --soft-purple: #b49cff; --main-text: #5d5d5d; }
        body { background: #fffcfd; font-family: 'Hiragino Sans', sans-serif; margin: 0; padding: 0; color: var(--main-text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .app-header { flex: 0 0 40px; padding: 5px 15px; display: flex; align-items: center; justify-content: space-between; background: white; border-bottom: 1px solid #fdf0f5; z-index: 100; position: relative; }
        .btn-back { text-decoration: none; background: #f7f7f7; padding: 3px 10px; border-radius: 50px; color: #888; font-size: 10px; font-weight: bold; display: flex; align-items: center; gap: 3px; }
        .header-title { position: absolute; left: 50%; transform: translateX(-50%); font-size: 15px; font-weight: bold; color: var(--sweet-pink); }

        /* 上エリア */
        .hero-section { flex: 0 0 20%; display: flex; align-items: center; justify-content: center; padding: 5px 10px; background: linear-gradient(to bottom, #fff, #fff8fb); }
        .event-hero-card { width: 90%; max-width: 320px; background: white; border-radius: 20px; padding: 10px 15px; text-align: center; box-shadow: 0 8px 20px rgba(255, 139, 176, 0.15); border: 2px solid white; position: relative; overflow: hidden; }
        .wakuwaku-max { animation: shake-shine 0.4s infinite alternate; border: 3px solid var(--sweet-pink); }
        @keyframes shake-shine { 0% { transform: rotate(-1deg) scale(1.05); } 100% { transform: rotate(1deg) scale(1.05); box-shadow: 0 10px 30px rgba(255, 139, 176, 0.5); } }
        .hero-title-text { font-size: 18px; margin: 3px 0; color: #444; font-weight: 900; }
        .hero-day-val { font-size: 38px; font-weight: 900; color: var(--sweet-pink); line-height: 1; }

        /* 下エリア：カレンダー */
        .calendar-section { flex: 1; padding: 0 5px 10px; background: white; border-top-left-radius: 30px; border-top-right-radius: 30px; box-shadow: 0 -8px 25px rgba(0,0,0,0.03); display: flex; flex-direction: column; overflow: hidden; }
        .calendar-nav { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px 4px; }
        .nav-month { font-size: 16px; font-weight: 900; color: #555; }
        .btn-nav { background: #fff0f5; border: none; width: 30px; height: 30px; border-radius: 10px; color: var(--sweet-pink); font-size: 18px; }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; flex: 1; grid-auto-rows: 1fr; }
        .weekday-wrap { height: 18px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 2px; }
        .weekday { text-align: center; font-size: 10px; font-weight: bold; color: #ddd; }

        /* 日付セルのスタイル調整 */
        .day-cell { background: #fafafa; border-radius: 6px; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; cursor: pointer; border: 1px solid #f0f0f0; padding: 2px; overflow: hidden; position: relative; }
        .day-num { font-size: 11px; font-weight: bold; color: #aaa; margin-bottom: 1px; width: 100%; display: flex; justify-content: space-between; }
        .has-event { background: #fffcfd; }
        .today { border: 2px solid var(--soft-purple) !important; background: #fdfbff; }
        .today .day-num { color: var(--soft-purple); }

        /* セル内の予定ミニバッジ */
        .mini-event { width: 100%; font-size: 8px; line-height: 1.1; margin-bottom: 1px; padding: 1px 2px; border-radius: 3px; background: #fff0f5; color: #d6648a; border-left: 2px solid var(--sweet-pink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box; }
        .mini-event.main-ev { background: #f3f0ff; color: #7c5fd6; border-left-color: var(--soft-purple); }
        .event-time-mini { font-weight: bold; display: block; font-size: 7px; color: #888; transform: scale(0.9); transform-origin: left; }

        /* モーダル */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); display: none; z-index: 1000; backdrop-filter: blur(8px); }
        .modal-content { background: white; width: 90%; max-width: 340px; margin: 5vh auto; padding: 20px; border-radius: 30px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.1); max-height: 85vh; overflow-y: auto; box-sizing: border-box; }
        input, textarea { width: 100%; padding: 10px; margin: 6px 0; border-radius: 12px; border: 2px solid #fdf0f5; font-size: 14px; outline: none; box-sizing: border-box; font-family: inherit; }
        .btn-save { width: 100%; padding: 14px; background: var(--soft-purple); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; margin-top: 10px; box-shadow: 0 4px 0 #9575cd; }
        .ev-list-item { background: #fff9fb; padding: 10px; border-radius: 15px; text-align: left; margin-bottom: 10px; border: 1px solid #ffeff5; }
    </style>
</head>
<body>

    <header class="app-header">
        <a href="index.html" class="btn-back">🏠 <small>HOME</small></a>
        <div class="header-title">みんなのカレンダー</div>
        <div style="width: 40px;"></div>
    </header>

    <div class="hero-section">
        <div id="hero-card" class="event-hero-card">
            <div id="hero-title" class="hero-title-text">よみこみちゅう...</div>
            <div id="hero-days-wrap">
                <span id="hero-day-num" class="hero-day-val">-</span>
                <span id="hero-day-unit" style="font-size:14px; color:var(--sweet-pink); font-weight:900;">日</span>
            </div>
        </div>
    </div>

    <div class="calendar-section">
        <div class="calendar-nav">
            <button class="btn-nav" onclick="changeMonth(-1)">‹</button>
            <div id="month-display" class="nav-month"></div>
            <button class="btn-nav" onclick="changeMonth(1)">›</button>
        </div>
        <div class="weekday-wrap">
            <div class="weekday" style="color:#ff9dbd">日</div><div class="weekday">月</div><div class="weekday">火</div><div class="weekday">水</div><div class="weekday">木</div><div class="weekday">金</div><div class="weekday" style="color:#7da6ff">土</div>
        </div>
        <div id="calendar-body" class="calendar-grid"></div>
    </div>

    <div id="list-modal" class="modal"><div class="modal-content">
        <h3 id="list-date" style="margin:0; color:var(--sweet-pink);"></h3>
        <div id="list-container" style="margin-top:15px;"></div>
        <button onclick="openAddModal('')" class="btn-action" style="background:var(--soft-purple); color:white; width:100%; padding:12px; border:none; border-radius:10px; font-weight:bold; margin-top:10px;">＋ あたらしいよてい</button>
        <button onclick="closeModal('list-modal')" style="background:none; border:none; color:#bbb; margin-top:15px;">とじる</button>
    </div></div>

    <div id="add-modal" class="modal"><div class="modal-content">
        <h3 id="add-modal-title" style="margin:0; color:var(--soft-purple);">よていをかこう</h3>
        <input type="hidden" id="ev-id"><input type="date" id="ev-date">
        <div style="display:flex; gap:5px;"><input type="time" id="ev-time-start" style="flex:1"><span style="line-height:40px; color:#ccc;">〜</span><input type="time" id="ev-time-end" style="flex:1"></div>
        <input type="text" id="ev-title" placeholder="イベントのなまえ"><textarea id="ev-desc" placeholder="しおり"></textarea>
        <div style="background:#f8f9fa; border-radius:15px; padding:5px 10px; margin:10px 0;">
            <label style="display:flex; justify-content:space-between; align-items:center; padding:8px 0;"><span>🌟 メインにする</span><input type="checkbox" id="ev-main"></label>
            <label style="display:flex; justify-content:space-between; align-items:center; padding:8px 0;"><span>💬 通知する</span><input type="checkbox" id="ev-discord" checked></label>
        </div>
        <button onclick="saveEvent()" id="save-btn" class="btn-save">保存する</button>
        <button onclick="closeModal('add-modal'); openListModal(selectedDateStr);" style="background:none; border:none; color:#bbb; margin-top:15px;">もどる</button>
    </div></div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyoM20f2RskSPGOr8qQmsUkL5M6Ykusyp6wBaRit71hsvdQ4gbXIO6HrAAlkq4RCbJT/exec"; 
        let allEvents = []; let currentDate = new Date(); let selectedDateStr = "";

        function getSafeDateStr(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        async function loadData() {
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({type: 'get_calendar'}) });
                allEvents = await res.json();
                updateHero(); renderCalendar();
            } catch (e) { document.getElementById('hero-title').innerText = "エラー😢"; }
        }

        function updateHero() {
            const nowStr = getSafeDateStr(new Date());
            const target = allEvents.find(e => String(e.isMain).trim().toUpperCase() === "TRUE");
            const card = document.getElementById('hero-card');
            if(!target) { 
                document.getElementById('hero-title').innerText = "よていはないよ"; 
                document.getElementById('hero-day-num').innerText = "-";
                document.getElementById('hero-day-unit').style.display = "none";
                return; 
            }
            const diff = Math.ceil((new Date(getSafeDateStr(new Date(target.date))).getTime() - new Date(nowStr).getTime()) / 86400000);
            document.getElementById('hero-title').innerText = target.title;
            document.getElementById('hero-day-num').innerText = diff <= 0 ? "今日" : diff;
            document.getElementById('hero-day-unit').style.display = diff <= 0 ? "none" : "inline";
            card.className = "event-hero-card " + (diff <= 1 ? "wakuwaku-max" : "");
        }

        function renderCalendar() {
            const body = document.getElementById('calendar-body');
            const year = currentDate.getFullYear(); const month = currentDate.getMonth();
            document.getElementById('month-display').innerText = `${year}年 ${month + 1}月`;
            body.innerHTML = "";
            const todayStr = getSafeDateStr(new Date());
            const first = new Date(year, month, 1).getDay(); const last = new Date(year, month + 1, 0).getDate();
            
            for(let i=0; i<first; i++) body.innerHTML += `<div class="day-cell empty" style="background:transparent; border:none;"></div>`;
            
            for(let i=1; i<=last; i++) {
                const dStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                const dayEvs = allEvents.filter(e => getSafeDateStr(new Date(e.date)) === dStr).sort((a,b) => (a.time || "").localeCompare(b.time || ""));
                
                const isToday = (dStr === todayStr) ? "today" : "";
                
                // セル内の予定を生成
                let miniEvHtml = "";
                dayEvs.forEach((e, idx) => {
                    if(idx < 2) { // 2件まで表示
                        const timeOnly = e.time ? e.time.split(' 〜 ')[0] : "";
                        const mainClass = String(e.isMain) === "TRUE" ? "main-ev" : "";
                        miniEvHtml += `
                            <div class="mini-event ${mainClass}">
                                ${timeOnly ? `<span class="event-time-mini">${timeOnly}</span>` : ""}
                                ${e.title}
                            </div>`;
                    } else if(idx === 2) {
                        miniEvHtml += `<div style="font-size:8px; color:#ccc; text-align:center;">他${dayEvs.length-2}件</div>`;
                    }
                });

                body.innerHTML += `
                    <div class="day-cell ${isToday} ${dayEvs.length?'has-event':''}" onclick="openListModal('${dStr}')">
                        <div class="day-num">${i}</div>
                        ${miniEvHtml}
                    </div>`;
            }
        }

        function openListModal(dStr) {
            selectedDateStr = dStr;
            const dayEvs = allEvents.filter(e => getSafeDateStr(new Date(e.date)) === dStr);
            document.getElementById('list-date').innerText = dStr.replace(/-/g, '/');
            const container = document.getElementById('list-container');
            container.innerHTML = dayEvs.length === 0 ? "<p>よていなし</p>" : dayEvs.map(e => `
                <div class="ev-list-item">
                    <div style="font-size:11px; color:var(--sweet-pink); font-weight:bold;">⏰ ${e.time || '時間未定'}</div>
                    <div style="font-size:15px; font-weight:bold;">${String(e.isMain) === "TRUE" ? '🌟 ' : ''}${e.title}</div>
                    <div style="margin-top:8px;">
                        <button onclick="editEvent('${e.id}')" style="background:#eee; border:none; padding:4px 8px; border-radius:5px; font-size:11px;">修正</button>
                        <button onclick="deleteEvent('${e.id}')" style="background:#ffeded; color:red; border:none; padding:4px 8px; border-radius:5px; font-size:11px; margin-left:5px;">削除</button>
                    </div>
                </div>`).join('');
            document.getElementById('list-modal').style.display = 'block';
        }

        function openAddModal(id = "") {
            const ev = allEvents.find(e => e.id === id);
            document.getElementById('ev-id').value = id;
            document.getElementById('ev-date').value = selectedDateStr;
            document.getElementById('ev-title').value = ev ? ev.title : "";
            document.getElementById('ev-desc').value = ev ? ev.desc : "";
            const times = (ev && ev.time) ? ev.time.split(' 〜 ') : ["", ""];
            document.getElementById('ev-time-start').value = times[0] ? times[0].trim() : "";
            document.getElementById('ev-time-end').value = times[1] ? times[1].trim() : "";
            document.getElementById('ev-main').checked = ev ? String(ev.isMain) === "TRUE" : false;
            document.getElementById('list-modal').style.display = 'none';
            document.getElementById('add-modal').style.display = 'block';
        }

        async function saveEvent() {
            const title = document.getElementById('ev-title').value; if(!title) return;
            const time = document.getElementById('ev-time-start').value + (document.getElementById('ev-time-end').value ? " 〜 " + document.getElementById('ev-time-end').value : "");
            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ type: 'save_event', id: document.getElementById('ev-id').value, date: document.getElementById('ev-date').value, title, time, desc: document.getElementById('ev-desc').value, isMain: document.getElementById('ev-main').checked, sendDiscord: document.getElementById('ev-discord').checked }) });
            closeModal('add-modal'); await loadData(); openListModal(selectedDateStr);
        }

        async function deleteEvent(id) {
            if(!confirm("けす？")) return;
            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({type: 'delete_event', id}) });
            await loadData(); openListModal(selectedDateStr);
        }

        function editEvent(id) { openAddModal(id); }
        function changeMonth(n) { currentDate.setMonth(currentDate.getMonth()+n); renderCalendar(); }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        loadData();
    </script>
</body>
</html>
