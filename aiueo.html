<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ひらがな あいうえお表</title>
    <style>
        :root {
            --poop-color: #8b4513; 
            --dirty-orange: #a0522d; 
            --blue-bg: #007bff;
            --green-bg: #28a745;
            --heart-pink: #ff85a1; 
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            background-color: var(--green-bg);
            display: flex; flex-direction: column; align-items: center;
        }

        /* 800px固定・真ん中寄せ */
        .app-wrapper {
            width: 800px;
            display: flex;
            flex-direction: column;
            background-color: var(--blue-bg);
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            margin: 10px 0;
            border-radius: 20px;
            overflow: hidden;
        }

        .header {
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            gap: 10px;
        }

        .home-link {
            width: 90px; height: 45px;
            background-color: white; color: var(--blue-bg);
            text-decoration: none; border-radius: 10px;
            font-weight: bold; font-size: 13px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 3px 0 rgba(0,0,0,0.1);
        }

        /* 入力エリア：複数行見えるように textarea に変更 */
        .display-container {
            flex: 1;
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        #text-display {
            width: 380px; height: 80px; /* 高さを出して全部見えるように */
            background-color: white; border: 3px solid #ccc; border-radius: 12px;
            font-size: 26px; padding: 8px 12px;
            color: #333;
            resize: none; /* 大きさを変えられないように */
            outline: none;
            word-break: break-all;
            line-height: 1.2;
            /* モバイルで勝手にキーボードが出ないようにしつつ、カーソルは有効にする設定 */
            inputmode: none; 
        }

        .delete-btn {
            background-color: black; color: white; border: none; border-radius: 10px;
            width: 65px; height: 80px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 24px;
        }

        .speed-ctrl {
            width: 150px;
            background: rgba(255,255,255,0.2); padding: 8px; border-radius: 12px;
            color: white; font-size: 10px; font-weight: bold;
            text-align: center;
        }
        #speed-range { width: 100%; cursor: pointer; }

        /* メイングリッド */
        .main-content { padding: 5px 15px 15px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 6px;
            direction: rtl;
        }

        button.char-btn {
            border: 2px solid white; color: white; font-size: 18px;
            font-weight: bold; padding: 8px 0; border-radius: 8px;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            min-height: 50px; box-shadow: 0 3px 0 rgba(0,0,0,0.2);
            transition: 0.05s;
        }
        button.char-btn:active { transform: translateY(2px); box-shadow: none; }

        /* 色設定 */
        .row-a { background-color: #ff0000; }
        .row-i-1 { background-color: #0000ff; }
        .row-i-2 { background-color: #00ffff; }
        .row-u { background-color: #ffff00; color: #000 !important; }
        .row-e-1 { background-color: #008000; }
        .row-e-2 { background-color: #32cd32; }
        .row-o { background-color: var(--heart-pink) !important; color: white !important; }
        .row-ga { background-color: #006400; }
        .row-gi { background-color: #800080; }
        .row-gu { background-color: #8b0000; }
        .row-ge { background-color: #00008b; }
        .row-go { background-color: var(--dirty-orange) !important; color: white !important; }
        .btn-poop { background-color: var(--poop-color); color: white; }
        .btn-done { background-color: #007bff; color: white; }
        .btn-retry { background-color: black !important; color: #ff0000 !important; }
        .btn-dakuten { background-color: #696969; }
        .btn-handakuten { background-color: #a9a9a9; }

        /* 下部エリア */
        .bottom-section {
            background-color: var(--green-bg);
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
        }
        .flower-group { display: flex; gap: 15px; font-size: 35px; }
        .cat { font-size: 60px; line-height: 1; }

        #modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background-color: white; padding: 30px 50px; border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3); display: none; z-index: 11000;
        }
        #modal p { color: #007bff; font-size: 32px; font-weight: bold; margin: 0; }
        .fade-out { animation: fadeOut 1.2s forwards; }
        @keyframes fadeOut { 0% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="blue-section">
        <header class="header">
            <a href="index.html" class="home-link">🏠 ホーム</a>
            
            <div class="display-container">
                <textarea id="text-display" readonly onfocus="this.readOnly=false;" onblur="this.readOnly=true;" placeholder="もじが でるよ"></textarea>
                <button class="delete-btn" onclick="deleteChar()">📢✖</button>
            </div>

            <div class="speed-ctrl">
                <div style="display:flex; justify-content:space-between; margin-bottom:2px;">
                    <span>🐢 おそく</span><span>🚀 はやく</span>
                </div>
                <input type="range" id="speed-range" min="0.3" max="1.8" step="0.1" value="0.9">
            </div>
        </header>

        <main class="main-content">
            <div class="grid" id="aiueo-grid"></div>
        </main>
    </div>

    <div class="bottom-section">
        <div class="flower-group">
            <span>🌸</span><span>🌼</span><span>🌷</span><span>🌻</span><span>🌺</span><span>🌼</span><span>🌸</span>
        </div>
        <div class="cat">😸</div>
    </div>
</div>

<div id="modal"><p>いっしょによんでね</p></div>

<script>
    const display = document.getElementById('text-display');
    const grid = document.getElementById('aiueo-grid');
    const modal = document.getElementById('modal');
    const speedRange = document.getElementById('speed-range');

    const mainLetters = [
        ["あ", "か", "さ", "た", "な", "は", "ま", "や", "ら", "わ"],
        ["い", "き", "し", "ち", "に", "ひ", "み", "ゃ", "り", "を"],
        ["う", "く", "す", "つ", "ぬ", "ふ", "む", "ゆ", "る", "ん"],
        ["え", "け", "せ", "て", "ね", "へ", "め", "ゅ", "れ", "ー"],
        ["お", "こ", "そ", "と", "の", "ほ", "も", "よ", "ろ", "ゔ"]
    ];

    const dakuLetters = [
        ["が", "ざ", "だ", "ば", "ぱ"],
        ["ぎ", "じ", "ぢ", "び", "ぴ"],
        ["ぐ", "ず", "づ", "ぶ", "ぷ"],
        ["げ", "ぜ", "で", "べ", "ぺ"],
        ["ご", "ぞ", "ど", "ぼ", "ぽ"]
    ];

    function createGrid() {
        for (let r = 0; r < 5; r++) {
            for (let c = 0; c < 10; c++) {
                const char = mainLetters[r][c];
                const btn = document.createElement('button');
                btn.className = 'char-btn';
                btn.textContent = char;
                if (r === 0) btn.classList.add('row-a');
                else if (r === 1) btn.classList.add(c % 2 === 0 ? 'row-i-1' : 'row-i-2');
                else if (r === 2) btn.classList.add('row-u');
                else if (r === 3) btn.classList.add(c % 2 === 0 ? 'row-e-1' : 'row-e-2');
                else if (r === 4) btn.classList.add('row-o');
                btn.onclick = () => addChar(char);
                btn.style.gridRow = r + 1; btn.style.gridColumn = c + 1;
                grid.appendChild(btn);
            }
        }
        for (let r = 0; r < 5; r++) {
            for (let c = 0; c < 5; c++) {
                const char = dakuLetters[r][c];
                const btn = document.createElement('button');
                btn.className = 'char-btn';
                btn.textContent = char;
                if (r === 0) btn.classList.add('row-ga');
                else if (r === 1) btn.classList.add('row-gi');
                else if (r === 2) btn.classList.add('row-gu');
                else if (r === 3) btn.classList.add('row-ge');
                else if (r === 4) btn.classList.add('row-go');
                btn.onclick = () => addChar(char);
                btn.style.gridRow = r + 1; btn.style.gridColumn = c + 11;
                grid.appendChild(btn);
            }
        }
        createBtn('できた', 'btn-done', 6, "1 / span 3", readText);
        createBtn('っ', 'btn-poop', 6, 4, () => addChar('っ'));
        createBtn('やりなおし', 'btn-retry', 6, "5 / span 3", () => { display.value = ""; display.focus(); });
        createBtn('ょ', 'btn-poop', 6, 8, () => addChar('ょ'));
        createBtn('゛', 'btn-dakuten', 6, 9, () => addChar('゛'));
        createBtn('゜', 'btn-handakuten', 6, 10, () => addChar('゜'));
        ["ぁ", "ぃ", "ぅ", "ぇ", "ぉ"].forEach((v, i) => {
            createBtn(v, 'btn-poop', 6, 11 + i, () => addChar(v));
        });
    }

    function createBtn(txt, cls, r, c, clickFn) {
        const btn = document.createElement('button');
        btn.className = `char-btn ${cls}`; btn.textContent = txt;
        btn.style.gridRow = r; btn.style.gridColumn = c;
        btn.onclick = clickFn; grid.appendChild(btn);
    }

    // 🆕 カーソル位置に文字を入れるロジック
    function addChar(char) {
        const pos = display.selectionStart;
        const end = display.selectionEnd;
        const val = display.value;
        display.value = val.substring(0, pos) + char + val.substring(end);
        display.selectionStart = display.selectionEnd = pos + char.length;
        display.focus();
    }

    // 🆕 カーソル位置の前の文字を消すロジック
    function deleteChar() {
        const pos = display.selectionStart;
        const end = display.selectionEnd;
        const val = display.value;
        if (pos === end) {
            if (pos > 0) {
                display.value = val.substring(0, pos - 1) + val.substring(pos);
                display.selectionStart = display.selectionEnd = pos - 1;
            }
        } else {
            display.value = val.substring(0, pos) + val.substring(end);
            display.selectionStart = display.selectionEnd = pos;
        }
        display.focus();
    }

    function readText() {
        let text = display.value;
        if (!text) return;
        text = text.replace(/([か-ほ])゛/g, (m, p) => String.fromCharCode(p.charCodeAt(0) + 1));
        text = text.replace(/([は-ほ])゜/g, (m, p) => String.fromCharCode(p.charCodeAt(0) + 2));
        const rules = {"う゛":"ゔ","さ゛":"ざ","し゛":"じ","す゛":"ず","せ゛":"ぜ","そ゛":"ぞ","た゛":"だ","ち゛":"ぢ","つ゛":"づ","て゛":"で","と゛":"ど"};
        for (let k in rules) { text = text.split(k).join(rules[k]); }

        modal.style.display = 'block';
        modal.classList.add('fade-out');

        setTimeout(() => {
            modal.style.display = 'none';
            modal.classList.remove('fade-out');
            const uttr = new SpeechSynthesisUtterance(text);
            uttr.lang = 'ja-JP';
            uttr.rate = parseFloat(speedRange.value);
            uttr.pitch = 1.2;
            window.speechSynthesis.speak(uttr);
        }, 1500);
    }

    createGrid();
</script>
</body>
</html>
