<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>✨ みんなのメモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
    --primary: #FF85A2; 
    --bg-color: #FFF9FB; 
    --sidebar-bg: #FFFFFF;
    --text: #444;
}

* { box-sizing: border-box; }
body {
    font-family: "M PLUS Rounded 1c", sans-serif;
    margin: 0; padding: 0;
    background: var(--bg-color);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    background: #fff;
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px dashed #ffcdd2;
    z-index: 10;
}
h1 { margin: 0; font-size: 1.4rem; color: var(--primary); }

.btn-home {
    text-decoration: none;
    background: #bde4ff;
    color: #444;
    padding: 8px 16px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 14px;
    box-shadow: 0 3px 0 #90caf9;
    transition: .2s;
}
.btn-home:active { transform: translateY(3px); box-shadow: none; }

.container { display: flex; flex: 1; overflow: hidden; }

.sidebar {
    width: 340px;
    background: var(--sidebar-bg);
    border-right: 1px solid #eee;
    display: flex;
    flex-direction: column;
    padding: 15px;
    gap: 15px;
    overflow-y: auto;
}

.btn-new {
    width: 100%; padding: 14px;
    background: var(--primary); color: white;
    border: none; border-radius: 12px;
    font-weight: bold; font-size: 16px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(255, 133, 162, 0.4);
    transition: .2s;
}
.btn-new:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(255, 133, 162, 0.5); }

/* データ復活ボタン */
.btn-restore {
    width: 100%; padding: 10px;
    background: #FFD93D; color: #555;
    border: 2px solid #FFC107; border-radius: 12px;
    font-weight: bold; font-size: 14px;
    cursor: pointer; margin-top: auto; /* 一番下へ */
    box-shadow: 0 3px 0 #FFB300;
}
.btn-restore:active { transform: translateY(3px); box-shadow: none; }

.search-area {
    background: #f8f8f8; padding: 12px; border-radius: 12px;
    display: flex; flex-direction: column; gap: 8px; border: 2px solid #eee;
}
.search-label { font-size: 12px; font-weight: bold; color: #888; }
.search-input {
    width: 100%; padding: 8px 12px;
    border-radius: 8px; border: 1px solid #ddd;
    font-family: inherit;
}
.search-input:focus { border-color: var(--primary); outline: none; }

/* 読み込み中の表示 */
.loading-msg { text-align: center; color: #999; margin-top: 20px; font-size: 14px; }

.note-list { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.note-card {
    padding: 12px; border-radius: 12px;
    background: white; border: 2px solid transparent;
    cursor: pointer; transition: .2s;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}
.note-card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
.note-card.active { border-color: var(--primary); background: #fff0f5; }

.note-card-title { font-weight: bold; margin-bottom: 5px; font-size: 15px; }
.note-card-meta { font-size: 11px; color: #999; display: flex; justify-content: space-between; }
.mood-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }

.main-editor {
    flex: 1; display: flex; flex-direction: column;
    padding: 20px 40px; gap: 15px; overflow-y: auto;
    background-image: radial-gradient(#ffeef2 1px, transparent 1px);
    background-size: 20px 20px;
    position: relative; /* オーバーレイ用 */
}

/* 保存中オーバーレイ */
.saving-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(255,255,255,0.8); z-index: 50;
    display: none; justify-content: center; align-items: center;
    font-weight: bold; color: var(--primary); flex-direction: column; gap: 10px;
}

.input-title {
    width: 100%; font-size: 24px; font-weight: bold;
    border: none; background: transparent;
    border-bottom: 2px dashed #ddd; padding: 10px 0;
    outline: none; color: var(--primary);
}
.input-title::placeholder { color: #ccc; }

.toolbar-top { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
.date-editor {
    padding: 6px 10px; border-radius: 8px; border: 1px solid #ddd;
    font-family: inherit; color: #666; background: rgba(255,255,255,0.8);
}

.mood-selector { display: flex; gap: 5px; background: #fff; padding: 5px; border-radius: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
.mood-btn { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: .2s; }
.mood-btn:hover { transform: scale(1.2); }
.mood-btn.selected { border-color: #555; transform: scale(1.1); }

.format-toolbar {
    display: flex; gap: 8px; align-items: center;
    background: white; padding: 8px 15px; border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05); flex-wrap: wrap;
}
.format-btn {
    background: #f0f0f0; border: none; border-radius: 6px;
    padding: 5px 10px; font-weight: bold; cursor: pointer;
    font-family: inherit; color: #555; transition: .2s;
}
.format-btn:hover { background: #e0e0e0; }
.format-select {
    padding: 5px; border-radius: 6px; border: 1px solid #ddd;
    font-family: inherit; color: #555;
}
.color-picker-wrapper {
    position: relative; width: 30px; height: 30px; border-radius: 50%; overflow: hidden; border: 1px solid #ddd; cursor: pointer;
}
.color-picker {
    position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; padding: 0; margin: 0; cursor: pointer; border: none;
}

.input-body {
    flex: 1; width: 100%; min-height: 300px;
    border: none; background: rgba(255,255,255,0.9);
    border-radius: 16px; padding: 20px;
    font-size: 16px; line-height: 1.8;
    outline: none; overflow-y: auto;
    box-shadow: 0 4px 10px rgba(0,0,0,0.03);
}
.input-body:empty::before {
    content: attr(placeholder); color: #ccc; pointer-events: none; display: block;
}

.editor-footer {
    display: flex; justify-content: space-between; align-items: center;
    background: white; padding: 10px 20px; border-radius: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}
.status { font-size: 12px; color: #888; }

.btn-delete {
    padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer;
    background: #ffe0e0; color: #d32f2f; font-weight: bold;
    transition: .2s; display: flex; align-items: center; gap: 5px;
}
.btn-delete:hover { background: #ffcdd2; }

@media (max-width: 768px) {
    .container { flex-direction: column; }
    .sidebar { width: 100%; height: 40vh; border-right: none; border-bottom: 2px dashed #ffcdd2; }
    .main-editor { padding: 15px; }
    header h1 { font-size: 1.2rem; }
}
</style>
</head>
<body>

<header>
    <h1>📝 みんなのメモ</h1>
    <a href="logs.html" class="btn-home">📖 きもちのきろく へ</a>
</header>

<div class="container">
    <div class="sidebar">
        <button class="btn-new" id="btn-new">＋ 新しいメモ</button>
        
        <div class="search-area">
            <span class="search-label">🔍 メモをさがす</span>
            <input type="text" class="search-input" id="search-keyword" placeholder="キーワード">
            <input type="date" class="search-input" id="search-date">
        </div>

        <div class="note-list" id="note-list">
            <div class="loading-msg">読み込み中...<br>（時間がかかるよ）</div>
        </div>

        <button class="btn-restore" id="btn-restore">📤 メモを共有</button>
    </div>

    <div class="main-editor">
        <div class="saving-overlay" id="saving-overlay">
            <span id="overlay-msg">☁️ 通信中...</span>
        </div>

        <input type="text" class="input-title" id="memo-title" placeholder="無題のメモ">
        
        <div class="toolbar-top">
            <input type="datetime-local" class="date-editor" id="memo-date">
            <div class="mood-selector" id="mood-selector"></div>
        </div>

        <div class="format-toolbar">
            <button class="format-btn" onmousedown="saveSelection()" onclick="execCmd('bold')" title="太字"><b>B</b></button>
            <button class="format-btn" onmousedown="saveSelection()" onclick="execCmd('underline')" title="下線"><u>U</u></button>
            <button class="format-btn" onmousedown="saveSelection()" onclick="execCmd('strikeThrough')" title="取り消し線"><s>S</s></button>
            
            <select class="format-select" onmousedown="saveSelection()" onchange="execCmd('fontSize', this.value); this.value='';" title="文字サイズ">
                <option value="">サイズ</option>
                <option value="3">ふつう</option>
                <option value="5">おおきく</option>
                <option value="7">特大</option>
            </select>

            <div class="color-picker-wrapper" title="文字の色">
                <input type="color" class="color-picker" onmousedown="saveSelection()" onchange="execCmd('foreColor', this.value)">
            </div>
            <button class="format-btn" onmousedown="saveSelection()" onclick="execCmd('removeFormat')" title="装飾をクリア">クリア</button>
        </div>

        <div class="input-body" id="memo-body" contenteditable="true" placeholder="ここに記入"></div>

        <div class="editor-footer">
            <span class="status" id="save-status">クラウドに保存されます</span>
            <button class="btn-delete" id="btn-delete" title="このメモを削除">🗑 削除</button>
        </div>
    </div>
</div>

<script>
(function(){
    // ★ここにGASのURLを貼り付けてください！
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyoM20f2RskSPGOr8qQmsUkL5M6Ykusyp6wBaRit71hsvdQ4gbXIO6HrAAlkq4RCbJT/exec";

    // 昔のデータを保存していた可能性のあるキー
    const LOCAL_KEYS = ['memo_app_pro_v2', 'memo_app_pro_rich_v1', 'memo_data'];

    let notes = [], currentId = null;

    const MOODS = [
        { color: '#FF85A2', name: 'ピンク' }, { color: '#FFD93D', name: 'イエロー' },
        { color: '#6BCB77', name: 'グリーン' }, { color: '#4D96FF', name: 'ブルー' },
        { color: '#A29BFE', name: 'パープル' }, { color: '#B2B2B2', name: 'グレー' }
    ];
    let currentMood = MOODS[0].color;

    const el = {
        title: document.getElementById('memo-title'),
        body: document.getElementById('memo-body'),
        dateInput: document.getElementById('memo-date'),
        noteList: document.getElementById('note-list'),
        searchKw: document.getElementById('search-keyword'),
        searchDt: document.getElementById('search-date'),
        saveStatus: document.getElementById('save-status'),
        moodSelector: document.getElementById('mood-selector'),
        btnNew: document.getElementById('btn-new'),
        btnDelete: document.getElementById('btn-delete'),
        btnRestore: document.getElementById('btn-restore'),
        overlay: document.getElementById('saving-overlay'),
        overlayMsg: document.getElementById('overlay-msg')
    };

    // --- 選択範囲保存 ---
    let savedRange = null;
    window.saveSelection = function() {
        const sel = window.getSelection();
        if (sel.rangeCount > 0) savedRange = sel.getRangeAt(0);
    };
    window.restoreSelection = function() {
        if (savedRange) {
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(savedRange);
        }
    };
    window.execCmd = function(command, value = null) {
        restoreSelection();
        document.execCommand(command, false, value);
        el.body.focus();
        scheduleSave(); 
    };

    const nowISO = () => new Date().toISOString();
    const toLocalISO = (isoString) => {
        const d = new Date(isoString);
        d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
        return d.toISOString().slice(0, 16);
    };
    const formatDateFriendly = (iso) => {
        const d = new Date(iso);
        return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    };

    // --- データ操作 (GAS通信) ---
    async function loadNotes() {
        el.noteList.innerHTML = '<div class="loading-msg">読み込み中...<br></div>';
        try {
            const res = await fetch(GAS_URL, {
                method: 'POST', redirect: "follow",
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ type: "get_memos" })
            });
            notes = await res.json();
            if(!Array.isArray(notes)) notes = [];
        } catch(e) { 
            console.error(e); 
            notes = [];
            el.noteList.innerHTML = '<div class="loading-msg">エラー😢</div>';
        }
        renderList();
        
        // 初回ロード時
        if (!currentId && notes.length > 0) openNote(notes[0].id);
        if (!currentId && notes.length === 0) startNew();
    }

    async function saveNoteToCloud(n) {
        el.saveStatus.innerText = '保存中...';
        try {
            await fetch(GAS_URL, {
                method: 'POST', redirect: "follow",
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ 
                    type: "save_memo",
                    id: n.id,
                    title: n.title,
                    content: n.content,
                    mood: n.mood,
                    created_at: n.created_at,
                    updated_at: n.updated_at
                })
            });
            el.saveStatus.innerText = '保存完了 ✅（通知なし）';
        } catch(e) {
            el.saveStatus.innerText = '保存エラー 😢';
        }
    }

    // --- ローカルデータの復活＆アップロード ---
    el.btnRestore.addEventListener('click', async () => {
        if (!confirm('メモを、アップロードしますか？\n')) return;

        let localNotes = [];
        // 全ての可能性のあるキーから収集
        LOCAL_KEYS.forEach(key => {
            try {
                const data = JSON.parse(localStorage.getItem(key) || '[]');
                if (Array.isArray(data)) {
                    data.forEach(item => {
                        // 重複チェック (ID)
                        if (!localNotes.some(ln => ln.id === item.id)) {
                            // プレーンテキストなら改行を<br>に変換
                            if (item.content && !item.content.includes('<') && item.content.includes('\n')) {
                                item.content = item.content.replace(/\n/g, '<br>');
                            }
                            localNotes.push(item);
                        }
                    });
                }
            } catch(e){}
        });

        if (localNotes.length === 0) {
            alert('メモは見つかりませんでした。');
            return;
        }

        // アップロード処理
        el.overlay.style.display = 'flex';
        el.overlayMsg.innerText = `メモを ${localNotes.length}件 アップロード中...`;

        let successCount = 0;
        for (let i = 0; i < localNotes.length; i++) {
            const n = localNotes[i];
            el.overlayMsg.innerText = `アップロード中... (${i+1}/${localNotes.length})`;
            try {
                await fetch(GAS_URL, {
                    method: 'POST', redirect: "follow",
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ 
                        type: "save_memo",
                        id: n.id, title: n.title, content: n.content,
                        mood: n.mood || MOODS[0].color,
                        created_at: n.created_at, updated_at: n.updated_at
                    })
                });
                successCount++;
            } catch(e) { console.error(e); }
        }

        el.overlay.style.display = 'none';
        alert(`${successCount}件のメモを共有させました！\n画面を更新します。`);
        loadNotes(); // 再読み込み
    });

    async function deleteNoteCloud(id) {
        el.saveStatus.innerText = '削除中...';
        el.overlay.style.display = 'flex';
        el.overlayMsg.innerText = '削除中...';
        try {
            await fetch(GAS_URL, {
                method: 'POST', redirect: "follow",
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ type: "delete_memo", id: id })
            });
            notes = notes.filter(n => n.id !== id);
            renderList();
            if (notes.length > 0) openNote(notes[0].id);
            else startNew();
            el.saveStatus.innerText = '削除しました 🗑';
        } catch(e) {
            el.saveStatus.innerText = '削除エラー 😢';
        } finally {
            el.overlay.style.display = 'none';
        }
    }

    // --- メモ操作 ---
    function startNew() {
        const id = Date.now().toString(36) + Math.random().toString(36).substr(2);
        const now = nowISO();
        const n = {
            id, title: '', content: '', created_at: now, updated_at: now, mood: MOODS[0].color
        };
        notes.unshift(n);
        renderList();
        openNote(id);
        el.saveStatus.innerText = '新規作成 (入力すると保存されます)';
    }

    function openNote(id) {
        const n = notes.find(x => x.id === id);
        if (!n) return;
        currentId = n.id;
        el.title.value = n.title;
        el.body.innerHTML = n.content;
        el.dateInput.value = toLocalISO(n.created_at);
        currentMood = n.mood;
        initMoodSelector();
        renderList();
        el.saveStatus.innerText = '編集中';
    }

    // --- 自動保存（デバウンス）---
    let timer = null;
    function scheduleSave() {
        el.saveStatus.innerText = '入力中... (2秒後に保存)';
        if (timer) clearTimeout(timer);
        timer = setTimeout(doSave, 2000); 
    }

    function doSave() {
        if (!currentId) return;
        const n = notes.find(x => x.id === currentId);
        if(!n) return;

        n.title = el.title.value;
        n.content = el.body.innerHTML;
        const dVal = el.dateInput.value;
        n.created_at = dVal ? new Date(dVal).toISOString() : nowISO();
        n.updated_at = nowISO();
        n.mood = currentMood;

        renderList(); 
        saveNoteToCloud(n); 
    }

    // --- 描画 ---
    function renderList() {
        const kw = el.searchKw.value.toLowerCase();
        const dt = el.searchDt.value; 
        const list = el.noteList;
        list.innerHTML = '';

        const targets = notes.filter(n => {
            const matchKw = (n.title && n.title.toLowerCase().includes(kw)) || 
                            (n.content && n.content.toLowerCase().includes(kw));
            const noteDate = toLocalISO(n.created_at).slice(0, 10);
            const matchDt = dt ? (noteDate === dt) : true;
            return matchKw && matchDt;
        });

        if (targets.length === 0 && notes.length > 0) {
            list.innerHTML = '<div style="text-align:center;color:#aaa;padding:20px;font-size:13px;">みつかりません</div>';
            return;
        }

        targets.forEach(n => {
            const card = document.createElement('div');
            card.className = `note-card ${n.id === currentId ? 'active' : ''}`;
            card.onclick = () => openNote(n.id);
            const titleText = n.title.trim() || '(無題)';
            card.innerHTML = `
                <div class="note-card-title">
                    <span class="mood-dot" style="background:${n.mood}"></span>${titleText}
                </div>
                <div class="note-card-meta"><span>${formatDateFriendly(n.created_at)}</span></div>
            `;
            list.appendChild(card);
        });
    }

    function initMoodSelector() {
        el.moodSelector.innerHTML = '';
        MOODS.forEach(m => {
            const btn = document.createElement('div');
            btn.className = 'mood-btn';
            btn.style.backgroundColor = m.color;
            btn.title = m.name;
            btn.onclick = () => {
                currentMood = m.color;
                initMoodSelector();
                if(currentId) scheduleSave();
            };
            if (m.color === currentMood) btn.classList.add('selected');
            el.moodSelector.appendChild(btn);
        });
    }

    // --- イベント設定 ---
    el.title.addEventListener('input', scheduleSave);
    el.body.addEventListener('input', scheduleSave);
    el.dateInput.addEventListener('change', scheduleSave);
    el.searchKw.addEventListener('input', renderList);
    el.searchDt.addEventListener('change', renderList);
    el.btnNew.addEventListener('click', startNew);
    el.btnDelete.addEventListener('click', () => {
        if (!currentId) return;
        if (confirm('本当にこのメモを消してもいいですか？\n（みんなの画面からも消えます）')) {
            deleteNoteCloud(currentId);
        }
    });

    // 開始
    initMoodSelector();
    loadNotes();

})();
</script>
</body>
</html>
