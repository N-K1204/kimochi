<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>✨ じゆうメモ（リッチ版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
    --primary: #FF85A2; /* ポップなピンク */
    --bg-color: #FFF9FB; /* ほんのりピンクな白 */
    --sidebar-bg: #FFFFFF;
    --text: #444;
}

* { box-sizing: border-box; }
body {
    font-family: "M PLUS Rounded 1c", sans-serif;
    margin: 0; padding: 0;
    background: var(--bg-color);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* --- ヘッダー --- */
header {
    background: #fff;
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px dashed #ffcdd2;
    z-index: 10;
}
h1 { margin: 0; font-size: 1.4rem; color: var(--primary); }

.btn-home {
    text-decoration: none;
    background: #bde4ff;
    color: #444;
    padding: 8px 16px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 14px;
    box-shadow: 0 3px 0 #90caf9;
    transition: .2s;
}
.btn-home:active { transform: translateY(3px); box-shadow: none; }

/* --- レイアウト --- */
.container {
    display: flex;
    flex: 1;
    overflow: hidden; 
}

/* --- 左サイドバー（リスト＆検索） --- */
.sidebar {
    width: 340px;
    background: var(--sidebar-bg);
    border-right: 1px solid #eee;
    display: flex;
    flex-direction: column;
    padding: 15px;
    gap: 15px;
    overflow-y: auto;
}

/* 新規作成ボタン */
.btn-new {
    width: 100%;
    padding: 14px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 12px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(255, 133, 162, 0.4);
    transition: .2s;
}
.btn-new:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(255, 133, 162, 0.5); }

/* 検索エリア */
.search-area {
    background: #f8f8f8;
    padding: 12px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border: 2px solid #eee;
}
.search-label { font-size: 12px; font-weight: bold; color: #888; }
.search-input {
    width: 100%; padding: 8px 12px;
    border-radius: 8px; border: 1px solid #ddd;
    font-family: inherit;
}
.search-input:focus { border-color: var(--primary); outline: none; }

/* メモリスト */
.note-list {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.note-card {
    padding: 12px;
    border-radius: 12px;
    background: white;
    border: 2px solid transparent;
    cursor: pointer;
    transition: .2s;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}
.note-card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
.note-card.active { border-color: var(--primary); background: #fff0f5; }

.note-card-title { font-weight: bold; margin-bottom: 5px; font-size: 15px; }
.note-card-meta { font-size: 11px; color: #999; display: flex; justify-content: space-between; }
.mood-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }

/* --- 右エディタエリア --- */
.main-editor {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px 40px;
    gap: 15px;
    overflow-y: auto;
    background-image: radial-gradient(#ffeef2 1px, transparent 1px);
    background-size: 20px 20px;
}

/* タイトル入力 */
.input-title {
    width: 100%; font-size: 24px; font-weight: bold;
    border: none; background: transparent;
    border-bottom: 2px dashed #ddd; padding: 10px 0;
    outline: none; color: var(--primary);
}
.input-title::placeholder { color: #ccc; }

/* ツールバー（日付・色） */
.toolbar-top {
    display: flex; align-items: center; gap: 15px; flex-wrap: wrap;
}
.date-editor {
    padding: 6px 10px; border-radius: 8px; border: 1px solid #ddd;
    font-family: inherit; color: #666; background: rgba(255,255,255,0.8);
}

.mood-selector { display: flex; gap: 5px; background: #fff; padding: 5px; border-radius: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
.mood-btn { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: .2s; }
.mood-btn:hover { transform: scale(1.2); }
.mood-btn.selected { border-color: #555; transform: scale(1.1); }

/* --- 装飾ツールバー --- */
.format-toolbar {
    display: flex; gap: 8px; align-items: center;
    background: white; padding: 8px 15px; border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    flex-wrap: wrap;
}
.format-btn {
    background: #f0f0f0; border: none; border-radius: 6px;
    padding: 5px 10px; font-weight: bold; cursor: pointer;
    font-family: inherit; color: #555; transition: .2s;
}
.format-btn:hover { background: #e0e0e0; }
.format-select {
    padding: 5px; border-radius: 6px; border: 1px solid #ddd;
    font-family: inherit; color: #555;
}
.color-picker-wrapper {
    position: relative; width: 30px; height: 30px; border-radius: 50%; overflow: hidden; border: 1px solid #ddd; cursor: pointer;
}
.color-picker {
    position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; padding: 0; margin: 0; cursor: pointer; border: none;
}

/* 本文入力（ContentEditable） */
.input-body {
    flex: 1; width: 100%; min-height: 300px;
    border: none; background: rgba(255,255,255,0.9);
    border-radius: 16px; padding: 20px;
    font-size: 16px; line-height: 1.8;
    outline: none; overflow-y: auto;
    box-shadow: 0 4px 10px rgba(0,0,0,0.03);
}
/* プレースホルダーの代わり */
.input-body:empty::before {
    content: attr(placeholder);
    color: #ccc;
    pointer-events: none;
    display: block; /* For Firefox */
}

/* フッター */
.editor-footer {
    display: flex; justify-content: space-between; align-items: center;
    background: white; padding: 10px 20px; border-radius: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}
.status { font-size: 12px; color: #888; }

.btn-delete {
    padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer;
    background: #ffe0e0; color: #d32f2f; font-weight: bold;
    transition: .2s; display: flex; align-items: center; gap: 5px;
}
.btn-delete:hover { background: #ffcdd2; }

/* スマホ対応 */
@media (max-width: 768px) {
    .container { flex-direction: column; }
    .sidebar { width: 100%; height: 40vh; border-right: none; border-bottom: 2px dashed #ffcdd2; }
    .main-editor { padding: 15px; }
    header h1 { font-size: 1.2rem; }
}
</style>
</head>
<body>

<header>
    <h1>📝 じゆうメモ</h1>
    <a href="logs.html" class="btn-home">📖 きもちのきろく へ</a>
</header>

<div class="container">
    <div class="sidebar">
        <button class="btn-new" id="btn-new">＋ 新しいメモ</button>
        
        <div class="search-area">
            <span class="search-label">🔍 メモをさがす</span>
            <input type="text" class="search-input" id="search-keyword" placeholder="キーワード">
            <input type="date" class="search-input" id="search-date">
        </div>

        <div class="note-list" id="note-list">
            </div>
    </div>

    <div class="main-editor">
        <input type="text" class="input-title" id="memo-title" placeholder="無題のメモ">
        
        <div class="toolbar-top">
            <input type="datetime-local" class="date-editor" id="memo-date">
            <div class="mood-selector" id="mood-selector"></div>
        </div>

        <div class="format-toolbar">
            <button class="format-btn" onclick="execCmd('bold')" title="太字"><b>B</b></button>
            <button class="format-btn" onclick="execCmd('underline')" title="下線"><u>U</u></button>
            <button class="format-btn" onclick="execCmd('strikeThrough')" title="取り消し線"><s>S</s></button>
            
            <select class="format-select" onchange="execCmd('fontSize', this.value); this.value='';" title="文字サイズ">
                <option value="">サイズ</option>
                <option value="3">ふつう</option>
                <option value="5">おおきく</option>
                <option value="7">特大</option>
            </select>

            <div class="color-picker-wrapper" title="文字の色">
                <input type="color" class="color-picker" onchange="execCmd('foreColor', this.value)">
            </div>
            <button class="format-btn" onclick="execCmd('removeFormat')" title="装飾をクリア">クリア</button>
        </div>

        <div class="input-body" id="memo-body" contenteditable="true" placeholder="ここに記入"></div>

        <div class="editor-footer">
            <span class="status" id="save-status">準備完了</span>
            <button class="btn-delete" id="btn-delete" title="このメモを削除">🗑 削除</button>
        </div>
    </div>
</div>

<script>
(function(){
    const KEY = 'memo_app_pro_rich_v1'; // キー名を変更して新しい形式に対応
    let notes = [], currentId = null;

    const MOODS = [
        { color: '#FF85A2', name: 'ピンク' },
        { color: '#FFD93D', name: 'イエロー' },
        { color: '#6BCB77', name: 'グリーン' },
        { color: '#4D96FF', name: 'ブルー' },
        { color: '#A29BFE', name: 'パープル' },
        { color: '#B2B2B2', name: 'グレー' }
    ];
    let currentMood = MOODS[0].color;

    const el = {
        title: document.getElementById('memo-title'),
        body: document.getElementById('memo-body'),
        dateInput: document.getElementById('memo-date'),
        noteList: document.getElementById('note-list'),
        searchKw: document.getElementById('search-keyword'),
        searchDt: document.getElementById('search-date'),
        saveStatus: document.getElementById('save-status'),
        moodSelector: document.getElementById('mood-selector'),
        btnNew: document.getElementById('btn-new'),
        btnDelete: document.getElementById('btn-delete')
    };

    // --- リッチテキスト操作用 ---
    window.execCmd = function(command, value = null) {
        document.execCommand(command, false, value);
        el.body.focus(); // フォーカスを戻す
        scheduleSave();  // 変更を保存
    };

    const nowISO = () => new Date().toISOString();
    const toLocalISO = (isoString) => {
        const d = new Date(isoString);
        d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
        return d.toISOString().slice(0, 16);
    };
    const formatDateFriendly = (iso) => {
        const d = new Date(iso);
        return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    };

    // --- データ読み込み・保存 ---
    function loadNotes() {
        try {
            notes = JSON.parse(localStorage.getItem(KEY) || '[]');
            notes = notes.map(n => ({...n, mood: n.mood || MOODS[0].color}));
        } catch(e) { notes = []; }
        renderList();
    }
    function saveToStorage() {
        localStorage.setItem(KEY, JSON.stringify(notes));
    }

    // --- メモ操作 ---
    function createNote() {
        const id = Date.now().toString(36) + Math.random().toString(36).substr(2);
        const now = nowISO();
        const n = {
            id,
            title: '',
            content: '', // HTMLとして保存される
            created_at: now,
            updated_at: now,
            mood: MOODS[0].color
        };
        notes.unshift(n);
        saveToStorage();
        return n;
    }

    function updateNote(id, changes) {
        const idx = notes.findIndex(n => n.id === id);
        if (idx === -1) return;
        
        notes[idx] = { ...notes[idx], ...changes, updated_at: nowISO() };
        // 先頭に移動
        const item = notes.splice(idx, 1)[0];
        notes.unshift(item);
        
        saveToStorage();
    }

    function deleteNote(id) {
        notes = notes.filter(n => n.id !== id);
        saveToStorage();
    }

    // --- 画面表示 ---
    function renderList() {
        const kw = el.searchKw.value.toLowerCase();
        const dt = el.searchDt.value; // YYYY-MM-DD
        const list = el.noteList;
        list.innerHTML = '';

        // 検索フィルター
        const targets = notes.filter(n => {
            // contentはHTMLタグを含むため、検索時はタグを除去してテキストのみで検索するとベターだが簡易的にそのまま検索
            const matchKw = (n.title && n.title.toLowerCase().includes(kw)) || 
                            (n.content && n.content.toLowerCase().includes(kw));
            
            const noteDate = toLocalISO(n.created_at).slice(0, 10);
            const matchDt = dt ? (noteDate === dt) : true;

            return matchKw && matchDt;
        });

        if (targets.length === 0) {
            list.innerHTML = '<div style="text-align:center;color:#aaa;padding:20px;font-size:13px;">みつかりません<br>条件をかえてみてね</div>';
            return;
        }

        targets.forEach(n => {
            const card = document.createElement('div');
            card.className = `note-card ${n.id === currentId ? 'active' : ''}`;
            card.onclick = () => openNote(n.id);

            const titleText = n.title.trim() || '(無題)';
            
            card.innerHTML = `
                <div class="note-card-title">
                    <span class="mood-dot" style="background:${n.mood}"></span>${titleText}
                </div>
                <div class="note-card-meta">
                    <span>${formatDateFriendly(n.created_at)}</span>
                </div>
            `;
            list.appendChild(card);
        });
    }

    function initMoodSelector() {
        el.moodSelector.innerHTML = '';
        MOODS.forEach(m => {
            const btn = document.createElement('div');
            btn.className = 'mood-btn';
            btn.style.backgroundColor = m.color;
            btn.title = m.name;
            btn.onclick = () => changeMood(m.color);
            if (m.color === currentMood) btn.classList.add('selected');
            el.moodSelector.appendChild(btn);
        });
    }

    // --- アクション ---
    function openNote(id) {
        const n = notes.find(x => x.id === id);
        if (!n) return;

        currentId = n.id;
        el.title.value = n.title;
        // HTMLとしてセット
        el.body.innerHTML = n.content; 
        el.dateInput.value = toLocalISO(n.created_at);
        currentMood = n.mood;
        
        el.saveStatus.innerText = '編集中';
        initMoodSelector(); 
        renderList(); 
    }

    function startNew() {
        const n = createNote();
        openNote(n.id);
        el.title.focus();
        el.saveStatus.innerText = '新規作成';
    }

    function changeMood(color) {
        currentMood = color;
        initMoodSelector();
        if (currentId) {
            updateNote(currentId, { mood: color });
            renderList();
        }
    }

    // --- 自動保存 ---
    let timer = null;
    function scheduleSave() {
        el.saveStatus.innerText = '入力中...';
        if (timer) clearTimeout(timer);
        timer = setTimeout(doSave, 800);
    }

    function doSave() {
        if (!currentId) return;

        const title = el.title.value;
        // HTMLとして取得
        const content = el.body.innerHTML; 
        const dateVal = el.dateInput.value; 
        const created_at = dateVal ? new Date(dateVal).toISOString() : nowISO();

        updateNote(currentId, {
            title, content, created_at, mood: currentMood
        });
        
        el.saveStatus.innerText = '保存しました ✅';
        renderList(); 
    }

    // --- イベント設定 ---
    el.title.addEventListener('input', scheduleSave);
    el.body.addEventListener('input', scheduleSave); // divのinputイベント
    el.dateInput.addEventListener('change', scheduleSave);
    
    el.searchKw.addEventListener('input', renderList);
    el.searchDt.addEventListener('change', renderList);

    el.btnNew.addEventListener('click', startNew);

    el.btnDelete.addEventListener('click', () => {
        if (!currentId) return;
        if (confirm('本当にこのメモを消してもいいですか？')) {
            deleteNote(currentId);
            if (notes.length > 0) openNote(notes[0].id);
            else startNew();
        }
    });

    // 初期化
    initMoodSelector();
    loadNotes();
    
    if (notes.length > 0) openNote(notes[0].id);
    else startNew();

})();
</script>
</body>
</html>
