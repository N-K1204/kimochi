<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>きもちにっき</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ------------------------------------------------
            パスワード画面のスタイル
        ------------------------------------------------ */
        #login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #fff7e6, #ffeefd);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 80%;
            max-width: 400px;
        }

        .login-title {
            font-size: 20px;
            margin-bottom: 20px;
            color: #555;
            font-weight: bold;
        }

        .pass-input {
            width: 80%;
            padding: 10px;
            font-size: 18px;
            border: 2px solid #ccc;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-family: sans-serif;
        }

        .login-btn {
            background-color: #ff8bb0;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 0 #ff6f9e;
            transition: 0.1s;
        }
        .login-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .error-msg {
            color: #ff6f6f;
            font-size: 14px;
            margin-top: 15px;
            display: none;
            font-weight: bold;
        }

        /* アプリ画面の追加スタイル */
        #app-content { display: none; }
        
        /* 新機能ボタンのスタイル */
        .btn-feature {
            display: block;
            width: 100%;
            padding: 15px 0;
            margin-top: 15px;
            border-radius: 15px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            transition: 0.1s;
            box-sizing: border-box;
        }
        .btn-feature:active { transform: translateY(4px); box-shadow: none; }
        
        .btn-magic { background-color: #b49cff; border: 2px solid #9575cd; }
        .btn-gacha { background-color: #4dd0e1; border: 2px solid #00acc1; }
        .btn-shiritori { background-color: #ff8a65; border: 2px solid #ff7043; }
        .btn-katchin { background-color: #90caf9; border: 2px solid #64b5f6; color: #fff; }
        
        /* カレンダーボタン用スタイル */
        .btn-calendar { background-color: #ffcc80; border: 2px solid #fb8c00; color: #fff; }

        /* 🗓 ワクワクイベントバナーのアニメーション */
        @keyframes wakuwaku-1 { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        @keyframes wakuwaku-2 { 
            0%, 100% { transform: scale(1.1) rotate(-1deg); } 
            50% { transform: scale(1.15) rotate(1deg); color: #ff4081; } 
        }
        .level-1 { animation: wakuwaku-1 2s infinite ease-in-out; border-color: #ffcc80 !important; }
        .level-2 { animation: wakuwaku-2 0.6s infinite ease-in-out; border: 3px solid #ff8bb0 !important; box-shadow: 0 0 20px rgba(255,139,176,0.5) !important; }

        /* --- 🚽 クイックアクションボタンの追加スタイル --- */
        .quick-action-area {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }
        .btn-quick {
            padding: 15px 20px;
            border-radius: 20px;
            border: none;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            transition: 0.1s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-quick:active { transform: translateY(4px); box-shadow: none; }
        .btn-toilet { background-color: #e1f5fe; color: #0288d1; border: 2px solid #b3e5fc; }
        .btn-reply { background-color: #f3e5f5; color: #7b1fa2; border: 2px solid #e1bee7; }

        /* --- 確認モーダルのスタイル --- */
        .q-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); display: none; z-index: 10000;
            align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }
        .q-modal-content {
            background: white; padding: 25px; border-radius: 25px;
            width: 85%; max-width: 320px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .q-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; color: #444; }
        .q-btn-group { display: flex; gap: 10px; }
        .q-btn {
            flex: 1; padding: 15px; border-radius: 15px; border: none;
            font-size: 18px; font-weight: bold; cursor: pointer; color: white;
        }
        .q-yes { background-color: #ff8bb0; }
        .q-no { background-color: #ccc; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <div class="login-title">🔑 あいことば を いれてね</div>
            <input type="password" id="password" class="pass-input" placeholder="ここに入力">
            <br>
            <button class="login-btn" onclick="checkPassword()">あける</button>
            <div id="error-message" class="error-msg">ちがうみたい...💦</div>
        </div>
    </div>

    <div id="app-content" class="container">
        <h1>🌈 きもちにっき 🌈</h1>

        <div class="quick-action-area">
            <button class="btn-quick btn-toilet" onclick="openQModal('toilet')">🚽 トイレ</button>
            <button class="btn-quick btn-reply" onclick="openQModal('reply')">💬 おへんじ</button>
        </div>

        <div id="next-event-banner" style="display:none; margin: 0 auto 20px; width: 100%;">
            <a href="calendar.html" style="text-decoration: none; color: inherit;">
                <div id="event-card" style="background: white; padding: 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; position: relative; overflow: hidden; border: 2px solid #eee;">
                    <div id="excitement-bg" style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0.1; z-index:0;"></div>
                    <span style="font-size: 12px; color: #888; font-weight: bold;">🚀 もーすぐ！ワクワクイベント</span>
                    <h2 id="banner-title" style="margin: 5px 0; color: #ff8bb0; z-index:1; position:relative; font-size: 22px;"></h2>
                    <div id="banner-countdown" style="font-weight: bold; font-size: 18px; z-index:1; position:relative; color: #555;"></div>
                </div>
            </a>
        </div>
        
        <div class="color-grid">
            <a href="input.html?color=pink" class="color-btn" style="background-color: #fff0f7; border-color: #ff8bb0;">
                <span class="emoji">😄</span><span>うれしい</span>
            </a>
            <a href="input.html?color=green" class="color-btn" style="background-color: #f0fff3; border-color: #6ecb63;">
                <span class="emoji">😌</span><span>おちつく</span>
            </a>
            <a href="input.html?color=yellow" class="color-btn" style="background-color: #fffbe0; border-color: #f1c232;">
                <span class="emoji">😮</span><span>びっくり</span>
            </a>
            <a href="input.html?color=purple" class="color-btn" style="background-color: #f9f5ff; border-color: #b49cff;">
                <span class="emoji">😕</span><span>もやもや</span>
            </a>
            <a href="input.html?color=blue" class="color-btn" style="background-color: #f0f6ff; border-color: #7da6ff;">
                <span class="emoji">😢</span><span>さみしい</span>
            </a>
            <a href="input.html?color=black" class="color-btn" style="background-color: #f3f3f3; border-color: #8c8c8c;">
                <span class="emoji">😴</span><span>つかれた</span>
            </a>
            <a href="input.html?color=red" class="color-btn" style="background-color: #fff0f0; border-color: #ff6f6f;">
                <span class="emoji">😡</span><span>イライラ</span>
            </a>
            <a href="input.html?color=white" class="color-btn" style="background-color: #ffffff; border-color: #cccccc;">
                <span class="emoji">😁</span><span>期間限定</span>
            </a>
        </div>

        <div style="margin-top: 30px; border-top: 2px dashed #ddd; padding-top: 20px;">
            <p style="font-size:14px; color:#888; margin-bottom:10px;">👇 こまったときは ココ！</p>
            
            <a href="calendar.html" class="btn-feature btn-calendar">
                📅 みんなのカレンダー
            </a>

            <a href="magic.html" class="btn-feature btn-magic">
                🧙‍♂️ コトバのまほう
            </a>
            
            <a href="gacha.html" class="btn-feature btn-gacha">
                💊 おたすけ ガチャ
            </a>

            <a href="shiritori.html" class="btn-feature btn-shiritori">
                🍎 しりとり バトル
            </a>

            <a href="katchin.html" class="btn-feature btn-katchin">
                🧊 かっちん かっちん
            </a>
        </div>

        <a href="logs.html" class="btn-logs">
            📘 きろくのきろく
        </a>
    </div>

    <div id="quick-modal" class="q-modal">
        <div class="q-modal-content">
            <div id="q-text" class="q-title"></div>
            <div class="q-btn-group">
                <button class="q-btn q-yes" onclick="sendQuickNotify('うん')">うん</button>
                <button class="q-btn q-no" onclick="sendQuickNotify('ううん')">ううん</button>
            </div>
            <button onclick="closeQModal()" style="margin-top:15px; background:none; border:none; color:#aaa; cursor:pointer;">やめる</button>
        </div>
    </div>

    <script>
        const CORRECT_PASS = "yuuki01121003";
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyoM20f2RskSPGOr8qQmsUkL5M6Ykusyp6wBaRit71hsvdQ4gbXIO6HrAAlkq4RCbJT/exec";

        window.onload = function() {
            if (sessionStorage.getItem("isLoggedIn") === "true") {
                showApp();
            }
        };

        function checkPassword() {
            const inputPass = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-message');

            if (inputPass === CORRECT_PASS) {
                sessionStorage.setItem("isLoggedIn", "true");
                showApp();
            } else {
                errorMsg.style.display = "block";
            }
        }

        function showApp() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            showNextEvent(); 
        }

        document.getElementById('password').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkPassword();
        });

        // --- クイックアクション用ロジック ---
        let quickMode = "";
        function openQModal(mode) {
            quickMode = mode;
            const text = document.getElementById('q-text');
            if(mode === 'toilet') {
                text.innerText = "トイレに いきたいですか？";
            } else {
                text.innerText = "どっちにあてはまる？";
            }
            document.getElementById('quick-modal').style.display = 'flex';
        }

        function closeQModal() {
            document.getElementById('quick-modal').style.display = 'none';
        }

        async function sendQuickNotify(answer) {
            const content = quickMode === 'toilet' ? `🚽 トイレにいきたいですか？ → **${answer}**` : `💬 おへんじ → **${answer}**`;
            const yesBtn = document.querySelector('.q-yes');
            const noBtn = document.querySelector('.q-no');
            
            yesBtn.disabled = true;
            noBtn.disabled = true;
            
            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ type: "quick_notify", content: content })
                });
                alert("つうちを おくったよ！🚀");
            } catch(e) {
                alert("エラーがおきちゃった💦");
            } finally {
                yesBtn.disabled = false;
                noBtn.disabled = false;
                closeQModal();
            }
        }

        // --- 🗓 トップページのワクワクイベント表示処理 ---
        async function showNextEvent() {
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({type: 'get_calendar'}) });
                const events = await res.json();
                if (!events || events.length === 0) return;

                const now = new Date();
                now.setHours(0, 0, 0, 0);

                const futureEvents = events
                    .map(e => {
                        const eventDate = new Date(e.date);
                        eventDate.setHours(0, 0, 0, 0);
                        const diff = Math.ceil((eventDate - now) / (1000 * 60 * 60 * 24));
                        return { ...e, dateObj: eventDate, diff: diff };
                    })
                    .filter(e => e.diff >= 0)
                    .sort((a, b) => a.diff - b.diff);

                if (futureEvents.length > 0) {
                    const next = futureEvents[0];
                    document.getElementById('next-event-banner').style.display = 'block';
                    document.getElementById('banner-title').innerText = next.title;
                    
                    const card = document.getElementById('event-card');
                    const countdown = document.getElementById('banner-countdown');

                    if (next.diff === 0) {
                        countdown.innerText = "✨ きょうが本番だよ！ ✨";
                        card.className = "level-2"; 
                        document.getElementById('excitement-bg').style.background = "repeating-linear-gradient(45deg, #ff8bb0, #ff8bb0 10px, #fff 10px, #fff 20px)";
                    } else if (next.diff <= 3) {
                        countdown.innerText = `あと ${next.diff}日！ ドキドキ...`;
                        card.className = (next.diff === 1) ? "level-2" : "level-1"; 
                    } else {
                        countdown.innerText = `あと ${next.diff}日`;
                        card.className = ""; 
                    }
                }
            } catch(e) {
                console.error("イベントの読み込みに失敗しました:", e);
            }
        }
    </script>
</body>
</html>
