    <style>
        /* ------------------------------------------------
           きもち探偵ゲーム（チャットモード）用スタイル
        ------------------------------------------------ */
        
        /* ゲーム全体の枠 */
        .game-area {
            background-color: #fff;
            border: 4px solid #bde4ff;
            border-radius: 20px;
            padding: 10px;
            margin-bottom: 20px;
            height: 750px; 
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* チャット履歴エリア */
        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 60px 15px 15px 15px; 
            background: #f9f9f9;
            border-radius: 15px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 20px; 
            scroll-behavior: smooth;
            border: 1px solid #eee;
        }

        /* AI（わんちゃん）のふきだし */
        .bubble-ai {
            align-self: flex-start;
            background: #eef9ff;
            border: 2px solid #bde4ff;
            color: #444;
            padding: 12px 18px;
            border-radius: 20px 20px 20px 0;
            position: relative;
            max-width: 85%;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.6;
            animation: popIn 0.3s ease;
            margin-left: 50px;
            margin-top: 25px; 
        }
        .bubble-ai::before {
            content: "🐶";
            font-size: 40px; 
            position: absolute;
            top: -8px;      
            left: -50px;
            filter: drop-shadow(1px 1px 1px rgba(255,255,255,0.8)); 
        }

        /* ユーザーのふきだし */
        .bubble-user {
            align-self: flex-end;
            background: #fff9c4;
            border: 2px solid #fbc02d;
            color: #444;
            padding: 10px 15px;
            border-radius: 20px 20px 0 20px;
            max-width: 85%;
            font-size: 16px;
            animation: slideInRight 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* 選択肢エリアの枠 */
        .choice-scroll-wrapper {
            height: 320px; 
            overflow-y: auto;
            border-top: 2px dashed #ddd;
            padding-top: 10px;
            background: #fff;
            transition: 0.3s;
        }

        .choice-area {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            padding-bottom: 20px;
        }

        /* 単語ボタンのデザイン */
        .game-btn {
            padding: 12px 10px;
            font-size: 14px;
            font-weight: bold;
            border: 2px solid #ccc;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 3px 0 #ddd;
            color: #555;
            width: 48%; 
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.3;
            min-height: 50px;
        }
        .game-btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        /* 自由入力ボタン */
        .btn-free-input {
            border: 2px dashed #bde4ff !important;
            color: #555 !important;
            background-color: #f0f8ff !important;
        }

        /* 自由入力フォームエリア */
        .free-input-area {
            width: 100%;
            padding: 10px;
            text-align: center;
        }
        .free-input-text {
            width: 80%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #bde4ff;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .free-input-ok {
            padding: 10px 20px;
            background: #bde4ff;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        .btn-neg { border-color: #ffcdd2 !important; background-color: #fff0f0 !important; color: #d32f2f !important; }
        .btn-pos { border-color: #90caf9 !important; background-color: #e3f2fd !important; color: #1976d2 !important; }
        
        /* 操作ボタンエリア */
        .ctrl-btns {
            position: absolute;
            top: 10px;
            right: 15px;
            z-index: 100;
            display: flex;
            gap: 8px;
        }

        .ctrl-btn {
            font-size: 12px;
            background: #eee;
            border: 1px solid #ccc;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            opacity: 0.9;
            transition: 0.1s;
        }
        .ctrl-btn:active { transform: translateY(2px); }

        .back-btn {
            background-color: #fff9c4;
            border-color: #fbc02d;
            color: #555;
            display: none; 
        }

        /* 結果表示テキストエリア */
        .game-result-text {
            width: 100%;
            box-sizing: border-box; 
            height: 140px; 
            margin-top: 10px;
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #ffb74d; 
            display: none; 
            font-size: 16px;
            line-height: 1.6;
            background-color: #fffef8;
            resize: none; 
        }

        /* タブ切り替えボタン */
        .tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
        }
        .tab-btn {
            flex: 1; padding: 10px 0; font-size: 16px; font-weight: bold;
            border: none; border-radius: 12px; cursor: pointer;
            background-color: #eee; color: #888; transition: 0.2s;
            box-shadow: 0 3px 0 #ddd; white-space: nowrap; 
        }
        .tab-btn.active { color: white; box-shadow: 0 3px 0 rgba(0,0,0,0.2); transform: translateY(0); }
        .tab-btn:active { transform: translateY(3px); box-shadow: none; }

        @media (max-width: 400px) {
            .container { padding: 15px; }
            .game-btn { font-size: 14px; width: 48%; }
            .tab-btn { font-size: 14px; padding: 10px 0; }
        }
    </style>
</head>

        let historyStack = [];

        function startGame() {
            const historyDiv = document.getElementById('chat-history');
            historyDiv.innerHTML = "";
            document.getElementById('choice-wrapper').style.display = 'block';
            document.getElementById('choice-area').innerHTML = "";
            document.getElementById('game-final-text').style.display = 'none';
            document.getElementById('game-final-text').value = "";
            
            historyStack = [];
            updateBackButton(); 

            storyParts = { when: "", place: "", place_sub: "", person: "", action: "", action_type: "", event: "", reason: "", thought: "", body: "", last_valence: null };
            
            showStep("start");
        }

        function showStep(stepId, isBack = false) {
            const step = SCENARIO_TREE[stepId];
            if (!step) return;

            const historyDiv = document.getElementById('chat-history');
            const choiceArea = document.getElementById('choice-area');

            setTimeout(() => {
                const bubble = document.createElement('div');
                bubble.className = 'bubble-ai';
                bubble.innerText = step.text;
                historyDiv.appendChild(bubble);
                historyDiv.scrollTop = historyDiv.scrollHeight;
            }, 300);

            choiceArea.innerHTML = "";
            let choices = step.choices || [];
            if(step.getChoices) choices = step.getChoices();

            // ★★★ 自由記述ボタンの追加ロジック ★★★
            // 「終了ステップ」かどうかをチェック
            const isEndStep = !!step.end;

            const freeChoice = { 
                label: "✏️ じゆうに かく", 
                isFree: true, 
                // 終了ステップなら next は不要、それ以外なら自動判定用IDをセット
                next: isEndStep ? null : "next_auto",
                saveKey: getSaveKeyForStep(stepId),
                isLast: isEndStep 
            };
            
            choices = [...choices, freeChoice];

            const delay = 800; 
            setTimeout(() => {
                choices.forEach(c => {
                    // 通常の選択肢における「次」の決定
                    let nextStepId = c.next;
                    
                    // 自由入力ボタンで、かつ終了ステップでない場合、次のステップIDを計算する
                    if (c.isFree && !c.isLast) {
                        nextStepId = getNextStepId(stepId); 
                    }

                    // step.end が true の場合、createButton に渡す isLast を true にする
                    // 個別の選択肢(c.isLast) もしくは ステップ全体が終了(isEndStep) なら true
                    const finalIsLast = c.isLast || isEndStep;

                    createButton(c, stepId, historyDiv, choiceArea, finalIsLast, nextStepId);
                });
            }, delay);
        }

        function getSaveKeyForStep(stepId) {
            if(stepId === 'start') return 'when';
            if(stepId === 'place_check') return 'place';
            if(stepId.startsWith('place_')) return 'place_sub';
            if(stepId === 'who_check') return 'person';
            if(stepId === 'action_check') return 'action';
            if(stepId === 'event_check') return 'event';
            if(stepId === 'reason_check') return 'reason';
            if(stepId.startsWith('thought')) return 'thought';
            if(stepId === 'body_check') return 'body';
            return 'unknown';
        }

        function getNextStepId(currentStepId) {
            if(currentStepId === 'start') return 'place_check';
            if(currentStepId === 'place_check') return 'who_check'; 
            if(currentStepId.startsWith('place_')) return 'who_check';
            if(currentStepId === 'who_check') return 'action_check';
            if(currentStepId === 'action_check') return 'event_check';
            if(currentStepId === 'event_check') return 'reason_check';
            if(currentStepId === 'reason_check') return 'thought_pos'; 
            if(currentStepId.startsWith('thought')) return 'body_check';
            return null;
        }

        function createButton(choice, currentStepId, historyDiv, choiceArea, isLast, overrideNext) {
            const btn = document.createElement('button');
            btn.className = 'game-btn';
            btn.innerText = choice.label;
            
            if(choice.p) btn.classList.add('btn-pos');
            else if(choice.n) btn.classList.add('btn-neg');
            if(choice.isFree) btn.classList.add('btn-free-input');

            btn.onclick = () => {
                if (choice.isFree) {
                    showFreeInputUI(currentStepId, choiceArea, historyDiv, choice.saveKey, isLast, overrideNext);
                } else {
                    processChoice(choice.label, choice.save, choice.next, currentStepId, historyDiv, isLast);
                }
            };
            choiceArea.appendChild(btn);
        }

        // 選択肢を選んだときの共通処理
        function processChoice(label, saveData, nextStepId, currentStepId, historyDiv, isLast) {
            historyStack.push({
                stepId: currentStepId,
                storyParts: JSON.parse(JSON.stringify(storyParts)) 
            });
            updateBackButton();

            const userBubble = document.createElement('div');
            userBubble.className = 'bubble-user';
            userBubble.innerText = label;
            historyDiv.appendChild(userBubble);
            historyDiv.scrollTop = historyDiv.scrollHeight;

            if (saveData) Object.assign(storyParts, saveData);

            // ★★★ 最重要修正：isLastがtrueなら、nextStepIdに関わらず必ず文章生成へ ★★★
            if (isLast) {
                generateSentence();
            } else {
                showStep(nextStepId);
            }
        }

        function showFreeInputUI(currentStepId, choiceArea, historyDiv, saveKey, isLast, nextStepId) {
            choiceArea.innerHTML = ""; 
            
            const wrapper = document.createElement('div');
            wrapper.className = 'free-input-area';

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'free-input-text';
            input.placeholder = 'ここにかいてね';
            
            const okBtn = document.createElement('button');
            okBtn.innerText = 'OK';
            okBtn.className = 'free-input-ok';

            okBtn.onclick = () => {
                const val = input.value.trim();
                if (!val) return; 

                const saveData = {};
                saveData[saveKey] = val;
                
                if (saveKey === 'event') {
                    saveData['last_valence'] = 'p'; 
                }

                // ここでも isLast を確実に渡す
                processChoice(val, saveData, nextStepId, currentStepId, historyDiv, isLast);
            };

            wrapper.appendChild(input);
            wrapper.appendChild(okBtn);
            choiceArea.appendChild(wrapper);
            input.focus();
        }

        function goBack() {
            if (historyStack.length === 0) return;

            const prevState = historyStack.pop();
            storyParts = prevState.storyParts; 
            updateBackButton();

            const historyDiv = document.getElementById('chat-history');

            if (document.getElementById('choice-wrapper').style.display === 'none') {
                document.getElementById('game-final-text').style.display = 'none';
                document.getElementById('choice-wrapper').style.display = 'block';
                if (historyDiv.lastChild && historyDiv.lastChild.classList.contains('bubble-user')) {
                    historyDiv.removeChild(historyDiv.lastChild);
                }
            } 
            else {
                if (historyDiv.lastChild && historyDiv.lastChild.classList.contains('bubble-ai')) {
                    historyDiv.removeChild(historyDiv.lastChild);
                }
                if (historyDiv.lastChild && historyDiv.lastChild.classList.contains('bubble-user')) {
                    historyDiv.removeChild(historyDiv.lastChild);
                }
            }

            if (historyDiv.lastChild && historyDiv.lastChild.classList.contains('bubble-ai')) {
                historyDiv.removeChild(historyDiv.lastChild);
            }

            showStep(prevState.stepId);
            historyDiv.scrollTop = historyDiv.scrollHeight;
        }

        function updateBackButton() {
            const btn = document.getElementById('btn-back');
            if (historyStack.length > 0) {
                btn.style.display = 'block';
            } else {
                btn.style.display = 'none';
            }
        }

        function generateSentence() {
            document.getElementById('choice-wrapper').style.display = 'none';
            const finalText = document.getElementById('game-final-text');
            finalText.style.display = 'block';

            const TEMPLATES = [
                "{w}、{p}の{ps}で、{pe}{a}していたら、{e}。{r}。それで、{t}とおもいました。\n(からだは、{b} です)",
                "{w}のこと。{p}の{ps}にいったよ。{pe}{a}したんだ。そしたら、{e}。{r}。{t}ってかんじたよ。\n(からだ：{b})",
                "きいて。{w}、{p}の{ps}でね、{pe}{a}してたの。そうしたら{e}。{r}。{t}だったよ。\n(いまのからだ：{b})"
            ];

            const template = TEMPLATES[Math.floor(Math.random() * TEMPLATES.length)];

            let w = storyParts.when;
            let p = storyParts.place;
            let ps = storyParts.place_sub;
            let pe = storyParts.person === "ひとり" ? "ひとりで" : (storyParts.person + "と");
            let a = storyParts.action;
            let e = storyParts.event;
            let r = storyParts.reason ? `りゆうは、${storyParts.reason}` : "";
            let t = storyParts.thought;
            let b = storyParts.body;

            let text = template
                .replace("{w}", w)
                .replace("{p}", p)
                .replace("{ps}", ps)
                .replace("{pe}", pe)
                .replace("{a}", a)
                .replace("{e}", e)
                .replace("{r}", r)
                .replace("{t}", t)
                .replace("{b}", b);

            text = text.replace("。。", "。"); 
            text = text.replace("りゆうは、。", "");

            finalText.value = text;
        }

        window.onload = startGame;

        // ★★★ ボタンクリック処理（GAS連携対応版） ★★★
        submitBtn.addEventListener('click', function() {
            let finalInput = "";
            if (currentMode === 'free') {
                finalInput = document.getElementById('user-input-free').value;
            } else {
                finalInput = document.getElementById('game-final-text').value;
                if(!finalInput) finalInput = "（おはなしの とちゅう）";
            }
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'おくってるよ... 🚀';
            
            const now = new Date();
            const dateStr = now.getFullYear() + "-" + 
                           String(now.getMonth()+1).padStart(2, '0') + "-" + 
                           String(now.getDate()).padStart(2, '0') + " " + 
                           String(now.getHours()).padStart(2, '0') + ":" + 
                           String(now.getMinutes()).padStart(2, '0') + ":" + 
                           String(now.getSeconds()).padStart(2, '0');

            const newLog = {
                created_at: dateStr,
                color: colorKey,
                emotion_label: theme.label,
                user_input: finalInput || "-"
            };

            try {
                const logs = JSON.parse(localStorage.getItem('emotion_logs') || "[]");
                logs.unshift(newLog);
                localStorage.setItem('emotion_logs', JSON.stringify(logs));
            } catch(e) { console.error(e); }

            const postData = { color: colorKey, emotion: theme.label, text: finalInput || "（テキストなし）" };

            let sendPromise = Promise.resolve();
            if (typeof GAS_URL !== 'undefined' && GAS_URL && GAS_URL.startsWith('http')) {
                sendPromise = fetch(GAS_URL, {
                    method: 'POST',
                    redirect: "follow",
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(postData)
                });
            }

            sendPromise.finally(() => {
                window.location.href = `result.html?color=${colorKey}&input=${encodeURIComponent(finalInput)}`;
            });
        });
    </script>
</body>
</html>
