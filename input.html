<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>きもちをおしえて</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ------------------------------------------------
           既存のスタイル（完全維持）
        ------------------------------------------------ */
        .game-area {
            background-color: #fff;
            border: 4px solid #bde4ff;
            border-radius: 20px;
            padding: 10px;
            margin-bottom: 20px;
            height: 750px; 
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 60px 15px 15px 15px; 
            background: #f9f9f9;
            border-radius: 15px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 20px; 
            scroll-behavior: smooth;
            border: 1px solid #eee;
        }
        .bubble-ai {
            align-self: flex-start;
            background: #eef9ff;
            border: 2px solid #bde4ff;
            color: #444;
            padding: 12px 18px;
            border-radius: 20px 20px 20px 0;
            position: relative;
            max-width: 85%;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.6;
            animation: popIn 0.3s ease;
            margin-left: 50px;
            margin-top: 25px; 
        }
        .bubble-ai::before {
            content: "🐶";
            font-size: 40px; 
            position: absolute;
            top: -8px;      
            left: -50px;
        }
        .bubble-user {
            align-self: flex-end;
            background: #fff9c4;
            border: 2px solid #fbc02d;
            color: #444;
            padding: 10px 15px;
            border-radius: 20px 20px 0 20px;
            max-width: 85%;
            font-size: 16px;
            animation: slideInRight 0.3s ease;
        }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

        .choice-scroll-wrapper {
            height: 320px; 
            overflow-y: auto;
            border-top: 2px dashed #ddd;
            padding-top: 10px;
            background: #fff;
        }
        .choice-area { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding-bottom: 20px; }
        .game-btn {
            padding: 12px 10px; font-size: 14px; font-weight: bold; border: 2px solid #ccc; border-radius: 12px;
            background: white; cursor: pointer; box-shadow: 0 3px 0 #ddd; width: 48%; min-height: 50px;
            text-align: center; display: flex; align-items: center; justify-content: center;
        }
        .game-btn:active { transform: translateY(3px); box-shadow: none; }
        .btn-neg { border-color: #ffcdd2 !important; background-color: #fff0f0 !important; color: #d32f2f !important; }
        .btn-pos { border-color: #90caf9 !important; background-color: #e3f2fd !important; color: #1976d2 !important; }

        /* ------------------------------------------------
           新しく付け加えたスタイル
        ------------------------------------------------ */
        .tab-container { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn {
            flex: 1; padding: 12px 0; font-size: 14px; font-weight: bold;
            border: none; border-radius: 15px; cursor: pointer; background-color: #eee; color: #888;
        }
        .tab-btn.active { color: white; }

        #mode-doctor-area {
            display: none; background: #fdfbff; border-radius: 20px; padding: 15px;
            border: 4px solid #b49cff; margin-bottom: 20px; flex-direction: column; height: 500px;
        }
        .doctor-chat-log {
            flex: 1; overflow-y: auto; background: #fff; border-radius: 15px; padding: 15px;
            margin-bottom: 10px; border: 1px solid #eee; display: flex; flex-direction: column; gap: 15px;
        }
        .doctor-bubble-ai {
            align-self: flex-start; background: #f3f0ff; border: 2px solid #b49cff;
            padding: 10px 15px; border-radius: 15px 15px 15px 0; font-size: 15px; font-weight: bold;
            max-width: 85%; position: relative; margin-left: 45px;
        }
        .doctor-bubble-ai::before { content: "🎓"; font-size: 30px; position: absolute; left: -45px; top: 0; }
        .doctor-bubble-user {
            align-self: flex-end; background: #fff9c4; border: 2px solid #fbc02d;
            padding: 10px 15px; border-radius: 15px 15px 0 15px; font-size: 15px; max-width: 85%;
        }
        .doctor-input-box { display: flex; gap: 8px; }
        .doctor-input { flex: 1; padding: 12px; border-radius: 12px; border: 2px solid #b49cff; font-size: 16px; outline: none; }
        .doctor-send-btn { background: #b49cff; color: white; border: none; padding: 0 20px; border-radius: 12px; font-weight: bold; }

        .gauge-wrapper { background: white; padding: 15px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .gauge-container { display: flex; justify-content: center; gap: 10px; }
        .gauge-btn { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #ccc; background: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; }
        .gauge-btn.selected { color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="emotion-label"></h1>
        
        <div class="tab-container">
            <button id="tab-game" class="tab-btn active" onclick="switchMode('game')">🐶 いっしょにさがす</button>
            <button id="tab-doctor" class="tab-btn" onclick="switchMode('doctor')">🎓 はかせとひもとく</button>
            <button id="tab-free" class="tab-btn" onclick="switchMode('free')">✏️ じゆうにかく</button>
        </div>

        <div id="mode-game-area" class="game-area">
            <div class="ctrl-btns" style="position: absolute; top: 10px; right: 15px; z-index: 100; display: flex; gap: 8px;">
                <button id="btn-back" class="ctrl-btn" style="display:none;" onclick="goBack()">↩ 1つもどる</button>
                <button class="ctrl-btn" onclick="startGame()">🔄 さいしょから</button>
            </div>
            <div id="chat-history" class="chat-history"></div>
            <div id="choice-wrapper" class="choice-scroll-wrapper">
                <div id="choice-area" class="choice-area"></div>
            </div>
            <textarea id="game-final-text" style="width:100%; height:140px; border-radius:10px; border:2px solid #ffb74d; display:none; padding:10px; box-sizing:border-box; background:#fffef8; resize:none;"></textarea>
        </div>

        <div id="mode-doctor-area">
            <div id="doctor-chat-log" class="doctor-chat-log">
                <div class="doctor-bubble-ai">こんにちは。博士太郎だよ。なにか もやもや しているのかな？ いっしょに 原因を さがしてみよう。</div>
            </div>
            <div class="doctor-input-box">
                <input type="text" id="doctor-user-input" class="doctor-input" placeholder="ここにお返事をかいてね">
                <button onclick="talkToDoctor()" id="doctor-send-btn" class="doctor-send-btn">送信</button>
            </div>
        </div>

        <div id="mode-free-area" style="display:none;">
            <p>あたま の なか の ことば を おしえてね</p>
            <textarea id="user-input-free" style="width:100%; height:150px; border-radius:15px; padding:15px; box-sizing:border-box; border:2px solid #ccc;" placeholder="ここにかいてね"></textarea>
        </div>

        <div class="gauge-wrapper">
            <div class="gauge-section" style="margin-bottom:15px; text-align:center;">
                <span style="font-weight:bold; color:#555;">❤️ きもちの つよさ</span>
                <div class="gauge-container" id="gauge-emotion">
                    <div class="gauge-btn" data-val="1">1</div>
                    <div class="gauge-btn" data-val="2">2</div>
                    <div class="gauge-btn" data-val="3">3</div>
                    <div class="gauge-btn" data-val="4">4</div>
                    <div class="gauge-btn" data-val="5">5</div>
                </div>
            </div>
            <div class="gauge-section" style="text-align:center;">
                <span style="font-weight:bold; color:#555;">🥱 ねむたさ</span>
                <div class="gauge-container" id="gauge-sleep">
                    <div class="gauge-btn" data-val="1">1</div>
                    <div class="gauge-btn" data-val="2">2</div>
                    <div class="gauge-btn" data-val="3">3</div>
                    <div class="gauge-btn" data-val="4">4</div>
                    <div class="gauge-btn" data-val="5">5</div>
                </div>
            </div>
        </div>

        <button id="submit-btn" style="width:100%; padding:15px; border-radius:30px; border:none; color:white; font-weight:bold; font-size:18px; cursor:pointer;">
            おくる 🚀
        </button>
        <a href="index.html" style="display:block; text-align:center; margin-top:20px; color:#888; text-decoration:none;">もどる</a>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyoM20f2RskSPGOr8qQmsUkL5M6Ykusyp6wBaRit71hsvdQ4gbXIO6HrAAlkq4RCbJT/exec"; 

        const SETTINGS = {
            "pink":   { label: "😄 うれしい", bg: "#fff0f7", main: "#ff8bb0" },
            "green":  { label: "😌 おちつく", bg: "#f0fff3", main: "#6ecb63" },
            "yellow": { label: "😮 びっくり", bg: "#fffbe0", main: "#f1c232" },
            "purple": { label: "😕 もやもや", bg: "#f9f5ff", main: "#b49cff" },
            "blue":   { label: "😢 さみしい", bg: "#f0f6ff", main: "#7da6ff" },
            "black":  { label: "😴 つかれた", bg: "#f3f3f3", main: "#8c8c8c" },
            "red":    { label: "😡 イライラ", bg: "#fff0f0", main: "#ff6f6f" },
            "white":  { label: "😁 期間限定", bg: "#ffffff", main: "#cccccc" }
        };

        const params = new URLSearchParams(window.location.search);
        const colorKey = params.get('color') || 'white';
        const theme = SETTINGS[colorKey] || SETTINGS['white'];

        document.body.style.backgroundColor = theme.bg;
        document.getElementById('emotion-label').innerText = theme.label;
        document.getElementById('emotion-label').style.color = theme.main;
        document.getElementById('submit-btn').style.backgroundColor = theme.main;

        let currentEmotionLevel = 3;
        let currentSleepLevel = 1;
        let doctorLog = ""; 

        // ゲージの初期化（既存）
        function setupGauge(id, onChange) {
            const container = document.getElementById(id);
            const btns = container.querySelectorAll('.gauge-btn');
            btns.forEach(btn => {
                btn.addEventListener('click', () => {
                    btns.forEach(b => { b.classList.remove('selected'); b.style.backgroundColor = ""; });
                    btn.classList.add('selected');
                    btn.style.backgroundColor = theme.main;
                    onChange(btn.getAttribute('data-val'));
                });
            });
        }
        setupGauge('gauge-emotion', val => currentEmotionLevel = val);
        setupGauge('gauge-sleep', val => currentSleepLevel = val);

        // モード切り替え（追加）
        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('mode-game-area').style.display = (mode === 'game' ? 'flex' : 'none');
            document.getElementById('mode-doctor-area').style.display = (mode === 'doctor' ? 'flex' : 'none');
            document.getElementById('mode-free-area').style.display = (mode === 'free' ? 'block' : 'none');
            document.getElementById('tab-game').classList.toggle('active', mode === 'game');
            document.getElementById('tab-doctor').classList.toggle('active', mode === 'doctor');
            document.getElementById('tab-free').classList.toggle('active', mode === 'free');
            document.getElementById('tab-game').style.backgroundColor = (mode === 'game' ? theme.main : "#eee");
            document.getElementById('tab-doctor').style.backgroundColor = (mode === 'doctor' ? theme.main : "#eee");
            document.getElementById('tab-free').style.backgroundColor = (mode === 'free' ? theme.main : "#eee");
        }

        // 🎓 はかせモード対話（追加）
        async function talkToDoctor() {
            const input = document.getElementById('doctor-user-input');
            const log = document.getElementById('doctor-chat-log');
            const text = input.value.trim();
            if(!text) return;
            log.innerHTML += `<div class="doctor-bubble-user">${text}</div>`;
            doctorLog += `ぼく: ${text}\n`;
            input.value = "";
            log.scrollTop = log.scrollHeight;
            const loading = document.createElement('div');
            loading.innerText = "🎓 はかせがかんがえちゅう...";
            loading.style.fontSize = "12px"; loading.style.color = "#aaa";
            log.appendChild(loading);
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ type: "ai_consult", text: text, mode: "moyamoya" }) });
                const data = await res.json();
                const ai = JSON.parse(data.reply);
                loading.remove();
                log.innerHTML += `<div class="doctor-bubble-ai">${ai.reply}</div>`;
                doctorLog += `はかせ: ${ai.reply}\n`;
                log.scrollTop = log.scrollHeight;
            } catch (e) { loading.innerText = "通信エラー😢"; }
        }

        /* ------------------------------------------------
           既存の心理探偵ゲームロジック（完全維持）
        ------------------------------------------------ */
        let storyParts = { when: "", place: "", place_sub: "", person: "", action: "", action_type: "", event: "", reason: "", thought: "", body: "", want_call: "", last_valence: null };
        const DATA = {
            when: [{ label: "🌞 いま", value: "いま" },{ label: "🕰 さっき", value: "さっき" },{ label: "🌅 きょうのあさ", value: "きょうのあさ" },{ label: "☀️ きょうのおひる", value: "きょうのおひる" },{ label: "🌇 ゆうがた", value: "きょうのゆうがた" },{ label: "🌙 よる", value: "きょうのよる" },{ label: "📅 まえ", value: "まえ" }],
            people: [{ label: "👦 かなとくん", value: "かなとくん" },{ label: "👩‍🦰 ゆうき", value: "ゆうき" },{ label: "👦 まさとくん", value: "まさとくん" },{ label: "👤 ぼく", value: "ぼく" }],
            body_pos: [{ label: "✨ からだかるい", value: "からだがかるかった", p:true },{ label: "😌 ポカポカ", value: "ポカポカしていた", p:true }],
            body_neg: [{ label: "🔥 カッカする", value: "かおがカッカした", n:true },{ label: "🕳 むねがキュッ", value: "むねがキュッとした", n:true }],
            body_tired: [{ label: "🛌 からだおもい", value: "からだがおもかった", n:true }],
            thought_pos: [{ label: "😤 やりきった", value: "「やりきった！」", p:true },{ label: "🥰 だいすき", value: "「だいすき」", p:true }],
            thought_neg: [{ label: "😿 ずるい！", value: "「ずるい！」", n:true },{ label: "🏠 かえりたい", value: "「かえりたい」", n:true }]
        };
        const DEFAULT_ACTIONS = [{l:"👀 みる", v:"なにかをみていた", t:"passive_active"},{l:"🗣 はなす", v:"だれかとはなしていた", t:"social"}];
        const ACTIONS_MAP = { "きょうしつ": [{l:"✏️ べんきょう", v:"べんきょう", t:"study"},{l:"🍱 きゅうしょく", v:"きゅうしょく", t:"eat"}],"リビング": [{l:"📺 テレビ", v:"テレビ", t:"passive"},{l:"🍽 ごはん", v:"ごはん", t:"eat"}] };
        const EVENTS_MAP = { "study": [{l:"💡 わかった", v:"わかった", p:true}, {l:"😵 わからない", v:"わからなかった", n:true}],"eat": [{l:"😋 おいしい", v:"おいしかった", p:true}, {l:"🤢 きらい", v:"きらいなものだった", n:true}] };

        function getReasonChoices(isPositive) {
            return isPositive ? [{ label: "😤 がんばった", save: {reason: "がんばったから"}, p:true },{ label: "😊 すきなこと", save: {reason: "すきなことだったから"}, p:true }] 
                               : [{ label: "🌀 はじめて", save: {reason: "はじめてでわからなくて"}, n:true },{ label: "🤕 いたい", save: {reason: "いたくて"}, n:true }];
        }
        function getBodyChoices(isPositive) { return isPositive ? [...DATA.body_pos, {label:"😐 ふつう", value:"ふつう"}] : [...DATA.body_neg, ...DATA.body_tired, {label:"😐 ふつう", value:"ふつう"}]; }

        const SCENARIO_TREE = {
            start: { text: "いっしょに さがそう。\nそれは、いつ あったこと？", choices: DATA.when.map(w => ({ label: w.label, next: "place_check", save: {when: w.value} })) },
            place_check: { text: "どこで あったこと？", choices: [{ label: "🏫 がっこう", next: "place_school", save: {place: "がっこう"} },{ label: "🏠 おうち", next: "place_home", save: {place: "おうち"} }] },
            place_school: { text: "がっこうの、どこ？", choices: [ {label:"🪑 きょうしつ", next:"who_check", save:{place_sub:"きょうしつ"}} ] },
            place_home: { text: "おうちの、どこ？", choices: [ {label:"🛋 リビング", next:"who_check", save:{place_sub:"リビング"}} ] },
            who_check: { text: "そこに、だれと いたの？", choices: DATA.people.map(p => ({ label: p.label, next: "action_check", save: {person: p.value} })) },
            action_check: { text: "なにを している ときだった？", getChoices: () => (ACTIONS_MAP[storyParts.place_sub] || DEFAULT_ACTIONS).map(a => ({ label: a.l, next: "event_check", save: { action: a.v, action_type: a.t } })) },
            event_check: { text: "そこで、なにが あったの？", getChoices: () => (EVENTS_MAP[storyParts.action_type] || EVENTS_MAP["eat"]).map(e => ({ label: e.l, next: "reason_check", save: { event: e.v, last_valence: e.n ? 'n' : 'p' }, p: e.p, n: e.n })) },
            reason_check: { text: "どうして そうなったのかな？", getChoices: () => { const isPos = storyParts.last_valence === 'p'; return getReasonChoices(isPos).map(r => ({ label: r.label, next: isPos ? "thought_pos" : "thought_neg", save: r.save, p: r.p, n: r.n })); } },
            thought_pos: { text: "いいね！どんなふうに おもった？", choices: DATA.thought_pos.map(t => ({...t, next: "body_check", save:{thought: t.value}})) },
            thought_neg: { text: "そうかぁ。そのとき、どうおもった？", choices: DATA.thought_neg.map(t => ({...t, next: "body_check", save:{thought: t.value}})) },
            body_check: { text: "いまの からだは どんなかんじ？", getChoices: () => getBodyChoices(storyParts.last_valence === 'p').map(b => ({ label: b.label, save: {body: b.value}, p: b.p, n: b.n, next: "call_check" })) },
            call_check: { text: "かなとくんと、でんわ📞したい？", choices: [{ label: "📞 したい！", save: {want_call: "\n(でんわ：したい！)"}, p:true },{ label: "🙅‍♂️ しない", save: {want_call: "\n(でんわ：しない)"} }], end: true }
        };

        let historyStack = [];
        function startGame() {
            document.getElementById('chat-history').innerHTML = "";
            document.getElementById('choice-wrapper').style.display = 'block';
            document.getElementById('game-final-text').style.display = 'none';
            historyStack = []; storyParts = { when: "", place: "", place_sub: "", person: "", action: "", action_type: "", event: "", reason: "", thought: "", body: "", want_call: "", last_valence: null };
            showStep("start");
        }
        function showStep(stepId) {
            const step = SCENARIO_TREE[stepId];
            const h = document.getElementById('chat-history');
            const cArea = document.getElementById('choice-area');
            setTimeout(() => {
                const b = document.createElement('div'); b.className = 'bubble-ai'; b.innerText = step.text;
                h.appendChild(b); h.scrollTop = h.scrollHeight;
            }, 300);
            cArea.innerHTML = "";
            let choices = (step.getChoices ? step.getChoices() : step.choices);
            choices.forEach(c => {
                const btn = document.createElement('button'); btn.className = 'game-btn'; btn.innerText = c.label;
                if(c.p) btn.classList.add('btn-pos'); else if(c.n) btn.classList.add('btn-neg');
                btn.onclick = () => {
                    historyStack.push({ stepId, storyParts: JSON.parse(JSON.stringify(storyParts)) });
                    const ub = document.createElement('div'); ub.className = 'bubble-user'; ub.innerText = c.label;
                    h.appendChild(ub); h.scrollTop = h.scrollHeight;
                    Object.assign(storyParts, c.save);
                    if(step.end) generateSentence(); else showStep(c.next);
                };
                cArea.appendChild(btn);
            });
        }
        function generateSentence() {
            document.getElementById('choice-wrapper').style.display = 'none';
            const f = document.getElementById('game-final-text'); f.style.display = 'block';
            f.value = `${storyParts.when}、${storyParts.place}の${storyParts.place_sub}で${storyParts.person}と${storyParts.action}をしていたら、${storyParts.event}。りゆうは${storyParts.reason}。${storyParts.thought}とおもったよ。(からだは${storyParts.body})${storyParts.want_call}`;
        }

        // 送信処理（既存＋はかせ対応）
        document.getElementById('submit-btn').addEventListener('click', async function() {
            let finalInput = "";
            if (currentMode === 'free') finalInput = document.getElementById('user-input-free').value;
            else if (currentMode === 'doctor') finalInput = doctorLog || "はかせとおはなししたよ";
            else finalInput = document.getElementById('game-final-text').value || "（おはなしのとちゅう）";
            
            finalInput += `\n(きもち:${currentEmotionLevel}, ねむたさ:${currentSleepLevel})`;
            this.disabled = true; this.innerHTML = 'おくってるよ... 🚀';
            try {
                await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ color: colorKey, emotion: theme.label, text: finalInput }) });
                window.location.href = `result.html?color=${colorKey}&input=${encodeURIComponent(finalInput)}`;
            } catch(e) { alert("エラー"); this.disabled = false; this.innerHTML = 'おくる 🚀'; }
        });

        switchMode('game');
        startGame();
    </script>
</body>
</html>
