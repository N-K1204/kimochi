<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <title>きもちをおしえて</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ------------------------------------------------
           きもち探偵ゲーム（チャットモード）用スタイル
        ------------------------------------------------ */
        
        /* ゲーム全体の枠 */
        .game-area {
            background-color: #fff;
            border: 4px solid #bde4ff;
            border-radius: 20px;
            padding: 10px;
            margin-bottom: 20px;
            height: 750px; 
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* チャット履歴エリア */
        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 60px 15px 15px 15px; 
            background: #f9f9f9;
            border-radius: 15px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 20px; 
            scroll-behavior: smooth;
            border: 1px solid #eee;
        }

        /* AI（わんちゃん）のふきだし */
        .bubble-ai {
            align-self: flex-start;
            background: #eef9ff;
            border: 2px solid #bde4ff;
            color: #444;
            padding: 12px 18px;
            border-radius: 20px 20px 20px 0;
            position: relative;
            max-width: 85%;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.6;
            animation: popIn 0.3s ease;
            margin-left: 50px;
            margin-top: 25px; 
        }
        .bubble-ai::before {
            content: "🐶";
            font-size: 40px; 
            position: absolute;
            top: -8px;      
            left: -50px;
            filter: drop-shadow(1px 1px 1px rgba(255,255,255,0.8)); 
        }

        /* ユーザーのふきだし */
        .bubble-user {
            align-self: flex-end;
            background: #fff9c4;
            border: 2px solid #fbc02d;
            color: #444;
            padding: 10px 15px;
            border-radius: 20px 20px 0 20px;
            max-width: 85%;
            font-size: 16px;
            animation: slideInRight 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* 選択肢エリアの枠 */
        .choice-scroll-wrapper {
            height: 320px; 
            overflow-y: auto;
            border-top: 2px dashed #ddd;
            padding-top: 10px;
            background: #fff;
            transition: 0.3s;
        }

        .choice-area {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            padding-bottom: 20px;
        }

        /* 単語ボタンのデザイン */
        .game-btn {
            padding: 12px 10px;
            font-size: 14px;
            font-weight: bold;
            border: 2px solid #ccc;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 3px 0 #ddd;
            color: #555;
            width: 48%; 
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.3;
            min-height: 50px;
        }
        .game-btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        .btn-neg { border-color: #ffcdd2 !important; background-color: #fff0f0 !important; color: #d32f2f !important; }
        .btn-pos { border-color: #90caf9 !important; background-color: #e3f2fd !important; color: #1976d2 !important; }
        
        /* 操作ボタンエリア */
        .ctrl-btns {
            position: absolute;
            top: 10px;
            right: 15px;
            z-index: 100;
            display: flex;
            gap: 8px;
        }

        .ctrl-btn {
            font-size: 12px;
            background: #eee;
            border: 1px solid #ccc;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            opacity: 0.9;
            transition: 0.1s;
        }
        .ctrl-btn:active { transform: translateY(2px); }

        .back-btn {
            background-color: #fff9c4;
            border-color: #fbc02d;
            color: #555;
            display: none; 
        }

        /* 結果表示テキストエリア */
        .game-result-text {
            width: 100%;
            box-sizing: border-box; 
            height: 140px; 
            margin-top: 10px;
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #ffb74d; 
            display: none; 
            font-size: 16px;
            line-height: 1.6;
            background-color: #fffef8;
            resize: none; 
        }

        /* タブ切り替えボタン */
        .tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
        }
        .tab-btn {
            flex: 1; padding: 10px 0; font-size: 16px; font-weight: bold;
            border: none; border-radius: 12px; cursor: pointer;
            background-color: #eee; color: #888; transition: 0.2s;
            box-shadow: 0 3px 0 #ddd; white-space: nowrap; 
        }
        .tab-btn.active { color: white; box-shadow: 0 3px 0 rgba(0,0,0,0.2); transform: translateY(0); }
        .tab-btn:active { transform: translateY(3px); box-shadow: none; }

        @media (max-width: 400px) {
            .container { padding: 15px; }
            .game-btn { font-size: 14px; width: 48%; }
            .tab-btn { font-size: 14px; padding: 10px 0; }
        }
    </style>
</head>

        let historyStack = [];

        function startGame() {
            const historyDiv = document.getElementById('chat-history');
            historyDiv.innerHTML = "";
            document.getElementById('choice-wrapper').style.display = 'block';
            document.getElementById('choice-area').innerHTML = "";
            document.getElementById('game-final-text').style.display = 'none';
            document.getElementById('game-final-text').value = "";
            
            historyStack = [];
            updateBackButton(); 

            storyParts = { when: "", place: "", place_sub: "", person: "", action: "", action_type: "", event: "", reason: "", thought: "", body: "" };
            
            showStep("start");
        }

        function showStep(stepId, isBack = false) {
            const step = SCENARIO_TREE[stepId];
            if (!step) return;

            const historyDiv = document.getElementById('chat-history');
            const choiceArea = document.getElementById('choice-area');

            setTimeout(() => {
                const bubble = document.createElement('div');
                bubble.className = 'bubble-ai';
                bubble.innerText = step.text;
                historyDiv.appendChild(bubble);
                historyDiv.scrollTop = historyDiv.scrollHeight;
            }, 300);

            choiceArea.innerHTML = "";
            let choices = step.choices || [];
            if(step.getChoices) choices = step.getChoices();

            if (step.end) {
                setTimeout(() => {
                    choices.forEach(c => createButton(c, stepId, historyDiv, choiceArea, true));
                    // 状況に応じた提案ボタンを追加
                    generateContextualSuggestions(stepId, choiceArea);
                }, 800);
            } else {
                setTimeout(() => {
                    choices.forEach(c => createButton(c, stepId, historyDiv, choiceArea, false));
                    // 状況に応じた提案ボタンを追加
                    generateContextualSuggestions(stepId, choiceArea);
                }, 800);
            }
        }

        function createButton(choice, currentStepId, historyDiv, choiceArea, isLast) {
            const btn = document.createElement('button');
            btn.className = 'game-btn';
            btn.innerText = choice.label;
            
            if(choice.p) btn.classList.add('btn-pos');
            else if(choice.n) btn.classList.add('btn-neg');

            btn.onclick = () => {
                historyStack.push({
                    stepId: currentStepId,
                    storyParts: JSON.parse(JSON.stringify(storyParts)) 
                });
                updateBackButton();

                const userBubble = document.createElement('div');
                userBubble.className = 'bubble-user';
                userBubble.innerText = choice.label;
                historyDiv.appendChild(userBubble);
                historyDiv.scrollTop = historyDiv.scrollHeight;

                if (choice.save) Object.assign(storyParts, choice.save);

                if (isLast) generateSentence();
                else showStep(choice.next);
            };
            choiceArea.appendChild(btn);
        }

        function goBack() {
            if (historyStack.length === 0) return;

            const prevState = historyStack.pop();
            storyParts = prevState.storyParts; 
            updateBackButton();

            const historyDiv = document.getElementById('chat-history');

            if (document.getElementById('choice-wrapper').style.display === 'none') {
                document.getElementById('game-final-text').style.display = 'none';
                document.getElementById('choice-wrapper').style.display = 'block';
                if (historyDiv.lastChild && historyDiv.lastChild.classList.contains('bubble-user')) {
                    historyDiv.removeChild(historyDiv.lastChild);
                }
            } 
            else {
                if (historyDiv.lastChild && historyDiv.lastChild.classList.contains('bubble-ai')) {
                    historyDiv.removeChild(historyDiv.lastChild);
                }
                if (historyDiv.lastChild && historyDiv.lastChild.classList.contains('bubble-user')) {
                    historyDiv.removeChild(historyDiv.lastChild);
                }
            }

            if (historyDiv.lastChild && historyDiv.lastChild.classList.contains('bubble-ai')) {
                historyDiv.removeChild(historyDiv.lastChild);
            }

            showStep(prevState.stepId);
            historyDiv.scrollTop = historyDiv.scrollHeight;
        }

        function updateBackButton() {
            const btn = document.getElementById('btn-back');
            if (historyStack.length > 0) {
                btn.style.display = 'block';
            } else {
                btn.style.display = 'none';
            }
        }

        // 提案ボタンを生成する（重複避け、文脈対応版）
        function generateContextualSuggestions(stepId, choiceArea) {
            try {
                // 既存の提案エリアをクリア
                const existing = document.getElementById('suggestion-area');
                if (existing) existing.remove();

                const suggestions = [];

                // 既存のボタンラベル一覧を取得（重複チェック用）
                const existingLabels = Array.from(document.querySelectorAll('#choice-area .game-btn'))
                    .map(btn => btn.innerText.trim());

                // action_checkは既に選択肢が表示されているので、提案は出さない
                if (stepId === 'action_check') {
                    return; // 重複避け
                }

                // event_checkは既に選択肢が表示されているので、提案は出さない
                if (stepId === 'event_check') {
                    return; // 重複避け
                }

                // place_checkの場合：よく使う場所を提案
                if (stepId === 'place_check') {
                    const places = [
                        { label: "🏫 がっこう", save: { place: "がっこう" }, next: "place_school" },
                        { label: "🏠 おうち", save: { place: "おうち" }, next: "place_home" }
                    ];
                    suggestions.push(...places.filter(p => !existingLabels.includes(p.label)));
                }

                // who_checkの場合：文脈に応じた人物提案
                if (stepId === 'who_check') {
                    // 学校か自宅かで提案を変える
                    if (storyParts.place === 'がっこう') {
                        const schoolPeople = [
                            { label: "👦 かなとくん", save: { person: "かなとくん" }, next: "action_check" },
                            { label: "🏫 がっこうのせんせい", save: { person: "せんせい" }, next: "action_check" },
                            { label: "👥 ぐるーぷのみんな", save: { person: "ぐるーぷのみんな" }, next: "action_check" }
                        ];
                        suggestions.push(...schoolPeople.filter(p => !existingLabels.includes(p.label)));
                    } else if (storyParts.place === 'おうち') {
                        const homePeople = [
                            { label: "👩 かーちゃん", save: { person: "かーちゃん" }, next: "action_check" },
                            { label: "👨 とーちゃん", save: { person: "とーちゃん" }, next: "action_check" },
                            { label: "👤 ぼく", save: { person: "ぼく" }, next: "action_check" }
                        ];
                        suggestions.push(...homePeople.filter(p => !existingLabels.includes(p.label)));
                    }
                }

                // thought_pos / thought_negの場合：体の状態クイック提案
                if (stepId === 'body_check') {
                    // ポジティブな感情なら、ポジティブなbody提案
                    const isPositive = storyParts.thought && (storyParts.thought.includes('やった') || storyParts.thought.includes('よかった') || storyParts.thought.includes('だいすき'));
                    const bodyChoices = isPositive 
                        ? DATA.body.filter(b => b.p).slice(0, 2)
                        : DATA.body.filter(b => b.n).slice(0, 2);
                    
                    suggestions.push(...bodyChoices.filter(b => !existingLabels.includes(b.label)).map(b => ({
                        label: b.label,
                        save: { body: b.value },
                        p: b.p,
                        n: b.n
                    })));
                }

                if (suggestions.length === 0) return;

                const sugWrap = document.createElement('div');
                sugWrap.id = 'suggestion-area';
                sugWrap.style.marginTop = '8px';
                sugWrap.style.display = 'flex';
                sugWrap.style.flexWrap = 'wrap';
                sugWrap.style.gap = '8px';
                sugWrap.style.justifyContent = 'center';
                sugWrap.style.borderTop = '1px dotted #ccc';
                sugWrap.style.paddingTop = '8px';

                const historyDiv = document.getElementById('chat-history');
                const isLast = stepId === 'body_check';

                suggestions.forEach(s => {
                    const choiceObj = { 
                        label: s.label, 
                        save: s.save, 
                        next: s.next || undefined,
                        p: s.p,
                        n: s.n
                    };
                    createButton(choiceObj, stepId, historyDiv, sugWrap, isLast);
                });

                // 提案エリアをchoiceAreaの下に追加
                choiceArea.parentNode.appendChild(sugWrap);
            } catch(e) {
                console.error('Suggestion generation error:', e);
            }
        }

        function generateSentence() {
            document.getElementById('choice-wrapper').style.display = 'none';
            const finalText = document.getElementById('game-final-text');
            finalText.style.display = 'block';

            const TEMPLATES = [
                "{w}、{p}の{ps}で、{pe}{a}していたら、{e}。{r}。それで、{t}とおもいました。\n(からだは、{b} です)",
                "{w}のこと。{p}の{ps}にいったよ。{pe}{a}したんだ。そしたら、{e}。{r}。{t}ってかんじたよ。\n(からだ：{b})",
                "きいて。{w}、{p}の{ps}でね、{pe}{a}してたの。そうしたら{e}。{r}。{t}だったよ。\n(いまのからだ：{b})"
            ];

            const template = TEMPLATES[Math.floor(Math.random() * TEMPLATES.length)];

            let w = storyParts.when;
            let p = storyParts.place;
            let ps = storyParts.place_sub;
            let pe = storyParts.person === "ひとり" ? "ひとりで" : (storyParts.person + "と");
            let a = storyParts.action;
            let e = storyParts.event;
            let r = storyParts.reason ? `理由は、${storyParts.reason}` : "";
            let t = storyParts.thought;
            let b = storyParts.body;

            let text = template
                .replace("{w}", w)
                .replace("{p}", p)
                .replace("{ps}", ps)
                .replace("{pe}", pe)
                .replace("{a}", a)
                .replace("{e}", e)
                .replace("{r}", r)
                .replace("{t}", t)
                .replace("{b}", b);

            text = text.replace("。。", "。"); 
            text = text.replace("理由は、。", "");

            finalText.value = text;
        }

        window.onload = startGame;

        // ★★★ 修正箇所：ボタンクリック処理（GAS連携対応版・タイムアウト対応） ★★★
        submitBtn.addEventListener('click', function() {
            let finalInput = "";
            if (currentMode === 'free') {
                finalInput = document.getElementById('user-input-free').value;
            } else {
                finalInput = document.getElementById('game-final-text').value;
                if(!finalInput) finalInput = "（おはなしの とちゅう）";
            }

            // ボタン連打防止
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'おくってるよ... 🚀';

            // ローカル保存
            try {
                const now = new Date();
                const dateStr = now.getFullYear() + "-" +
                               String(now.getMonth()+1).padStart(2, '0') + "-" +
                               String(now.getDate()).padStart(2, '0') + " " +
                               String(now.getHours()).padStart(2, '0') + ":" +
                               String(now.getMinutes()).padStart(2, '0') + ":" +
                               String(now.getSeconds()).padStart(2, '0');

                const newLog = {
                    created_at: dateStr,
                    color: colorKey,
                    emotion_label: theme.label,
                    user_input: finalInput || "-"
                };
                const logs = JSON.parse(localStorage.getItem('emotion_logs') || "[]");
                logs.unshift(newLog);
                localStorage.setItem('emotion_logs', JSON.stringify(logs));
            } catch(e) { console.error(e); }

            // GAS送信（タイムアウト付き）
            const postData = { color: colorKey, emotion: theme.label, text: finalInput || "（テキストなし）" };

            function addSendHistory(entry) {
                try {
                    const arr = JSON.parse(localStorage.getItem('send_history') || '[]');
                    arr.unshift(entry);
                    localStorage.setItem('send_history', JSON.stringify(arr.slice(0, 200))); // keep recent 200
                } catch(e) { console.error('addSendHistory error', e); }
            }

            function fetchWithTimeout(url, options = {}, timeout = 6000) {
                const controller = new AbortController();
                const signal = controller.signal;
                const fetchPromise = fetch(url, Object.assign({}, options, { signal }));
                const timeoutId = setTimeout(() => controller.abort(), timeout);
                return fetchPromise.finally(() => clearTimeout(timeoutId));
            }

            let sendPromise = Promise.resolve();
            if (typeof GAS_URL !== 'undefined' && GAS_URL && GAS_URL.startsWith('http')) {
                // try send with retries; if fails, enqueue for later
                const trySendOnce = (asContentType = GAS_CONTENT_TYPE) => {
                    const headers = { 'Content-Type': asContentType };
                    const payload = asContentType.includes('json') ? JSON.stringify(postData) : JSON.stringify(postData);
                    const attemptTs = new Date().toISOString();
                    return fetchWithTimeout(GAS_URL, {
                        method: 'POST',
                        headers,
                        body: payload
                    }, 6000)
                    .then(response => response.text().then(text => ({ status: response.status, text })))
                    .then(({status, text}) => {
                        let parsed = null;
                        try { parsed = text ? JSON.parse(text) : null; } catch(e) { parsed = { raw: text }; }
                        addSendHistory({ ts: attemptTs, success: true, status: status, response: parsed, contentType: asContentType });
                        console.log('GAS body:', parsed);
                        return true;
                    })
                    .catch(err => {
                        const reason = (err && err.name === 'AbortError') ? 'timeout' : (err && err.message ? err.message : String(err));
                        addSendHistory({ ts: attemptTs, success: false, reason, contentType: asContentType });
                        if (err && err.name === 'AbortError') console.warn('GAS fetch aborted: timeout');
                        else console.warn('GAS send failed:', reason);
                        return false;
                    });
                };

                const trySendWithRetries = async (maxAttempts = 3) => {
                    for (let i = 0; i < maxAttempts; i++) {
                        const ok = await trySendOnce();
                        if (ok) return true;
                        // backoff
                        await new Promise(r => setTimeout(r, 500 * Math.pow(2, i)));
                    }
                    return false;
                };

                const enqueuePending = (payload, note) => {
                    try {
                        const list = JSON.parse(localStorage.getItem('pending_sends') || '[]');
                        list.push({ payload, ts: new Date().toISOString(), note: note || '' });
                        localStorage.setItem('pending_sends', JSON.stringify(list));
                        console.log('Enqueued pending send (total):', list.length);
                        addSendHistory({ ts: new Date().toISOString(), enqueued: true, note: note || '' });
                    } catch(e) { console.error('enqueuePending error', e); }
                };

                const trySendBeacon = (payload) => {
                    try {
                        if (navigator.sendBeacon) {
                            const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
                            const ok = navigator.sendBeacon(GAS_URL, blob);
                            console.log('sendBeacon used, returned:', ok);
                            return ok;
                        }
                    } catch(e) { console.warn('sendBeacon failed', e); }
                    return false;
                };

                // perform send, and enqueue if failed
                sendPromise = (async () => {
                    const ok = await trySendWithRetries(2);
                    if (!ok) {
                        // try sendBeacon as last ditch
                        const beaconOk = trySendBeacon(postData);
                        if (!beaconOk) enqueuePending(postData);
                    }
                })();
            }

            // タイムアウトやエラーでも必ず画面遷移させる
            sendPromise.finally(() => {
                // 画面遷移
                window.location.href = `result.html?color=${colorKey}&input=${encodeURIComponent(finalInput)}`;
            });
        });

        // 再送処理：ページ読み込み時に未送信キューをフラッシュする
        async function flushPendingSends() {
            try {
                const list = JSON.parse(localStorage.getItem('pending_sends') || '[]');
                if (!Array.isArray(list) || list.length === 0) return;
                console.log('flushPendingSends: found', list.length);
                const remaining = [];
                for (const item of list) {
                    try {
                        const ok = await (async () => {
                            try {
                                // try original content type first
                                let ok1 = false;
                                try {
                                    const res = await fetchWithTimeout(GAS_URL, {
                                        method: 'POST',
                                        headers: { 'Content-Type': GAS_CONTENT_TYPE },
                                        body: GAS_CONTENT_TYPE.includes('json') ? JSON.stringify(item.payload) : JSON.stringify(item.payload)
                                    }, 6000);
                                    const text = await res.text();
                                    try { JSON.parse(text); } catch(e) { /* ignore */ }
                                    console.log('Flushed pending item (first try)');
                                    ok1 = true;
                                } catch(e) { console.warn('flush first try failed', e); }
                                if (ok1) return true;
                                // try as text/plain
                                try {
                                    const res2 = await fetchWithTimeout(GAS_URL, {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                        body: JSON.stringify(item.payload)
                                    }, 6000);
                                    const text2 = await res2.text();
                                    try { JSON.parse(text2); } catch(e) { /* ignore */ }
                                    console.log('Flushed pending item (second try as text/plain)');
                                    return true;
                                } catch(e) { console.warn('flush second try failed', e); }
                                return false;
                            } catch(e) {
                                console.warn('Flush attempt inner failed', e && e.message ? e.message : e);
                                return false;
                            }
                        })();
                        if (!ok) remaining.push(item);
                    } catch(e) { remaining.push(item); }
                }
                localStorage.setItem('pending_sends', JSON.stringify(remaining));
                console.log('flushPendingSends: remaining', remaining.length);
            } catch(e) { console.error('flushPendingSends error', e); }
        }

        // 画面が読み込まれたら未送信キューを試す
        window.addEventListener('load', () => {
            setTimeout(() => flushPendingSends(), 2000);
        });

        // ページ離脱時に sendBeacon を試す（直前送信がある場合）
        window.addEventListener('beforeunload', () => {
            try {
                const list = JSON.parse(localStorage.getItem('pending_sends') || '[]');
                if (Array.isArray(list) && list.length > 0 && navigator.sendBeacon) {
                    // まとめて送る
                    try {
                        const blob = new Blob([JSON.stringify(list.map(i => i.payload))], { type: 'application/json' });
                        navigator.sendBeacon(GAS_URL, blob);
                    } catch(e) { /* ignore */ }
                }
            } catch(e) { /* ignore */ }
        });

        // 送信ログを表示する (新しいウィンドウ)
        function openSendHistoryWindow() {
            try {
                const list = JSON.parse(localStorage.getItem('send_history') || '[]');
                const w = window.open('', '_blank');
                if (!w) { alert('新しいウィンドウを開けませんでした。ポップアップブロックを確認してください。'); return; }
                w.document.title = '送信ログ';
                const pre = w.document.createElement('pre');
                pre.style.whiteSpace = 'pre-wrap';
                pre.textContent = JSON.stringify(list.slice(0,200), null, 2);
                w.document.body.appendChild(pre);
            } catch(e) { alert('送信ログを読み取れませんでした'); }
        }

        document.getElementById('debug-send-log').addEventListener('click', () => openSendHistoryWindow());
    </script>
</body>
