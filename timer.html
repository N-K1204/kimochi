<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panoramic Scenic Clock</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #a2d2ff;
            --bg-deep: #02040a;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-deep);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* --- 🌟 背景1：CSS星空（動画がダメでも真っ暗にならない） --- */
        #fallback-stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #111d31 0%, #02040a 100%);
            z-index: -4;
        }
        .star {
            position: absolute; background: white; border-radius: 50%;
            opacity: 0.3; animation: twinkle var(--d) infinite ease-in-out;
        }
        @keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.2); } }

        /* --- 📺 背景2：全画面動画枠 --- */
        #video-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -3; pointer-events: none; overflow: hidden;
            opacity: 0; transition: opacity 4s ease;
        }
        #video-container iframe {
            position: absolute; top: 50%; left: 50%;
            width: 100vw; height: 56.25vw;
            min-height: 100vh; min-width: 177.77vh;
            transform: translate(-50%, -50%);
            border: none;
        }

        .scenic-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, transparent 40%, transparent 100%);
            z-index: -2;
        }

        /* --- 🚪 全画面起動スイッチ --- */
        #start-gate {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-deep);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; cursor: pointer; transition: opacity 1.2s;
        }
        .gate-label {
            font-size: 12px; letter-spacing: 10px; opacity: 0.4;
            animation: pulse 2s infinite; color: var(--accent);
        }

        /* --- 💎 上部インフォメーション（image_13a6a5.png を完全再現） --- */
        .top-bar {
            position: fixed; top: 0; left: 0; width: 100%;
            padding: 30px 40px; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: flex-start;
            z-index: 100;
            opacity: 0; transition: opacity 2s;
        }

        .info-group { text-align: left; }
        .info-group.right { text-align: right; }
        .info-group.center { 
            position: absolute; left: 50%; transform: translateX(-50%); 
            text-align: center;
        }

        .label { font-size: 8px; opacity: 0.4; letter-spacing: 2px; margin-bottom: 5px; font-weight: 700; color: #fff; }
        .val { font-size: 15px; font-weight: 200; letter-spacing: 1px; }

        /* 小さく配置した時計 */
        .mini-clock {
            font-size: 36px; font-weight: 100;
            color: #d8eaff; text-shadow: 0 0 15px rgba(162, 210, 255, 0.4);
            letter-spacing: -1px; line-height: 1;
        }
        .ampm { font-size: 14px; opacity: 0.2; margin-left: 8px; font-weight: 200; }

        @keyframes pulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.6; } }
    </style>
</head>
<body>

    <div id="fallback-stars"></div>

    <div id="video-container"></div>
    <div class="scenic-overlay"></div>

    <div id="start-gate" onclick="activateScenic()">
        <div class="gate-label">TAP TO ENTER THE SCENERY</div>
    </div>

    <div class="top-bar" id="ui-overlay">
        <div class="info-group">
            <div class="label">TODAY</div>
            <div id="today-val" class="val">--/-- ---</div>
        </div>

        <div class="info-group center">
            <div class="label">CURRENT TIME</div>
            <div id="clock-display" class="mini-clock">00:00:00<span class="ampm">--</span></div>
        </div>

        <div class="info-group right">
            <div class="label">TOMORROW</div>
            <div id="tomorrow-val" class="val">--/-- ---</div>
        </div>
    </div>

    <script>
        const WEEKS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

        // 🌟 星空をあらかじめ作っておく
        function createStars() {
            const container = document.getElementById('fallback-stars');
            for(let i=0; i<80; i++) {
                const s = document.createElement('div');
                s.className = 'star';
                const size = Math.random() * 2 + 'px';
                s.style.width = size; s.style.height = size;
                s.style.top = Math.random() * 100 + '%';
                s.style.left = Math.random() * 100 + '%';
                s.style.setProperty('--d', Math.random() * 3 + 2 + 's');
                container.appendChild(s);
            }
        }
        createStars();

        function getVid() {
            const h = new Date().getHours();
            if (h >= 5 && h < 11) return 'AY5qcIq5u2g'; // 朝
            if (h >= 11 && h < 16) return '3xPkwNu2o8g'; // 昼
            if (h >= 16 && h < 19) return 'xykQaTJcrqA'; // 夕
            return 'r6HJhRvom7E'; // 夜
        }

        function activateScenic() {
            const vid = getVid();
            const container = document.getElementById('video-container');
            
            // 💡 直接 iframe を挿入（最も確実な方式）
            container.innerHTML = `<iframe src="https://www.youtube.com/embed/${vid}?autoplay=1&mute=1&loop=1&playlist=${vid}&controls=0&modestbranding=1&rel=0&iv_load_policy=3" allow="autoplay; encrypted-media"></iframe>`;

            document.getElementById('start-gate').style.opacity = '0';
            setTimeout(() => { 
                document.getElementById('start-gate').style.display = 'none';
                container.style.opacity = '1';
                document.getElementById('ui-overlay').style.opacity = '1';
            }, 1000);

            updateAll();
            setInterval(updateAll, 1000);
        }

        function updateAll() {
            const now = new Date();
            const fmt = (d) => `${d.getMonth() + 1}/${d.getDate()} ${WEEKS[d.getDay()]}`;
            document.getElementById('today-val').innerText = fmt(now);
            const tom = new Date(); tom.setDate(now.getDate() + 1);
            document.getElementById('tomorrow-val').innerText = fmt(tom);

            let h = now.getHours();
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            document.getElementById('clock-display').innerHTML = `${h}:${m}:${s}<span class="ampm">${ampm}</span>`;
        }
    </script>
</body>
</html>
