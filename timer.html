<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sleep Cocktail - Final Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --juice-top: rgba(255, 193, 7, 0.75);
            --juice-mid: rgba(255, 152, 0, 0.85);
            --juice-bottom: rgba(230, 81, 0, 0.90);
            --bg-center: #1a1a1a;
            --bg-edge: #050505;
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 60%, var(--bg-center) 0%, var(--bg-edge) 70%); color: white; font-family: 'Inter', sans-serif; overflow: hidden; touch-action: manipulation; }

        /* --- ヘッダーUI --- */
        .top-bar { 
            position: fixed; top: 0; left: 0; width: 100%; padding: 20px; box-sizing: border-box; 
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; z-index: 1000;
        }
        .header-left { text-align: left; }
        .header-right { text-align: right; }
        .label { font-size: 9px; opacity: 0.5; letter-spacing: 2px; font-weight: 600; text-transform: uppercase; margin-bottom: 2px; }
        .val { font-weight: 300; font-size: 14px; letter-spacing: 1px; }
        .main-clock { font-size: 32px; font-weight: 100; text-shadow: 0 0 20px rgba(255, 255, 255, 0.1); }

        /* --- サイドパネルUI（スマホ最適化） --- */
        .side-panel {
            position: absolute; top: 100px; left: 20px; width: 200px;
            display: flex; flex-direction: column; gap: 15px; z-index: 1001;
        }
        @media (max-width: 600px) {
            .side-panel { width: calc(100% - 40px); top: auto; bottom: 20px; left: 20px; flex-direction: row; }
            .panel-box { flex: 1; padding: 10px; }
            .stage { transform: translate(-50%, -60%) scale(0.85); }
        }

        .panel-box {
            background: rgba(20, 20, 20, 0.6); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }
        
        select { 
            width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); 
            color: white; font-family: 'Inter'; font-size: 12px; padding: 6px; border-radius: 6px; color-scheme: dark; margin-bottom: 10px;
        }

        .btn { width: 100%; padding: 10px 0; border-radius: 6px; border: none; font-family: 'Inter'; font-weight: 600; font-size: 11px; cursor: pointer; transition: 0.3s; background: linear-gradient(to bottom, #555, #333); color: white; border: 1px solid rgba(255,255,255,0.1); }

        /* --- ステージ演出 --- */
        .stage { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -45%); width: 240px; height: 440px; }
        .glass-wrapper { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 200px; height: 260px; transition: transform 0.6s ease, opacity 0.4s; }
        .glass-exit { transform: translateX(-150%) rotate(-10deg); opacity: 0; }
        .glass-enter { transform: translateX(150%) rotate(10deg); opacity: 0; }

        /* 🥤 ストロー（完全固定） */
        .straw {
            position: absolute; bottom: 15px; left: 65px; 
            width: 10px; height: 300px;
            background: linear-gradient(90deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.8) 20%, rgba(255,255,255,0.2) 80%, rgba(255,255,255,0.5) 100%);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 5px;
            transform: rotate(15deg); transform-origin: bottom center; z-index: 25;
        }

        .glass-back { position: absolute; top: -5px; left: 0; width: 100%; height: 20px; border-radius: 50%; border-top: 2px solid rgba(255,255,255,0.3); z-index: 10; }

        /* 🧊 氷 */
        .ice-cube {
            position: absolute; width: 24px; height: 24px;
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.4);
            border-radius: 6px; box-shadow: inset 2px 2px 8px rgba(255,255,255,0.5);
            backdrop-filter: blur(2px); z-index: 12; transition: bottom 0.2s ease-out;
        }

        .pour-mechanism { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 36px; height: 30px; background: #222; border-radius: 4px; border-bottom: 5px solid #0a0a0a; }
        .pour-stream { position: absolute; top: -150px; left: 50%; transform: translateX(-50%); width: 14px; height: 0; background: linear-gradient(90deg, var(--juice-bottom), var(--juice-top) 50%, var(--juice-bottom)); opacity: 0; transition: opacity 0.3s; z-index: 18; }
        .is-pouring .pour-stream { opacity: 1; }

        .liquid-mask { position: absolute; inset: 5px; border-radius: 10px 10px 80px 80px / 10px 10px 100px 100px; overflow: hidden; z-index: 20; }
        .liquid-fill { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: linear-gradient(to top, var(--juice-bottom) 0%, var(--juice-mid) 60%, var(--juice-top) 100%); }
        .glass-front { position: absolute; inset: 0; border-radius: 10px 10px 80px 80px / 10px 10px 100px 100px; border: 2px solid rgba(255,255,255,0.1); box-shadow: inset 15px 0 20px rgba(255,255,255,0.15), 0 -20px 30px rgba(0,0,0,0.8); background: linear-gradient(90deg, rgba(255,255,255,0.3) 0%, transparent 12%, transparent 88%, rgba(255,255,255,0.1) 100%); pointer-events: none; z-index: 50; }

        /* 🔊 音声ブリッジ（バリデーションエラー修正済） */
        #audio-bridge { position: fixed; top: -100px; left: -100px; width: 1px; height: 1px; visibility: hidden; }

        .bottom-ui { position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%); width: 280px; text-align: center; z-index: 1001; }
        @media (max-width: 600px) { .bottom-ui { bottom: 130px; } }
        .progress-wrapper { position: relative; width: 100%; height: 20px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
        .progress-bar { position: absolute; top: 0; left: 0; height: 100%; width: 0%; background: white; opacity: 0.8; }
        .progress-text { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; font-size: 9px; font-weight: 700; color: #000; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="header-left"><div class="label">TODAY</div><div class="val" id="today-val">--/-- ---</div></div>
        <div class="header-center"><div id="clock-display" class="main-clock">00:00:00</div></div>
        <div class="header-right"><div class="label">TOMORROW</div><div class="val" id="tomorrow-val">--/-- ---</div></div>
    </div>

    <div class="side-panel">
        <div class="panel-box">
            <select id="drink-select">
                <option value="orange">Orange</option>
                <option value="apple">Apple</option>
                <option value="cola">Cola (Soda ASMR)</option>
            </select>
            <button id="start-btn" class="btn" onclick="handleStart()">START POURING</button>
        </div>
    </div>

    <iframe id="audio-bridge" src="about:blank" title="Audio Source" allow="autoplay"></iframe>

    <div class="stage" id="stage">
        <div class="pour-mechanism"></div>
        <div class="glass-wrapper" id="glass-wrapper">
            <div class="glass-back"></div>
            <div id="ice-1" class="ice-cube" style="bottom:10px; left:50px;"></div>
            <div id="ice-2" class="ice-cube" style="bottom:12px; left:85px;"></div>
            <div id="ice-3" class="ice-cube" style="bottom:10px; left:120px;"></div>
            <div id="ice-4" class="ice-cube" style="bottom:35px; left:65px;"></div>
            <div id="ice-5" class="ice-cube" style="bottom:37px; left:105px;"></div>
            <div class="straw"></div>
            <div class="pour-stream" id="pour-stream"></div>
            <div class="liquid-mask"><div id="liquid-fill" class="liquid-fill"></div></div>
            <div class="glass-front"></div>
        </div>
    </div>

    <div class="bottom-ui">
        <div class="progress-wrapper">
            <div class="progress-bar" id="progress-bar"></div>
            <div class="progress-text"><span id="progress-text-val">0%</span> FILLED</div>
        </div>
    </div>

    <script>
        const WEEKS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
        const ASMR_VIDEO_ID = 'Q9Wj6sTETvE';
        let isSleepMode = false, isResetting = false, loopProgress = 0;

        const drinks = {
            orange: { top: 'rgba(255, 193, 7, 0.75)', mid: 'rgba(255, 152, 0, 0.85)', bottom: 'rgba(230, 81, 0, 0.90)' },
            apple: { top: 'rgba(240, 220, 100, 0.65)', mid: 'rgba(210, 180, 40, 0.75)', bottom: 'rgba(180, 140, 20, 0.85)' },
            cola: { top: 'rgba(120, 60, 20, 0.70)', mid: 'rgba(60, 20, 5, 0.85)', bottom: 'rgba(20, 0, 0, 0.95)' }
        };

        function setSound(play) {
            const bridge = document.getElementById('audio-bridge');
            if (play) {
                // 再生URLをセット（autoplay制限回避のため、ユーザーのタップ直後に発動させる）
                bridge.src = `https://www.youtube.com/embed/${ASMR_VIDEO_ID}?autoplay=1&start=5&controls=0&mute=0&loop=1&playlist=${ASMR_VIDEO_ID}`;
            } else {
                bridge.src = "about:blank";
            }
        }

        function handleStart() {
            isSleepMode = true;
            const selected = drinks[document.getElementById('drink-select').value];
            document.documentElement.style.setProperty('--juice-top', selected.top);
            document.documentElement.style.setProperty('--juice-mid', selected.mid);
            document.documentElement.style.setProperty('--juice-bottom', selected.bottom);
            document.getElementById('stage').classList.add('is-pouring');
            
            // タップの瞬間に音声を起動
            setSound(true);

            document.getElementById('start-btn').innerText = "RESET";
            document.getElementById('start-btn').onclick = () => location.reload();
        }

        function update() {
            const now = new Date();
            // 明日の日付計算
            const tomorrow = new Date(now);
            tomorrow.setDate(now.getDate() + 1);

            const fmt = (d) => `${d.getMonth() + 1}/${d.getDate()} ${WEEKS[d.getDay()]}`;
            document.getElementById('today-val').innerText = fmt(now);
            document.getElementById('tomorrow-val').innerText = fmt(tomorrow);

            document.getElementById('clock-display').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});

            if (isSleepMode && !isResetting) {
                loopProgress += 0.15; 
                if (loopProgress >= 100) { loopProgress = 100; triggerNextGlass(); }
                
                const liqPx = (loopProgress / 100) * 240;
                document.getElementById('liquid-fill').style.height = loopProgress + "%";
                document.getElementById('progress-bar').style.width = loopProgress + "%";
                document.getElementById('progress-text-val').innerText = Math.floor(loopProgress) + "%";
                document.getElementById('pour-stream').style.height = (405 - liqPx) + "px";

                // 🧊 氷の浮遊物理
                for(let i=1; i<=5; i++) {
                    const ice = document.getElementById(`ice-${i}`);
                    let initialBottom = i<=3 ? 10 : 35;
                    let floatPos = Math.max(initialBottom, liqPx - 15);
                    let maxB = 225 - (i*3); 
                    let wave = Math.sin(now.getTime() * 0.003 + i) * 3;
                    ice.style.bottom = Math.min(floatPos, maxB) + wave + "px";
                }
            }
        }

        async function triggerNextGlass() {
            isResetting = true;
            setSound(false);
            document.getElementById('stage').classList.remove('is-pouring');
            await new Promise(r => setTimeout(r, 1000));
            document.getElementById('glass-wrapper').classList.add('glass-exit');
            await new Promise(r => setTimeout(r, 600));
            loopProgress = 0; document.getElementById('liquid-fill').style.height = "0%";
            document.getElementById('glass-wrapper').classList.remove('glass-exit');
            document.getElementById('glass-wrapper').classList.add('glass-enter');
            await new Promise(r => setTimeout(r, 50));
            document.getElementById('glass-wrapper').classList.remove('glass-enter');
            await new Promise(r => setTimeout(r, 600));
            isResetting = false; 
            document.getElementById('stage').classList.add('is-pouring');
            setSound(true);
        }

        setInterval(update, 50);
    </script>
</body>
</html>
