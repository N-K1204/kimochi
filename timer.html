<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleep Cocktail - Absolute Physics Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --juice-top: rgba(255, 193, 7, 0.75);
            --juice-mid: rgba(255, 152, 0, 0.85);
            --juice-bottom: rgba(230, 81, 0, 0.90);
            --bg-center: #1a1a1a;
            --bg-edge: #050505;
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 60%, var(--bg-center) 0%, var(--bg-edge) 70%); color: white; font-family: 'Inter', sans-serif; overflow: hidden; }

        /* --- ヘッダーUI --- */
        .top-bar { 
            position: fixed; top: 0; left: 0; width: 100%; padding: 30px 40px; box-sizing: border-box; 
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; z-index: 1000;
        }
        .header-left { text-align: left; }
        .header-right { text-align: right; }
        .label { font-size: 11px; opacity: 0.5; letter-spacing: 2px; font-weight: 600; text-transform: uppercase; margin-bottom: 4px; }
        .val { font-weight: 300; font-size: 18px; letter-spacing: 1px; }
        .main-clock { font-size: 48px; font-weight: 100; text-shadow: 0 0 20px rgba(255, 255, 255, 0.1); letter-spacing: 2px; transition: text-shadow 0.5s; }
        .ampm { font-size: 14px; opacity: 0.5; margin-left: 5px; font-weight: 300; }

        /* --- サイドパネルUI --- */
        .side-panel {
            position: absolute; top: 120px; left: 40px; width: 240px;
            display: flex; flex-direction: column; gap: 20px; z-index: 1001;
        }
        .panel-box {
            background: rgba(20, 20, 20, 0.6); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px); transition: border-color 0.5s;
        }
        .input-row { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 15px; gap: 6px; width: 100%; }
        .input-row label { font-size: 10px; font-weight: 600; letter-spacing: 1px; opacity: 0.8; }
        
        input[type="time"], select { 
            width: 100%; box-sizing: border-box; 
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); 
            color: white; font-family: 'Inter'; font-size: 14px; outline: none; 
            padding: 8px 12px; border-radius: 6px; cursor: pointer; transition: 0.3s; 
            color-scheme: dark; 
        }
        input[type="time"]:focus, select:focus { border-color: rgba(255,255,255,0.8); }

        .btn { width: 100%; padding: 12px 0; border-radius: 6px; border: none; font-family: 'Inter'; font-weight: 600; font-size: 12px; letter-spacing: 1px; cursor: pointer; transition: 0.3s; }
        .btn-theme { background: linear-gradient(to bottom, #555, #333); color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); }
        .btn-theme:active { transform: scale(0.98); }
        .btn-red { background: transparent; color: #ff5252; border: 1px dashed #ff5252; }

        /* --- リアル3Dステージ --- */
        .stage {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -45%);
            width: 240px; height: 440px; 
        }

        .pour-mechanism {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 36px; height: 30px; 
            background: linear-gradient(to right, #222, #666, #111);
            border-radius: 4px; z-index: 100;
            border-bottom: 5px solid #0a0a0a;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }

        .glass-wrapper {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 200px; height: 260px;
        }

        .glass-back {
            position: absolute; top: -5px; left: 0; width: 100%; height: 20px;
            border-radius: 50%; border-top: 2px solid rgba(255,255,255,0.3);
            z-index: 10;
        }

        /* 🛡️ ストロー専用のクリッピングマスク */
        .straw-mask {
            position: absolute; bottom: 5px; left: 5px; right: 5px; height: 500px;
            border-radius: 0 0 75px 75px / 0 0 95px 95px;
            overflow: hidden; z-index: 15; pointer-events: none;
        }

        .straw {
            position: absolute; bottom: -5px; left: 50px; 
            width: 12px; height: 350px;
            background: linear-gradient(90deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.9) 20%, rgba(255,255,255,0.4) 80%, rgba(255,255,255,0.7) 100%);
            border: 1px solid rgba(255,255,255,0.3); border-radius: 6px;
            transform: rotate(15deg); transform-origin: bottom center;
            box-shadow: 2px 5px 10px rgba(0,0,0,0.2);
        }

        .pour-stream {
            position: absolute; top: -150px; left: 50%; transform: translateX(-50%);
            width: 14px; height: 0; 
            background: linear-gradient(90deg, var(--juice-bottom), var(--juice-top) 50%, var(--juice-bottom)); 
            opacity: 0; transition: opacity 0.3s; z-index: 18;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }
        .is-pouring .pour-stream { opacity: 1; animation: stream-flow 0.1s infinite; }
        @keyframes stream-flow { 0% { width: 13px; transform: translateX(-51%); } 100% { width: 15px; transform: translateX(-49%); } }

        /* 🛡️ 氷と液体を封印するマスク（はみ出し絶対防止） */
        .liquid-mask {
            position: absolute; inset: 5px; 
            border-radius: 5px 5px 75px 75px / 5px 5px 95px 95px;
            overflow: hidden; z-index: 20;
        }

        /* 🧊 氷（最初はグラスの完全に底に配置） */
        .ice-cube {
            position: absolute; width: 45px; height: 45px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 12px;
            box-shadow: inset 2px 2px 10px rgba(255,255,255,0.5), inset -2px -2px 10px rgba(0,0,0,0.1);
            backdrop-filter: blur(3px);
            z-index: 1; /* 液体より奥に配置して透けさせる */
            transition: bottom 0.5s ease-out, transform 1s ease-in-out; 
        }
        /* 初期位置を 0px に設定して底に密着させる */
        #ice-1 { bottom: 0px; left: 35px; transform: rotate(10deg); }
        #ice-2 { bottom: 2px; right: 35px; transform: rotate(-15deg); }

        /* 液体本体 */
        .liquid-fill {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 0%;
            background: linear-gradient(to top, var(--juice-bottom) 0%, var(--juice-mid) 60%, var(--juice-top) 100%);
            transition: height 1s linear;
            z-index: 2; /* 氷より手前 */
        }

        .bubble-clip {
            position: absolute; inset: 0; overflow: hidden; z-index: 5;
        }

        .pulp {
            position: absolute; 
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%; 
            box-shadow: 0 0 2px rgba(255,255,255,0.6);
            animation: rise var(--duration) ease-in forwards; 
        }
        @keyframes rise { 
            0% { transform: translate(0, 0) scale(0.5); opacity: 0; } 
            10% { opacity: 1; } 
            80% { opacity: 1; }
            100% { transform: translate(var(--sway), -350px) scale(1.2); opacity: 0; } 
        }

        .splash {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            width: 50px; height: 30px;
            background-color: var(--juice-top);
            -webkit-mask: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg"><path d="M50 0 Q60 30 100 40 Q50 50 0 40 Q40 30 50 0 Z"/></svg>') no-repeat center/contain;
            mask: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg"><path d="M50 0 Q60 30 100 40 Q50 50 0 40 Q40 30 50 0 Z"/></svg>') no-repeat center/contain;
            opacity: 0; transition: opacity 0.3s, transform 0.5s; z-index: 10;
        }
        .is-pouring .splash { opacity: 0.8; animation: splash-jump 0.15s infinite alternate; }
        @keyframes splash-jump { from { transform: translateX(-50%) scale(0.9) translateY(2px); } to { transform: translateX(-50%) scale(1.1) translateY(-2px); } }

        .foam {
            position: absolute; top: -5px; left: -10%; width: 120%; height: 20px;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.7) 0%, var(--juice-top) 70%, transparent 100%); 
            opacity: 0; transition: opacity 0.5s; border-radius: 50%; z-index: 8;
        }
        .is-pouring .foam, .is-full .foam { opacity: 1; }

        .glass-front {
            position: absolute; inset: 0;
            border-radius: 10px 10px 80px 80px / 10px 10px 100px 100px;
            border: 2px solid rgba(255,255,255,0.1);
            box-shadow: inset 15px 0 20px rgba(255,255,255,0.15), inset -15px 0 20px rgba(255,255,255,0.1), inset 0 -20px 30px rgba(0,0,0,0.8), 0 20px 40px rgba(0,0,0,0.6);
            background: linear-gradient(90deg, rgba(255,255,255,0.4) 0%, transparent 12%, transparent 88%, rgba(255,255,255,0.15) 100%);
            pointer-events: none; z-index: 50;
        }
        .glass-front::after {
            content: ''; position: absolute; top: 10%; left: 8%; width: 6%; height: 75%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.6), transparent);
            border-radius: 50%; filter: blur(2px);
        }

        /* --- ボトムUI --- */
        .bottom-ui {
            position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%);
            width: 320px; text-align: center; z-index: 1001;
        }
        .status-title { font-size: 14px; font-weight: 600; letter-spacing: 1px; margin-bottom: 10px; }
        .progress-wrapper {
            position: relative; width: 100%; height: 24px;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px; overflow: hidden; margin-bottom: 8px;
        }
        .progress-bar {
            position: absolute; top: 0; left: 0; height: 100%; width: 0%;
            background: linear-gradient(90deg, rgba(255,255,255,0.5), rgba(255,255,255,0.9));
            border-radius: 12px; transition: width 1s linear;
        }
        .progress-text { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; font-size: 10px; font-weight: 700; color: #000; text-shadow: 0 1px 2px rgba(255,255,255,0.5); }
        .status-sub { font-size: 10px; opacity: 0.5; font-weight: 300; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="header-left"><div class="label">TODAY</div><div class="val" id="today-val">--/-- ---</div></div>
        <div class="header-center"><div id="clock-display" class="main-clock">0:00:00<span class="ampm">AM</span></div></div>
        <div class="header-right"><div class="label">TOMORROW</div><div class="val" id="tomorrow-val">--/-- ---</div></div>
    </div>

    <div class="side-panel">
        <div class="panel-box" id="theme-box">
            <div class="input-row">
                <label>SELECT DRINK</label>
                <select id="drink-select">
                    <option value="orange" selected>Orange Juice</option>
                    <option value="apple">Apple Juice</option>
                    <option value="greentea">Green Tea</option>
                    <option value="cola">Cola (Soda)</option>
                    <option value="calpis">Calpis Soda</option>
                    <option value="melonsoda">Melon Soda</option>
                    <option value="bluehawaii">Blue Hawaii (Soda)</option>
                    <option value="grape">Grape Soda</option>
                </select>
            </div>
            <div class="input-row"><label>WAKE UP TIME</label><input type="time" id="alarm-time" value="07:00"></div>
            <button id="start-btn" class="btn btn-theme" onclick="handleStart()">START POURING</button>
        </div>
        <div class="panel-box">
            <button id="stop-btn" class="btn btn-red" onclick="handleStop()" style="display:none;">STOP ALARM</button>
        </div>
    </div>

    <div class="stage" id="stage">
        <div class="pour-mechanism"></div>
        <div class="glass-wrapper" id="glass-wrapper">
            <div class="glass-back"></div>
            
            <div class="straw-mask">
                <div class="straw"></div>
            </div>
            
            <div class="pour-stream" id="pour-stream"></div>
            
            <div class="liquid-mask">
                <div id="ice-1" class="ice-cube"></div>
                <div id="ice-2" class="ice-cube"></div>
                
                <div id="liquid-fill" class="liquid-fill">
                    <div class="bubble-clip">
                        <div id="pulp-container"></div>
                    </div>
                    <div class="splash" id="splash"></div>
                    <div class="foam"></div>
                </div>
            </div>
            
            <div class="glass-front"></div>
        </div>
    </div>

    <div class="bottom-ui">
        <div class="status-title" id="status-title">SET ALARM</div>
        <div class="progress-wrapper">
            <div class="progress-bar" id="progress-bar"></div>
            <div class="progress-text">VOLUME <span id="progress-text-val">0%</span></div>
        </div>
        <div class="status-sub" id="status-sub">Waiting for input...</div>
    </div>

    <script>
        const WEEKS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
        let isSleepMode = false, isAlarmRinging = false;
        let targetTimeMs = null, sleepStartTimeMs = null, pulpInterval = null, wakeLock = null;
        let currentLiquidPx = 0; 

        const drinks = {
            orange: { top: 'rgba(255, 193, 7, 0.75)', mid: 'rgba(255, 152, 0, 0.85)', bottom: 'rgba(230, 81, 0, 0.90)', carbonated: false },
            apple: { top: 'rgba(240, 220, 100, 0.65)', mid: 'rgba(210, 180, 40, 0.75)', bottom: 'rgba(180, 140, 20, 0.85)', carbonated: false },
            greentea: { top: 'rgba(180, 200, 80, 0.60)', mid: 'rgba(140, 170, 40, 0.70)', bottom: 'rgba(100, 130, 20, 0.80)', carbonated: false },
            cola: { top: 'rgba(120, 60, 20, 0.70)', mid: 'rgba(60, 20, 5, 0.85)', bottom: 'rgba(20, 0, 0, 0.95)', carbonated: true },
            calpis: { top: 'rgba(255, 255, 255, 0.60)', mid: 'rgba(245, 245, 245, 0.75)', bottom: 'rgba(230, 230, 230, 0.85)', carbonated: true },
            melonsoda: { top: 'rgba(100, 255, 150, 0.75)', mid: 'rgba(40, 210, 90, 0.85)', bottom: 'rgba(10, 170, 50, 0.90)', carbonated: true },
            bluehawaii: { top: 'rgba(120, 210, 255, 0.75)', mid: 'rgba(60, 160, 255, 0.85)', bottom: 'rgba(20, 100, 220, 0.90)', carbonated: true },
            grape: { top: 'rgba(180, 100, 255, 0.75)', mid: 'rgba(120, 40, 200, 0.85)', bottom: 'rgba(80, 10, 150, 0.90)', carbonated: true }
        };

        let currentDrinkIsCarbonated = false;

        async function reqWakeLock() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {} }
        
        function createPulp() {
            if (!currentDrinkIsCarbonated) return;
            const container = document.getElementById('pulp-container');
            const count = Math.floor(Math.random() * 3) + 2; 
            for(let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'pulp';
                const size = Math.random() * 3 + 1 + 'px'; 
                const duration = Math.random() * 1.5 + 0.8 + 's'; 
                const sway = (Math.random() - 0.5) * 30 + 'px'; 
                p.style.cssText = `width: ${size}; height: ${size}; left: ${Math.random() * 100}%; bottom: -5px; --duration: ${duration}; --sway: ${sway};`;
                container.appendChild(p);
                setTimeout(() => p.remove(), 2500);
            }
        }

        let ice1Rot = 10, ice2Rot = -15;

        function update() {
            const now = new Date();
            const fmt = (d) => `${d.getMonth() + 1}/${d.getDate()} ${WEEKS[d.getDay()]}`;
            document.getElementById('today-val').innerText = fmt(now);
            const tom = new Date(now); tom.setDate(now.getDate() + 1);
            document.getElementById('tomorrow-val').innerText = fmt(tom);

            let h = now.getHours(), m = String(now.getMinutes()).padStart(2, '0'), s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock-display').innerHTML = `${h % 12 || 12}:${m}:${s}<span class="ampm">${h >= 12 ? 'PM' : 'AM'}</span>`;

            if (isSleepMode && targetTimeMs) {
                const total = targetTimeMs - sleepStartTimeMs;
                const elapsed = now.getTime() - sleepStartTimeMs;
                let progress = total > 0 ? Math.min((elapsed / total) * 100, 100) : 100;
                
                const glassInnerH = 250; 
                const liqPx = (progress / 100) * glassInnerH;
                currentLiquidPx = liqPx; 

                document.getElementById('liquid-fill').style.height = progress + "%";
                document.getElementById('progress-bar').style.width = progress + "%";
                document.getElementById('progress-text-val').innerText = Math.floor(progress) + "%";

                const stream = document.getElementById('pour-stream');
                const splash = document.getElementById('splash');

                let turbulence = (currentLiquidPx / glassInnerH);
                if (progress < 100) turbulence = Math.max(turbulence, 0.4);

                if (progress >= 100) {
                    stream.style.opacity = "0";
                    splash.style.transform = "translateX(-50%) scale(0)";
                    splash.style.opacity = "0";
                    document.getElementById('stage').classList.remove('is-pouring');
                    document.getElementById('stage').classList.add('is-full');
                    if (!isAlarmRinging) triggerAlarm();
                } else {
                    stream.style.height = (405 - liqPx) + "px"; 
                    if (progress > 90) {
                        let f = (100 - progress) / 10;
                        splash.style.transform = `translateX(-50%) scale(${f})`;
                        splash.style.opacity = f;
                    } else {
                        splash.style.transform = `translateX(-50%) scale(1)`;
                    }
                    let minsLeft = Math.ceil((targetTimeMs - now.getTime()) / 60000);
                    document.getElementById('status-sub').innerText = `POURING IN PROGRESS (${minsLeft} min left)`;
                }

                // 🧊 氷の物理演算
                const ice1 = document.getElementById('ice-1');
                const ice2 = document.getElementById('ice-2');

                if (liqPx < 25) {
                    // 🚩 注がれる前は、グラスの完全に底（0px）に配置
                    ice1.style.bottom = "0px";
                    ice1.style.transform = `translateX(0px) rotate(10deg)`;
                    ice2.style.bottom = "2px";
                    ice2.style.transform = `translateX(0px) rotate(-15deg)`;
                } else {
                    // 浮力による揺らぎ
                    let waveY1 = Math.sin(now.getTime() * 0.003) * 8 * turbulence;
                    let waveY2 = Math.cos(now.getTime() * 0.004) * 6 * turbulence;
                    let driftX1 = Math.sin(now.getTime() * 0.002) * 15 * turbulence;
                    let driftX2 = Math.sin(now.getTime() * 0.0025 + 1) * 12 * turbulence;

                    ice1Rot += (Math.random() - 0.5) * 4 * turbulence;
                    ice2Rot += (Math.random() - 0.5) * 4 * turbulence;
                    ice1Rot = Math.min(Math.max(ice1Rot, -5), 25);
                    ice2Rot = Math.min(Math.max(ice2Rot, -30), 0);

                    // 水面を超えないよう上限を設定
                    let b1 = Math.min(Math.max(0, liqPx - 35), glassInnerH - 50); 
                    let b2 = Math.min(Math.max(2, liqPx - 45), glassInnerH - 60);

                    ice1.style.bottom = (b1 + waveY1) + "px";
                    ice1.style.transform = `translateX(${driftX1}px) rotate(${ice1Rot}deg)`;
                    
                    ice2.style.bottom = (b2 + waveY2) + "px";
                    ice2.style.transform = `translateX(${driftX2}px) rotate(${ice2Rot}deg)`;
                }
            }
        }

        function triggerAlarm() {
            isAlarmRinging = true;
            document.getElementById('status-title').innerText = "READY TO DRINK";
            document.getElementById('status-sub').innerText = "DRINK COMPLETE - ALARM VIBRATING";
            document.getElementById('stop-btn').style.display = "block";
            document.getElementById('start-btn').style.display = "none";
            document.getElementById('clock-display').style.textShadow = "0 0 30px rgba(255, 255, 255, 0.8)";
            if (navigator.vibrate) navigator.vibrate([1000, 500, 1000, 500, 1000, 500, 1000]);
        }

        function updateThemeColor(color) {
            const btn = document.getElementById('start-btn');
            const panel = document.getElementById('theme-box');
            btn.style.background = `linear-gradient(to bottom, ${color.mid}, ${color.bottom})`;
            btn.style.boxShadow = `0 4px 15px ${color.bottom}`;
            panel.style.borderColor = color.mid;
        }

        document.getElementById('drink-select').addEventListener('change', function() {
            const selected = drinks[this.value];
            if(selected) {
                const root = document.documentElement;
                root.style.setProperty('--juice-top', selected.top);
                root.style.setProperty('--juice-mid', selected.mid);
                root.style.setProperty('--juice-bottom', selected.bottom);
                updateThemeColor(selected);
            }
        });

        function handleStart() {
            const timeInput = document.getElementById('alarm-time');
            const [ah, am] = timeInput.value.split(':').map(Number);
            let alarmDate = new Date();
            alarmDate.setHours(ah, am, 0, 0);
            if (alarmDate <= new Date()) alarmDate.setDate(alarmDate.getDate() + 1);
            
            targetTimeMs = alarmDate.getTime();
            sleepStartTimeMs = new Date().getTime();
            isSleepMode = true;

            const drinkSelect = document.getElementById('drink-select');
            const selected = drinks[drinkSelect.value];
            if (selected) {
                const root = document.documentElement;
                root.style.setProperty('--juice-top', selected.top);
                root.style.setProperty('--juice-mid', selected.mid);
                root.style.setProperty('--juice-bottom', selected.bottom);
                currentDrinkIsCarbonated = selected.carbonated;
                updateThemeColor(selected);
            }
            drinkSelect.disabled = true; 

            document.getElementById('stage').classList.add('is-pouring');
            timeInput.disabled = true;
            
            const btn = document.getElementById('start-btn');
            btn.innerText = "CANCEL POURING";
            btn.setAttribute('onclick', 'location.reload()');
            
            document.getElementById('status-title').innerText = "PREPARING DRINK";
            
            reqWakeLock();
            pulpInterval = setInterval(createPulp, 100); 
        }

        function handleStop() { location.reload(); }

        updateThemeColor(drinks['orange']);
        setInterval(update, 1000); update();
    </script>
</body>
</html>
