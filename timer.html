<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nogizaka46 MV Clock - Seek Bar Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #7d4ba7; --bg-deep: #000; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: var(--bg-deep); color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        #video-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: #000; }
        #player { width: 100%; height: 100%; }
        #start-gate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-deep); display: flex; justify-content: center; align-items: center; z-index: 2000; cursor: pointer; }
        
        .top-bar { 
            position: fixed; top: 0; left: 0; width: 100%; padding: 30px 40px; box-sizing: border-box; 
            z-index: 1000; visibility: hidden; opacity: 0; transition: opacity 0.5s; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%); 
            display: grid; grid-template-columns: 1fr auto 1fr; grid-template-rows: auto auto; align-items: baseline; pointer-events: none; 
        }

        .label { font-size: 9px; opacity: 0.6; letter-spacing: 2.5px; font-weight: 700; text-transform: uppercase; margin-bottom: 5px; }
        .val { font-weight: 400; font-size: 15px; text-shadow: 1px 1px 4px rgba(0,0,0,0.8); }
        .mini-clock { font-size: 32px; font-weight: 200; color: #fff; text-shadow: 0 0 10px rgba(125, 75, 167, 0.8); line-height: 1; }

        .volume-ctrl-overlay { 
            position: absolute; top: 95px; right: 40px; 
            display: flex; flex-direction: column; align-items: flex-end; gap: 12px; 
            pointer-events: auto;
        }

        .slider-group { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
        input[type=range] { -webkit-appearance: none; background: rgba(255,255,255,0.2); height: 2px; outline: none; cursor: pointer; border-radius: 2px; }
        
        #volume-slider { width: 180px; }
        #volume-slider::-webkit-slider-thumb { -webkit-appearance: none; background: var(--accent); width: 16px; height: 16px; border-radius: 4px; }
        
        #master-ceiling { width: 120px; opacity: 0.8; }
        #master-ceiling::-webkit-slider-thumb { -webkit-appearance: none; background: #fff; width: 12px; height: 12px; border-radius: 50%; }

        /* 🆕 カスタム再生バーのスタイル */
        .seek-bar-container {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 30px;
            z-index: 1001; display: flex; align-items: center; padding: 0 20px;
            box-sizing: border-box; background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 100%);
            opacity: 0; transition: opacity 0.5s;
        }
        body:hover .seek-bar-container { opacity: 1; }
        #seek-slider { width: 100%; height: 4px; background: rgba(255,255,255,0.1); }
        #seek-slider::-webkit-slider-thumb { -webkit-appearance: none; background: var(--accent); width: 4px; height: 20px; border-radius: 2px; box-shadow: 0 0 10px var(--accent); }

        .btn-ui { background: rgba(125, 75, 167, 0.3); border: 1px solid var(--accent); color: white; font-size: 10px; padding: 4px 12px; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        body:hover .top-bar { opacity: 1; visibility: visible; }
        #loading-info { position: fixed; bottom: 40px; left: 20px; font-size: 10px; color: var(--accent); z-index: 1001; opacity: 0; }
    </style>
</head>
<body>

    <div id="video-container"><div id="player"></div></div>
    <div id="loading-info">再生可能な動画を探しています...</div>

    <div id="start-gate" onclick="initApp()">
        <div style="text-align: center;">
            <div style="font-size: 10px; letter-spacing: 5px; color: var(--accent); margin-bottom: 15px;">NOGIZAKA46 MV COLLECTION</div>
            <div style="font-size: 12px; color: white; opacity: 0.8;">TAP TO ENTER</div>
        </div>
    </div>

    <div class="top-bar" id="ui-overlay">
        <div style="grid-area: 1/1" class="label">TODAY</div>
        <div style="grid-area: 1/2" class="label">CURRENT TIME</div>
        <div style="grid-area: 1/3; text-align: right;" class="label">TOMORROW</div>

        <div style="grid-area: 2/1" id="today-val" class="val">--/-- ---</div>
        <div style="grid-area: 2/2" id="clock-display" class="mini-clock">0:00:00</div>
        <div style="grid-area: 2/3; text-align: right;" id="tomorrow-val" class="val">--/-- ---</div>

        <div class="volume-ctrl-overlay">
            <div class="slider-group">
                <div class="label" id="ceiling-label" style="margin-bottom:0; font-size:7px; opacity: 0.5;">LIMIT CEILING: 20%</div>
                <input type="range" id="master-ceiling" min="0" max="100" step="1" value="20" oninput="applyDualVolume()">
            </div>
            <div class="slider-group">
                <div class="label" id="vol-label" style="margin-bottom:0; font-size:7px;">MAIN VOLUME: 50%</div>
                <input type="range" id="volume-slider" min="0" max="100" step="1" value="50" oninput="applyDualVolume()">
            </div>
        </div>
    </div>

    <div class="seek-bar-container">
        <input type="range" id="seek-slider" min="0" max="100" step="0.1" value="0" oninput="manualSeek(this.value)">
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const WEEKS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
        let mvPlayer, skipMonitor;
        let nativeVisible = false;
        let volUpdateTimer = null;
        let isUserSeeking = false; // シーク操作中フラグ

        function initApp() {
            createPlayer(0); 
            document.getElementById('start-gate').style.opacity = '0';
            setTimeout(() => { document.getElementById('start-gate').style.display = 'none'; document.getElementById('ui-overlay').style.visibility = 'visible'; document.getElementById('ui-overlay').style.opacity = '1'; }, 300);
            update(); setInterval(update, 1000);
            
            // 🆕 再生バーの定期更新（0.5秒おき）
            setInterval(updateProgressBar, 500);
        }

        function createPlayer(controlsValue) {
            const playlistId = 'PLDUMgL1jIEfMcaJcz082WS8TxcTlexJKz';
            if (mvPlayer) mvPlayer.destroy();
            mvPlayer = new YT.Player('player', {
                height: '100%', width: '100%',
                playerVars: { 'listType': 'playlist', 'list': playlistId, 'autoplay': 1, 'loop': 1, 'controls': controlsValue, 'modestbranding': 1, 'rel': 0, 'showinfo': 0, 'vq': 'hd1080', 'playsinline': 1 },
                events: {
                    'onReady': (event) => {
                        event.target.mute(); event.target.playVideo();
                        if (event.target.setPlaybackRate) event.target.setPlaybackRate(1);
                        setTimeout(() => { event.target.unMute(); applyDualVolume(); event.target.setShuffle(true); }, 800);
                        startAggressiveMonitor();
                    },
                    'onStateChange': (event) => {
                        const btn = document.getElementById('play-pause-btn');
                        if (event.data === YT.PlayerState.PLAYING) { btn.innerText = "PAUSE ⏸"; document.getElementById('loading-info').style.opacity = '0'; }
                        else if (event.data === YT.PlayerState.PAUSED) btn.innerText = "PLAY ▶";
                    },
                    'onError': () => nextMV()
                }
            });
        }

        // 🆕 再生バーを動画に合わせて動かす
        function updateProgressBar() {
            if (mvPlayer && mvPlayer.getCurrentTime && !isUserSeeking) {
                const duration = mvPlayer.getDuration();
                if (duration > 0) {
                    const current = mvPlayer.getCurrentTime();
                    document.getElementById('seek-slider').value = (current / duration) * 100;
                }
            }
        }

        // 🆕 再生バーを自分で動かした時の処理
        function manualSeek(val) {
            isUserSeeking = true;
            if (mvPlayer && mvPlayer.seekTo) {
                const duration = mvPlayer.getDuration();
                const targetTime = (val / 100) * duration;
                mvPlayer.seekTo(targetTime, true);
            }
            // 操作が終わって少ししたら自動更新を再開
            setTimeout(() => { isUserSeeking = false; }, 1000);
        }

        function startAggressiveMonitor() {
            if (skipMonitor) clearInterval(skipMonitor);
            let stuckCounter = 0;
            skipMonitor = setInterval(() => {
                if (!mvPlayer || !mvPlayer.getPlayerState) return;
                const state = mvPlayer.getPlayerState();
                if (state === -1 || state === 3 || state === 5) {
                    stuckCounter++;
                    if (stuckCounter >= 4) { document.getElementById('loading-info').style.opacity = '1'; nextMV(); stuckCounter = 0; }
                } else if (state === 1) stuckCounter = 0;
            }, 1000);
        }

        function applyDualVolume() {
            const mainVal = parseInt(document.getElementById('volume-slider').value);
            const ceilingVal = parseInt(document.getElementById('master-ceiling').value);
            document.getElementById('ceiling-label').innerText = `LIMIT CEILING: ${ceilingVal}%`;
            document.getElementById('vol-label').innerText = `MAIN VOLUME: ${mainVal}%`;

            if (volUpdateTimer) clearTimeout(volUpdateTimer);
            volUpdateTimer = setTimeout(() => {
                if (mvPlayer && mvPlayer.setVolume) {
                    const finalVol = (mainVal / 100) * ceilingVal;
                    mvPlayer.setVolume(finalVol); 
                    if (finalVol > 0 && mvPlayer.isMuted()) mvPlayer.unMute();
                }
            }, 50);
        }

        function toggleNativeControls() { nativeVisible = !nativeVisible; createPlayer(nativeVisible ? 1 : 0); }
        function nextMV() { if (mvPlayer && mvPlayer.nextVideo) { mvPlayer.nextVideo(); setTimeout(() => mvPlayer.playVideo(), 500); } }
        function togglePlay() { if (!mvPlayer) return; const state = mvPlayer.getPlayerState(); state === YT.PlayerState.PLAYING ? mvPlayer.pauseVideo() : mvPlayer.playVideo(); }
        
        function update() {
            const now = new Date(); const fmt = (d) => `${d.getMonth() + 1}/${d.getDate()} ${WEEKS[d.getDay()]}`;
            document.getElementById('today-val').innerText = fmt(now);
            const tom = new Date(now); tom.setDate(now.getDate() + 1);
            document.getElementById('tomorrow-val').innerText = fmt(tom);
            let h = now.getHours(), m = String(now.getMinutes()).padStart(2, '0'), s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock-display').innerHTML = `${h % 12 || 12}:${m}:${s}<span style="font-size:10px; opacity:0.5; margin-left:8px;">${h >= 12 ? 'PM' : 'AM'}</span>`;
        }
    </script>
</body>
</html>
