<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nogizaka46 MV Clock - Volume Fixed</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #7d4ba7; --bg-deep: #000; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: var(--bg-deep); color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        #video-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #player { width: 100%; height: 100%; }
        #start-gate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-deep); display: flex; justify-content: center; align-items: center; z-index: 2000; cursor: pointer; transition: opacity 1s; }
        
        .top-bar { 
            position: fixed; top: 0; left: 0; width: 100%; padding: 30px 40px; box-sizing: border-box; 
            z-index: 1000; visibility: hidden; opacity: 0; transition: opacity 0.5s; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%); 
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            grid-template-rows: auto auto;
            align-items: baseline;
            pointer-events: none; 
        }

        .item-today-label    { grid-area: 1 / 1; text-align: left; }
        .item-today-val      { grid-area: 2 / 1; text-align: left; }
        .item-center-label   { grid-area: 1 / 2; text-align: center; }
        .item-center-clock   { grid-area: 2 / 2; text-align: center; }
        .item-tomorrow-label { grid-area: 1 / 3; text-align: right; }
        .item-tomorrow-val   { grid-area: 2 / 3; text-align: right; }

        .label { font-size: 9px; opacity: 0.6; letter-spacing: 2.5px; font-weight: 700; text-transform: uppercase; margin-bottom: 5px; }
        .val { font-weight: 400; font-size: 15px; text-shadow: 1px 1px 4px rgba(0,0,0,0.8); }
        .date-part, .week-part { font-size: 15px; font-weight: 400; }
        .week-part { margin-left: 8px; }
        .mini-clock { font-size: 32px; font-weight: 200; color: #fff; text-shadow: 0 0 10px rgba(125, 75, 167, 0.8); line-height: 1; }

        .volume-ctrl-overlay { 
            position: absolute; top: 95px; right: 40px; 
            display: flex; flex-direction: column; align-items: flex-end; gap: 8px; 
            pointer-events: auto;
        }

        input[type=range] { -webkit-appearance: none; background: rgba(255,255,255,0.2); height: 2px; width: 140px; outline: none; cursor: pointer; border-radius: 2px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; background: var(--accent); width: 14px; height: 14px; border-radius: 50%; }
        
        .btn-ui { background: rgba(125, 75, 167, 0.3); border: 1px solid var(--accent); color: white; font-size: 10px; padding: 4px 10px; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        .btn-ui:hover { background: rgba(125, 75, 167, 0.6); }

        body:hover .top-bar { opacity: 1; visibility: visible; }
    </style>
</head>
<body>

    <div id="video-container"><div id="player"></div></div>

    <div id="start-gate" onclick="initApp()">
        <div style="text-align: center;">
            <div style="font-size: 10px; letter-spacing: 5px; color: var(--accent); margin-bottom: 15px;">乃木坂46 MV COLLECTION</div>
            <div style="font-size: 12px; color: white; opacity: 0.8;">TAP TO ENTER</div>
        </div>
    </div>

    <div class="top-bar" id="ui-overlay">
        <div class="label item-today-label">TODAY</div>
        <div class="label item-center-label">CURRENT TIME</div>
        <div class="label item-tomorrow-label">TOMORROW</div>

        <div id="today-val" class="val item-today-val">
            <span class="date-part">--/--</span><span class="week-part">---</span>
        </div>
        
        <div id="clock-display" class="mini-clock item-center-clock">0:00:00</div>
        
        <div id="tomorrow-val" class="val item-tomorrow-val">
            <span class="date-part">--/--</span><span class="week-part">---</span>
        </div>

        <div class="volume-ctrl-overlay">
            <div class="label" style="margin-bottom:0; font-size:7px;">ULTRA LOW VOLUME</div>
            <input type="range" id="volume-slider" min="0" max="100" step="0.01" value="30" oninput="changeVolume(this.value)">
            <div style="display:flex; gap:5px;">
                <button id="play-pause-btn" class="btn-ui" onclick="togglePlay()">PAUSE ⏸</button>
                <button class="btn-ui" onclick="nextMV()">NEXT ⏭</button>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const WEEKS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
        let mvPlayer;

        function initApp() {
            const playlistId = 'PLDUMgL1jIEfMcaJcz082WS8TxcTlexJKz';
            mvPlayer = new YT.Player('player', {
                height: '100%', width: '100%',
                playerVars: { 
                    'listType': 'playlist', 'list': playlistId, 
                    'autoplay': 1, 'loop': 1, 'controls': 1, 
                    'modestbranding': 1, 'rel': 0, 'showinfo': 0,
                    'vq': 'hd1080' 
                },
                events: {
                    'onReady': (event) => {
                        event.target.setVolume(1);
                        event.target.unMute(); // 🚩 起動時に確実にミュート解除
                        event.target.setShuffle(true);
                        setTimeout(() => { event.target.playVideo(); }, 500);
                    },
                    'onStateChange': (event) => {
                        const btn = document.getElementById('play-pause-btn');
                        if (event.data === YT.PlayerState.PLAYING) btn.innerText = "PAUSE ⏸";
                        else if (event.data === YT.PlayerState.PAUSED) btn.innerText = "PLAY ▶";
                    },
                    'onError': (event) => event.target.nextVideo()
                }
            });

            document.getElementById('start-gate').style.opacity = '0';
            setTimeout(() => { 
                document.getElementById('start-gate').style.display = 'none'; 
                document.getElementById('ui-overlay').style.visibility = 'visible'; 
                document.getElementById('ui-overlay').style.opacity = '1'; 
            }, 1000);

            update(); setInterval(update, 1000);
        }

        // 🚩 音量調整時にミュート状態をチェックし、自動で解除するよう修正
        function changeVolume(val) { 
            if (mvPlayer && mvPlayer.setVolume) {
                const tinyVol = (val / 100) * 2;
                mvPlayer.setVolume(tinyVol); 
                
                // 音量が0より大きいのにミュート状態なら解除する
                if (tinyVol > 0) {
                    mvPlayer.unMute();
                }
            } 
        }

        function nextMV() { if (mvPlayer && mvPlayer.nextVideo) mvPlayer.nextVideo(); }
        function togglePlay() {
            if (!mvPlayer) return;
            const state = mvPlayer.getPlayerState();
            state === YT.PlayerState.PLAYING ? mvPlayer.pauseVideo() : mvPlayer.playVideo();
        }

        function update() {
            const now = new Date();
            const fmtParts = (d) => ({ date: `${d.getMonth() + 1}/${d.getDate()}`, week: WEEKS[d.getDay()] });
            const today = fmtParts(now);
            document.querySelector('#today-val .date-part').innerText = today.date;
            document.querySelector('#today-val .week-part').innerText = today.week;
            const tomDate = new Date(now); tomDate.setDate(now.getDate() + 1);
            const tomorrow = fmtParts(tomDate);
            document.querySelector('#tomorrow-val .date-part').innerText = tomorrow.date;
            document.querySelector('#tomorrow-val .week-part').innerText = tomorrow.week;
            let rawH = now.getHours(), m = String(now.getMinutes()).padStart(2, '0'), s = String(now.getSeconds()).padStart(2, '0');
            let ampm = rawH >= 12 ? 'PM' : 'AM', h = rawH % 12 || 12;
            document.getElementById('clock-display').innerHTML = `${h}:${m}:${s}<span style="font-size:10px; opacity:0.5; margin-left:8px;">${ampm}</span>`;
        }
    </script>
</body>
</html>
